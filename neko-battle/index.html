<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1c1830"><style>body{margin:0}img{max-width:100%}</style>
<title>駅前ネコ大決戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed 3D street; UI floats as thick-outlined arcade panels over it */
:root{
  --ink:#1c1830; --paper:#fff8ec; --flame:#ff5a36; --spirit:#3fb8ff;
  --steel:#2e8a57; --gold:#ffc83a; --veil:rgba(28,24,48,.84); --mute:#8d86a8;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#cfe0ea;color:var(--ink);font-family:var(--f-body);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#cfe0ea}
button{font-family:var(--f-body);font-weight:800;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--spirit);outline-offset:2px}

/* ---------- panels ---------- */
.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-start;justify-content:flex-start}
.screen>.panel{margin-top:auto}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;user-select:text;-webkit-user-select:text}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--flame)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8.5vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h1 .em{color:var(--flame);-webkit-text-stroke:0}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.lede{margin:0;font-size:14px;line-height:1.7;color:#4a4560}
label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px}
input{font:800 18px var(--f-body);padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:14px 18px;border-radius:16px;font-size:16px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);flex:1 1 180px;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.main{background:var(--flame);color:#fff}
.btn.sub{background:#fff;color:var(--ink)}
.btn.blue{background:var(--spirit);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.status{font-size:12px;color:#5b5573;display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none}
.dot.ok{background:#2fbf6a}.dot.ng{background:var(--flame)}
.keys{font-size:12px;color:#5b5573;margin:0}

/* lobby */
#lobby .panel{width:min(760px,100%)}
.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.code-pill{background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:2px dashed #b9b2cf;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:12px;text-align:center}
.slot.on{border:2px solid var(--ink);background:#fff}
.slot img{width:48px;height:48px;object-fit:contain}
.slot .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .tag{font-size:10px;color:#fff;background:var(--steel);border-radius:6px;padding:1px 6px}
.slot .tag.cpu{background:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (min-width:640px){.grid{grid-template-columns:repeat(6,1fr)}}
.card{background:#fff;border:3px solid #d8d1e8;border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font-size:13px}
.card img{width:100%;aspect-ratio:1;object-fit:contain;max-width:100%}
.card .t{font-size:10px;color:#6c6585;font-weight:500}
.card.sel{border-color:var(--ink);background:#fff1c9;box-shadow:3px 3px 0 var(--ink)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:13px}
.bar{height:10px;background:#e7e1f2;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--flame)}
.spinfo{grid-column:1/-1;background:#fff;border-radius:12px;padding:8px 10px;border:2px solid var(--ink);line-height:1.5}
.spinfo b{color:var(--flame)}
.wait{font-size:13px;color:#5b5573;text-align:center}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-body)}
.boss-bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(560px,calc(100% - 32px));display:flex;flex-direction:column;gap:4px}
.boss-name{display:flex;justify-content:space-between;align-items:baseline;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink);font-family:var(--f-display);font-size:18px}
.boss-name small{font-family:var(--f-body);font-weight:800;font-size:12px}
.hpb{height:16px;border:3px solid var(--ink);border-radius:10px;background:#3a3350;overflow:hidden;position:relative}
.hpb>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#c58bff,#7b3cff);transition:width .15s}
.hpb>i.lag{background:#fff;opacity:.7;transition:width .8s .2s}
.hpb.ph2>i:not(.lag){background:linear-gradient(#ff7a6b,#d1123f)}
.party{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.pm{display:flex;align-items:center;gap:6px;background:var(--veil);border-radius:12px;padding:4px 8px 4px 4px;width:150px;color:#fff;font-size:11px;font-weight:800}
.pm img{width:30px;height:30px;object-fit:contain}
.pm .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pm .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .hb{height:6px;border-radius:4px;background:#433b5c;overflow:hidden}
.pm .hb>i{display:block;height:100%;background:#4ee07f}
.pm.me{outline:2px solid var(--gold)}
.pm.down{opacity:.75}.pm.down .hb>i{background:var(--flame)}
.pm .st{font-size:10px;color:var(--gold)}
.topr{position:absolute;right:max(10px,env(safe-area-inset-right,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
.chip{background:var(--veil);color:#fff;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums}
#btnLeave{background:var(--veil);color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
#btnLeave.warn{background:var(--flame)}
.buffs{display:flex;gap:4px}
.buffs span{background:var(--veil);color:#fff;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:800}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;font-family:var(--f-display);font-size:clamp(34px,10vw,72px);color:#fff;
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:var(--f-body);font-weight:800;font-size:16px;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink)}
#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--veil);color:#fff;font-weight:800;font-size:13px;padding:7px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}
.dmg{position:fixed;left:0;top:0;font-family:var(--f-display);color:#fff;-webkit-text-stroke:1.5px var(--ink);font-size:22px;pointer-events:none;will-change:transform;white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:28px}.dmg.hurt{color:#ff6a6a;font-size:20px}.dmg.heal{color:#6dff9e;font-size:20px}

/* ---------- controls ---------- */
#controls{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:60%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:50%;background:rgba(28,24,48,.28);border:3px solid rgba(255,255,255,.65)}
#stickKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink)}
.abtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:var(--f-display);color:#fff;-webkit-text-stroke:1px var(--ink)}
#btnAtk{width:96px;height:96px;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(26px + env(safe-area-inset-bottom,0px));background:var(--flame);font-size:19px}
#btnSp{width:80px;height:80px;right:calc(124px + env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));font-size:14px;
  background:conic-gradient(var(--spirit) calc(var(--g,0)*1turn),#5a5373 0)}
#btnSp .in{position:absolute;inset:6px;border-radius:50%;background:#2b2546;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.1}
#btnSp.ready .in{background:#1e6fd8;animation:pulse .9s infinite alternate}
#btnSp.rev .in{background:#22a35a}
#btnSp.rev{background:#7dff9a}
#btnSp span{position:relative}
@keyframes pulse{to{box-shadow:0 0 18px 4px #7fd3ff inset}}
.abtn:active{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
#spect{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}

#result .panel{align-self:center;margin-inline:auto;text-align:center}
#result h2{font-size:40px}
.rank{display:flex;flex-direction:column;gap:6px;text-align:left}
.rank div{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.rank div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:520px){
  .pm{width:118px;font-size:10px}.pm img{width:24px;height:24px}
  .party{top:calc(60px + env(safe-area-inset-top,0px))}
  .topr{top:calc(60px + env(safe-area-inset-top,0px))}
}
@media (max-height:620px){.lede{display:none}h1{font-size:34px}.panel{padding:16px;gap:10px}}
@media (max-height:480px){
  .party{top:calc(54px + env(safe-area-inset-top,0px));gap:3px}.pm{padding:2px 6px 2px 2px}
}
</style>

</head><body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="boss-bar">
    <div class="boss-name"><span id="bossName">ヨイヤミ</span><small id="bossPh">フェーズ1</small></div>
    <div class="hpb" id="bossHpb"><i class="lag" id="bossLag" style="width:100%"></i><i id="bossHp" style="width:100%"></i></div>
  </div>
  <div class="party" id="party"></div>
  <div class="topr">
    <div class="chip" id="timer">0:00</div>
    <div class="chip" id="roomChip">ひとり</div>
    <div class="buffs" id="buffs"></div>
    <button id="btnLeave" type="button">ぬける</button>
  </div>
</div>

<div id="controls" hidden>
  <div id="stickZone"><div id="stickBase" style="left:110px;top:calc(100% - 120px)"><div id="stickKnob"></div></div></div>
  <button class="abtn" id="btnSp" type="button" aria-label="必殺技"><div class="in"><span id="spLabel">ひっさつ</span></div></button>
  <button class="abtn" id="btnAtk" type="button" aria-label="攻撃">こうげき</button>
</div>
<div id="spect" class="chip" hidden>満員のため観戦中</div>

<div id="banner"></div>
<div id="toast"></div>
<div id="dmgLayer"></div>

<section class="screen" id="title">
  <div class="panel">
    <div class="eyebrow">4人きょうりょく ボスバトル</div>
    <h1>駅前<span class="em">ネコ</span><br>大決戦</h1>
    <p class="lede">駅前のアーケード通りにボス「ヨイヤミ」があらわれた。仲間と力を合わせてたおそう。同じ合言葉を入れた人と同じ部屋で遊べて、4人に足りない分はCPUが入ります。</p>
    <label for="nick">ニックネーム<input id="nick" maxlength="10" placeholder="なまえ" autocomplete="off"></label>
    <label for="code">合言葉<input id="code" maxlength="24" placeholder="例：ねこまつり" autocomplete="off"></label>
    <div class="row">
      <button class="btn main" id="btnJoin" type="button" disabled>合言葉で部屋に入る</button>
      <button class="btn sub" id="btnSolo" type="button">ひとりで遊ぶ</button>
    </div>
    <div class="status"><span class="dot" id="netDot"></span><span id="netMsg">通信のじゅんびをしています…</span></div>
    <p class="keys">パソコン：WASD・矢印で移動／Jでこうげき／Kでひっさつ・たすける</p>
  </div>
</section>

<section class="screen" id="lobby" hidden>
  <div class="panel">
    <div class="lobby-head">
      <div><div class="eyebrow">ロビー</div><h2 id="lobbyTitle">部屋</h2></div>
      <div class="code-pill" id="lobbyCode">合言葉</div>
    </div>
    <div class="slots" id="slots"></div>
    <div class="eyebrow">キャラクターをえらぶ</div>
    <div class="grid" id="chars"></div>
    <div class="detail" id="detail"></div>
    <div class="row">
      <button class="btn main" id="btnStart" type="button">バトル開始</button>
      <button class="btn blue" id="btnDrop" type="button" hidden>途中から参加する</button>
      <button class="btn sub" id="btnExit" type="button">部屋を出る</button>
    </div>
    <div class="wait" id="lobbyWait"></div>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="panel">
    <div class="eyebrow" id="resEyebrow">バトル結果</div>
    <h2 id="resTitle">クリア！</h2>
    <p class="lede" id="resText"></p>
    <div class="rank" id="resRank"></div>
    <div class="row">
      <button class="btn main" id="btnAgain" type="button">もう一度</button>
      <button class="btn sub" id="btnTitle" type="button">タイトルへ</button>
    </div>
    <div class="wait" id="resWait"></div>
  </div>

  peers(){const T=performance.now();const out=[{peer:this.self,sameTab:true,isMe:true,kind:'viewer',presence:this.local}];
    for(const[id,o] of this.others){if(T-o.t>6000){this.others.delete(id);continue}out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:o.presence})}return out}

   screen draws and hit-tests the same thing
   ===================================================================== */
const ATK={claw:{lock:1150,end:1000},claw2:{lock:1700,end:1600},charge:{lock:1600,end:1500},slam:{lock:1450,end:1250},ring:{lock:1500,end:2000},orbs:{lock:1300,end:3300},meteor:{lock:1150,end:1700}};
function bossK(ph){return ph===2?1.15:1}
function coneHit(cx,cz,ang,R,half,px,pz){const dx=px-cx,dz=pz-cz,d=Math.hypot(dx,dz);if(d>R+.4)return false;if(d<1.1)return true;return Math.abs(angDiff(ang,Math.atan2(dz,dx)))<=half}

function orbPos(a,w,i,ee){const an=a.a+(i+w*.5)*Math.PI*2/a.n,r=1.3+ee*.0085;return{x:a.x+Math.cos(an)*r,z:a.z+Math.sin(an)*r}}
function hazardHits(a,T,px,pz,out){
  const e=T-a.t,k=bossK(a.p),dm=a.p===2?1.3:1;
  switch(a.y){
    case'claw':if(e>=800&&e<=960&&coneHit(a.x,a.z,a.a,4.6*k,1.15,px,pz))out.push([0,28*dm,a.x,a.z]);break;
    case'claw2':
      if(e>=800&&e<=960&&coneHit(a.x,a.z,a.a-.55,5*k,1.1,px,pz))out.push([0,26*dm,a.x,a.z]);
      if(e>=1350&&e<=1510&&coneHit(a.x,a.z,a.a+.55,5*k,1.1,px,pz))out.push([1,26*dm,a.x,a.z]);break;
    case'charge':if(e>=900&&e<=1450){const q=chargePos(a,T);if(Math.hypot(px-q.x,pz-q.z)<1.7*k)out.push([0,32*dm,q.x-Math.cos(a.a)*2,q.z-Math.sin(a.a)*2])}break;
    case'slam':if(e>=1000&&e<=1150&&Math.hypot(px-a.tx,pz-a.tz)<4.2*k)out.push([0,36*dm,a.tx,a.tz]);break;
    case'ring':if(e>=700&&e<=2000){const r=(e-700)/1300*11*k,d=Math.hypot(px-a.x,pz-a.z);if(r>1.5&&Math.abs(d-r)<.75)out.push([0,24*dm,a.x,a.z])}break;

function bossOverride(a,T){

const G={

function cpuNew(ch,x,z,hp,dead){const c=CHI[ch];return{ch,x,z,f:-Math.PI/2,hp:hp??c.hp,mhp:c.hp,dead:!!dead,cd:rnd(.2,.8),g:rnd(.1,.4),a:0,s:0,stun:0,iv:0,buff:{v:0,p:0,s:0,sh:0},hit:new Set(),think:0,mvx:0,mvz:0,goal:null,revT:0,dash:null}}
function humanEntries(){return participants().filter(e=>e.me?G.gid===H.gid&&G.mode!=='lobby'&&G.mode!=='title':e.pr.gid===H.gid)}
function syncRoster(initial){
  // humans currently in this game (earliest joiners first), capped at 4; CPUs fill the rest
  const T=now();
  const hs=humanEntries().sort((a,b)=>a.pr.jt-b.pr.jt).slice(0,4);
  const hk=new Set(hs.map(e=>e.me?G.myKey:e.peer));
  let ro=H.ro.slice();
  // humans who left -> CPU takes over (after a short grace period)
  ro=ro.map(r=>{
    if(r.cpu||hk.has(r.k)){delete H.gone[r.k];return r}
    if(!H.gone[r.k])H.gone[r.k]=T;
    if(T-H.gone[r.k]<2500)return r;
    const last=G.lastSeen[r.k]||{x:0,z:10,hp:CHI[r.ch].hp,dead:false};
    const k='cpu'+(H.cpuN++);H.cpus[k]=cpuNew(r.ch,last.x,last.z,last.hp,last.dead);delete H.gone[r.k];
    return{k,ch:r.ch,nm:'CPU',cpu:1};
  });
  // new humans replace CPUs
  for(const e of hs){
    const k=e.me?G.myKey:e.peer;
    if(ro.some(r=>r.k===k))continue;
    const ch=CHI[e.pr.ch]?e.pr.ch:'c1',nm=String(e.pr.nm||'プレイヤー').slice(0,10);
    if(ro.length<4){ro.push({k,ch,nm})}
    else{const ci=ro.findIndex(r=>r.cpu);if(ci<0)continue;delete H.cpus[ro[ci].k];ro[ci]={k,ch,nm}}
  }
  // keep humans' character/name fresh
  for(const r of ro){if(r.cpu)continue;const e=hs.find(x=>(x.me?G.myKey:x.peer)===r.k);if(e&&!e.me){r.nm=String(e.pr.nm||'プレイヤー').slice(0,10)}}
  // fill with CPUs
  const used=new Set(ro.map(r=>r.ch));
  while(ro.length<4){
    const ch=(CH.find(c=>!used.has(c.id))||CH[ro.length]).id;used.add(ch);
    const k='cpu'+(H.cpuN++);const sp=SPAWN[ro.length];H.cpus[k]=cpuNew(ch,sp[0],sp[1]);ro.push({k,ch,nm:'CPU',cpu:1});
  }
  H.ro=ro;
}
function spawnItem(){
  const ty=pickW([['h',4],['v',2],['p',2],['s',2]]);
  for(let tries=0;tries<12;tries++){
    const x=rnd(-AX+1,AX-1),z=rnd(-AZ+2,AZ-2);
    if(Math.hypot(x-H.b.x,z-H.b.z)<5)continue;
    if(H.it.some(i=>Math.hypot(i[2]-x,i[3]-z)<4))continue;
    H.it.push([H.itN++,ty,r2(x),r2(z)]);return;
  }
}
// all fighters as plain objects (positions in host coordinates)
function actorsForHost(){

    if(r.cpu){const c=H.cpus[r.k];if(c)out.push({k:r.k,x:c.x,z:c.z,dead:c.dead,inv:c.buff.v>now(),cpu:c});continue}
    if(r.k===G.myKey){if(G.mode==='play'&&!G.spectate)out.push({k:r.k,x:me.x,z:me.z,dead:me.dead,inv:me.buff.v>now()});continue}
    const s=G.lastSeen[r.k];if(s)out.push({k:r.k,x:s.x,z:s.z,dead:s.dead,inv:s.inv});

}
function bossAttack(b,T,acts){
  const live=acts.filter(a=>!a.dead&&!a.inv);
  if(!live.length){b.idle=900;b.stT=T;return}
  let tg=live.find(a=>a.k===b.tgt)||live[0];
  const d=Math.hypot(tg.x-b.x,tg.z-b.z);
  let opts;
  if(b.ph===1)opts=d<6?[['claw',4],['ring',2],['slam',1]]:d<11?[['charge',2],['slam',2],['orbs',2],['claw',1]]:[['charge',3],['orbs',2],['slam',2]];
  else opts=d<6?[['claw2',4],['ring',2],['meteor',2],['slam',1]]:[['charge',2],['slam',2],['orbs',2],['meteor',3]];
  opts=opts.filter(o=>o[0]!==b.last);
  const y=pickW(opts);b.last=y;
  const ang=Math.atan2(tg.z-b.z,tg.x-b.x);b.f=ang;
  const a={i:H.aid++,y,t:T,x:r2(b.x),z:r2(b.z),a:r2(ang),p:b.ph};
  if(y==='charge'){let l=0;while(l<15){const nx=b.x+Math.cos(ang)*(l+.5),nz=b.z+Math.sin(ang)*(l+.5);if(Math.abs(nx)>AX||Math.abs(nz)>AZ)break;l+=.5}a.l=r2(Math.max(2,l))}
  if(y==='slam'){const p=inArena(tg.x,tg.z);a.tx=r2(p.x);a.tz=r2(p.z)}
  if(y==='orbs'){a.n=b.ph===2?14:10;a.a=r2(rnd(0,Math.PI))}
  if(y==='meteor'){a.pts=[];for(const t of live.slice(0,4)){const p=inArena(t.x+rnd(-1,1),t.z+rnd(-1,1));a.pts.push([r2(p.x),r2(p.z)])}while(a.pts.length<6){const p=inArena(b.x+rnd(-9,9),b.z+rnd(-9,9));a.pts.push([r2(p.x),r2(p.z)])}}
  H.at.push(a);b.st='atk';b.stT=T;b.cur=a;
}
function hostBoss(dt,T,acts){
  const b=H.b;
  H.at=H.at.filter(a=>T-a.t<ATK[a.y].end+200);
  if(b.st==='awaken'){if(T-b.stT>3200){b.ph=2;b.mx=BOSS_HP[2];b.hp=b.mx;b.st='idle';b.stT=T;b.idle=1200;b.inv=0}else{b.hp=b.mx*clamp((T-b.stT)/3000,0,1)}return}
  if(b.st==='dead')return;
  if(b.st==='atk'){
    const a=b.cur,o=a&&bossOverride(a,T);
    if(o){b.x=o.x;b.z=o.z}
    if(!a||T-a.t>ATK[a.y].lock){
      if(a&&a.y==='charge'){const q=chargePos(a,a.t+1450);b.x=q.x;b.z=q.z}
      if(a&&a.y==='slam'){b.x=a.tx;b.z=a.tz}
      b.st='idle';b.stT=T;b.idle=b.ph===2?rnd(700,1300):rnd(1200,2100);b.cur=null;
      const live=acts.filter(x=>!x.dead&&!x.inv);
      if(live.length){live.sort((p,q)=>Math.hypot(p.x-b.x,p.z-b.z)-Math.hypot(q.x-b.x,q.z-b.z));b.tgt=(Math.random()<.6?live[0]:live[(Math.random()*live.length)|0]).k}
    }
    return;
  }
  // idle: walk toward target
  const live=acts.filter(x=>!x.dead&&!x.inv);
  let tg=live.find(a=>a.k===b.tgt);if(!tg&&live.length){tg=live[0];b.tgt=tg.k}
  if(tg){
    const dx=tg.x-b.x,dz=tg.z-b.z,d=Math.hypot(dx,dz),sp=b.ph===2?4.2:3.1;
    if(d>3){b.x+=dx/d*sp*dt;b.z+=dz/d*sp*dt}
    b.f=Math.atan2(dz,dx);
    const p=inArena(b.x,b.z);b.x=p.x;b.z=p.z;
  }

}
function bossDamage(dmg){
  const b=H.b;if(b.inv||b.st==='dead'||b.st==='awaken'||H.st!=='play')return;
  b.hp-=dmg;
  if(b.hp<=0){
    b.hp=0;H.at=[];b.cur=null;
    if(b.ph===1){b.st='awaken';b.stT=now();b.inv=1}
    else{b.st='dead';b.stT=now();b.inv=1;H.end=now()+2600}
  }
}
function hostHumans(){
  // read damage, revives (to CPUs), picked items, support skills from each human's presence
  for(const e of participants()){
    const k=e.me?G.myKey:e.peer;const pr=e.me?net.local:e.pr;
    if(pr.gid!==H.gid)continue;
    const d=+pr.d||0;const prev=H.taken[k]||0;
    if(d>prev){bossDamage(d-prev);H.taken[k]=d;H.cd[k]=(H.cd[k]||0)+(d-prev)}
    const rv=pr.rv||{};for(const t in rv){const sk=k+'>'+t;if(rv[t]>(H.seenRv[sk]||0)){H.seenRv[sk]=rv[t];const c=H.cpus[t];if(c&&c.dead){c.dead=false;c.hp=c.mhp*.5;c.iv=now()+2000}}}
    for(const pk of(pr.pk||[])){const i=H.it.findIndex(x=>x[0]===pk);if(i>=0)H.it.splice(i,1)}
    for(const s of(pr.sup||[])){const sk=k;if(s[0]>(H.seenSup[sk]||0)){applySupportToCpus(s);}}
    const mx=Math.max(0,...(pr.sup||[]).map(s=>s[0]));if(mx>(H.seenSup[k]||0))H.seenSup[k]=mx;
  }
}
function applySupportToCpus(s){
  const[,kind,x,z]=s;
  for(const c of Object.values(H.cpus)){if(c.dead||Math.hypot(c.x-x,c.z-z)>9)continue;if(kind==='heal')c.hp=Math.min(c.mhp,c.hp+c.mhp*.45);if(kind==='shield')c.buff.sh=now()+BUFF_T.sh}
}
function cpuSupport(kind,x,z){
  H.csSeq++;const s=[H.csSeq,kind,r2(x),r2(z)];H.cs.push(s);if(H.cs.length>4)H.cs.shift();applySupportToCpus(s);

/* ---------- shared combat helpers (used by local player and CPUs) ---------- */
function bossRadius(ph){return 1.3*bossK(ph)}
function atkMul(actor){return CHI[actor.ch].atk/10*(actor.buff.p>now()?1.5:1)}
function normalDamage(actor){const c=CHI[actor.ch];let d=c.atk*(actor.buff.p>now()?1.5:1)*rnd(.9,1.1);const crit=Math.random()<.1;if(crit)d*=1.5;return[Math.round(d),crit]}
function takeHit(actor,base,sx,sz,T){
  const c=CHI[actor.ch];let d=base*20/(20+c.def);if(actor.buff.sh>now())d*=.5;d=Math.round(d);
  actor.hp-=d;actor.iv=now()+800;actor.stun=now()+350;
  const dx=actor.x-sx,dz=actor.z-sz,l=Math.hypot(dx,dz)||1;actor.kb={vx:dx/l*9,vz:dz/l*9,until:now()+180};

}
function cpuThreat(x,z,T,atks){const out=[];for(const a of atks)for(let s=0;s<=900;s+=150){hazardHits(a,T+s,x,z,out);if(out.length)return true}return false}
function hostCpus(dt,T,acts){
  const b=H.b,br=bossRadius(b.ph),bossOk=b.st!=='awaken'&&b.st!=='dead';
  const bpos={x:b.x,z:b.z};
  for(const r of H.ro){
    if(!r.cpu)continue;const c=H.cpus[r.k];if(!c)continue;const ch=CHI[c.ch];
    // damage from boss hazards
    if(!c.dead&&now()>c.iv&&!(c.buff.v>now())&&!(c.dash)){
      for(const a of H.at){const out=[];hazardHits(a,T,c.x,c.z,out);for(const h of out){const key=a.i+'/'+h[0];if(c.hit.has(key))continue;c.hit.add(key);takeHit(c,h[1],h[2],h[3],T);break}if(now()<c.iv)break}
    }

    if(c.dash){const u=clamp((now()-c.dash.t0)/250,0,1);c.x=lerp(c.dash.fx,c.dash.tx,u);c.z=lerp(c.dash.fz,c.dash.tz,u);if(u>=1)c.dash=null;const p=inArena(c.x,c.z);c.x=p.x;c.z=p.z;continue}

function applyItem(actor,ty){

// special moves: returns boss damage for instant ones (dash/rapid/fireball handled by caller where needed)

function hostTick(dt){

function bossAttackable(w){const b=w&&w.b;return w&&w.st==='play'&&b&&!b[7]&&b[6]!=='awaken'&&b[6]!=='dead'}

function nearDowned(){

  return best;

function doAttack(T){
  const c=CHI[me.ch];if(me.cd>0)return;me.cd=c.cd;me.a++;
  const v=vis.get(G.myKey);if(v)v.lunge=1;
  const br=bossRadius(G.lastPh),bx=G.bossV.x,bz=G.bossV.z,db=Math.hypot(bx-me.x,bz-me.z);
  if(c.kind==='melee'){
    if(db<br+c.reach+2.5)me.f=Math.atan2(bz-me.z,bx-me.x);
    fxSlash(me.x+Math.cos(me.f)*.6,me.z+Math.sin(me.f)*.6,me.f,c.reach+.4,c.fx);sfx('swing');
    if(db<br+c.reach&&Math.abs(angDiff(me.f,Math.atan2(bz-me.z,bx-me.x)))<1.3){const[d,cr]=normalDamage(me);dealBoss(d,cr)}
  }else{

}
function doSpecial(T){

function pushSup(kind){me.supSeq++;me.sup.push([me.supSeq,kind,r2(me.x),r2(me.z)]);if(me.sup.length>3)me.sup.shift()}
function applySupportToMe(s){

function updateMe(dt,T){

  if(me.dead){me.moving=false;return}
  me.cd-=dt;me.g=Math.min(1,me.g+dt/c.spT);
  // movement
  let mx=input.x,mz=input.z;
  const k=input.keys;if(k.KeyA||k.ArrowLeft)mx-=1;if(k.KeyD||k.ArrowRight)mx+=1;if(k.KeyW||k.ArrowUp)mz-=1;if(k.KeyS||k.ArrowDown)mz+=1;
  const ml=Math.hypot(mx,mz);if(ml>1){mx/=ml;mz/=ml}
  me.moving=false;
  if(me.kb&&now()<me.kb.until){me.x+=me.kb.vx*dt;me.z+=me.kb.vz*dt}
  if(me.dash){const u=clamp((now()-me.dash.t0)/250,0,1);me.x=lerp(me.dash.fx,me.dash.tx,u);me.z=lerp(me.dash.fz,me.dash.tz,u);me.moving=true;if(u>=1)me.dash=null}

      const v=vis.get(G.myKey);if(v)v.lunge=1;
      if(Math.hypot(bx-me.x,bz-me.z)<bossRadius(G.lastPh)+3.2)dealBoss(Math.round(7.5*atkMul(me)),false)}
    if(me.rapid&&me.rapid.n>=10)me.rapid=null;
  }
  else if(now()>me.stun&&ml>.08){const sp=c.spd*(me.buff.s>now()?1.4:1);me.x+=mx*sp*dt;me.z+=mz*sp*dt;me.f=Math.atan2(mz,mx);me.moving=true}
  const p=inArena(me.x,me.z);me.x=p.x;me.z=p.z;

    for(const a of(w&&w.at)||[]){const out=[];hazardHits(a,HT,me.x,me.z,out);
      for(const h of out){const key=a.i+'/'+h[0];if(G.hitDone.has(key))continue;G.hitDone.add(key);
        const d=takeHit(me,h[1],h[2],h[3],HT);dmgNum(d,me.x,2,me.z,'hurt');sfx('hurt');shake(.35);const v=vis.get(G.myKey);if(v)v.flash=1;
        if(me.dead){banner('ダウン…','仲間に近づいてもらうと復活できる',2200);me.rapid=null}
        break}
      if(now()<me.iv)break}
  }
  // items
  for(const it of(w&&w.it)||[]){const[id,ty,x,z]=it;if(G.picked.has(id))continue;if(Math.hypot(x-me.x,z-me.z)<1.2){G.picked.add(id);me.pk.push(id);if(me.pk.length>8)me.pk.shift();applyItem(me,ty);sfx('item');toast(ITEM[ty].nm+'！');if(ty==='h')dmgNum('+'+Math.round(me.mhp*.45),me.x,2.2,me.z,'heal');fxBurst(x,1,z,new THREE.Color(ITEM[ty].c).getHex(),10,5,.6)}}
}
function checkRevivesAndSupport(){
  const w=G.w;if(!w)return;
  const sources=[];
  for(const e of participants()){const pr=e.me?net.local:e.pr;if(pr.gid!==G.gid)continue;sources.push([e.me?G.myKey:e.peer,pr.rv||{},pr.sup||[]])}
  sources.push(['#cpu',w.cr||{},w.cs||[]]);
  for(const[src,rv,sup] of sources){
    const n=rv[G.myKey]||0;
    if(n>(G.seenRv[src]||0)){G.seenRv[src]=n;if(me.dead){me.dead=false;me.hp=Math.round(me.mhp*.5);me.iv=now()+2000;banner('復活！','',1200);sfx('rev');fxBurst(me.x,1,me.z,0x7dff9a,16,5,.8)}}
    for(const s of sup){if(s[0]>(G.seenSup[src]||0)){G.seenSup[src]=s[0];applySupportToMe(s)}}
  }
}
function publishMe(){

const camPos=new THREE.Vector3(0,16,30),camLook=new THREE.Vector3(0,0,0);
function updateCamera(dt,T){
  let fx,fz;
  if(G.mode==='play'&&!G.spectate){fx=lerp(me.x,G.bossV.x,.28);fz=lerp(me.z,G.bossV.z,.28)}
  else if(G.mode==='play'||G.mode==='result'){fx=G.bossV.x*.5;fz=G.bossV.z+6}
  else{fx=Math.sin(T/6000)*2;fz=-2}
  const portrait=camera.aspect<.9;
  const fov=portrait?60:48;if(camera.fov!==fov){camera.fov=fov;camera.updateProjectionMatrix()}
  let hgt=portrait?12.5:9,back=portrait?19.5:16,side=-2.2,lookY=1.4,lookF=-4;
  if(G.mode==='title'||G.mode==='lobby'){hgt=5.5;back=15;side=-3.5+Math.sin(T/5000)*1.5;lookY=4;lookF=-14}
  const tp=new THREE.Vector3(fx*.75+side,hgt,fz+back),tl=new THREE.Vector3(fx*.95,lookY,fz+lookF);
  const k=Math.min(1,dt*3);camPos.lerp(tp,k);camLook.lerp(tl,k);
  camera.position.copy(camPos);
  if(shakeAmt>0){camera.position.x+=rnd(-1,1)*shakeAmt;camera.position.y+=rnd(-1,1)*shakeAmt;shakeAmt=Math.max(0,shakeAmt-dt*1.6)}
  camera.lookAt(camLook);
}

G.lastSeen={};
G.actors=[];
let lastT=now(),hudT=0,wasHost=false,lastHostPeer=null;
function frame(){
  requestAnimationFrame(frame);
  const T=now();let dt=(T-lastT)/1000;lastT=T;dt=Math.min(dt,.05);
  try{step(dt,T)}catch(err){console.error(err)}
  renderer.render(scene,camera);
}
function step(dt,T){
  if(!net.solo&&net.myPeer!=='me'&&G.myKey!==net.myPeer&&G.mode==='lobby')G.myKey=net.myPeer;
  // ---- who is host, and what world do we see
  const he=hostEntry();const amHost=!he||he.me;
  const hp=he?he.peer:null;
  if(hp!==lastHostPeer){G.off=null;lastHostPeer=hp}
  if(amHost&&!wasHost&&G.w&&G.w.st&&G.w.st!=='lobby'&&G.mode!=='title'&&!H){hostFromWorld(G.w)}
  if(!amHost&&wasHost){H=null}
  wasHost=amHost;
  if(amHost){if(H)hostTick(dt);G.w=hostWorld()}
  else if(he&&he.pr.w){const w=he.pr.w;G.w=w;const s=w.t-T;if(G.off===null||s>G.off)G.off=s;else G.off=G.off*.995+s*.005}
  const w=G.w;
  // ---- remember where every human is (host uses it for CPU takeover)
  for(const e of participants()){if(e.me)continue;const p=e.pr.p;if(p&&e.pr.gid===G.gid)G.lastSeen[e.peer]={x:p[0],z:p[1],hp:p[3],dead:!!p[5],inv:!!(p[6]&1)}}
  // ---- screen flow
  flow(w);
  if(G.mode==='play'||G.mode==='result'){
    const HT=ht();
    if(G.mode==='play'&&!G.spectate)updateMe(dt,T);
    // boss state banners
    if(w&&w.b){
      const st=w.b[6],ph=w.b[5];
      if(st!==G.lastBossSt){
        if(st==='awaken'){G.awakenAt=HT;banner('かくせい！','ヨイヤミがさらに強くなった',2600);shake(.9);sfx('boss')}
        if(st==='dead'){G.deadAt=HT;banner('たおした！','',2200);sfx('boss')}
        G.lastBossSt=st;
      }
      G.lastPh=ph;
      // flash boss when its HP drops (hits from friends and CPUs)
      if(w.b[3]<G.lastBossHp-1)BV.flash=Math.max(BV.flash,.5);G.lastBossHp=w.b[3];
    }
    checkRevivesAndSupport();
    buildActors(w);
    // render fighters
    const seen=new Set();
    for(const a of G.actors){
      seen.add(a.k);
      const v=actorVis(a.k,a.ch,a.k===G.myKey?'あなた':a.cpu?'CPU':a.nm,a.k===G.myKey?'me':a.cpu?'cpu':'human');
      if(a.k!==G.myKey){
        if(a.a!==v.a){if(v.a>=0&&a.a>v.a){v.lunge=1;const c=CHI[a.ch];if(c.kind==='melee')fxSlash(a.x+Math.cos(a.f)*.6,a.z+Math.sin(a.f)*.6,a.f,c.reach+.4,c.fx);else fireShot(a.x,a.z,a.f,c.fx,false,0,false,false)}v.a=a.a}
        if(a.s!==v.s){if(v.s>=0&&a.s>v.s)specialFx(a,CHI[a.ch],false);v.s=a.s}
      }
      updateActorVis(v,a,dt,T);
    }
    for(const k of[...vis.keys()])if(!seen.has(k))dropVis(k);
    updateBossVis(dt,HT,w);
    updateTele(HT,w);
    updateItems(T,w);
    runShots(dt,T,bossAttackable(w),bossRadius(G.lastPh));
    if(T-hudT>90){hudT=T;updateHud(w)}
    updateControls();
  }else{
    BV.g.visible=false;if(BV.sh)BV.sh.visible=false;
    for(const k of[...vis.keys()])dropVis(k);
    updateTele(0,null);updateItems(T,null);
  }
  if(G.mode!=='title')publishMe();
  runFx();runDmg();
  if(T-(G.scrT||0)>120){G.scrT=T;drawScreen(T)}
  updateCamera(dt,T);
}
function buildActors(w){
  const out=[];if(!w||!w.ro){G.actors=out;return}
  const cpus=Object.fromEntries((w.c||[]).map(c=>[c[0],c]));
  const peers=Object.fromEntries(participants().filter(e=>!e.me).map(e=>[e.peer,e.pr]));
  for(const r of w.ro){
    if(r.k===G.myKey){if(G.mode==='play'&&!G.spectate)out.push({k:r.k,ch:me.ch,nm:r.nm,x:me.x,z:me.z,f:me.f,hp:me.hp,mhp:me.mhp,dead:me.dead,flags:flags(me),moving:me.moving,iv:me.iv,local:true,a:me.a,s:me.s});continue}
    if(r.cpu){const c=cpus[r.k];if(!c)continue;out.push({k:r.k,ch:r.ch,nm:CHI[r.ch].nm,cpu:1,x:c[1],z:c[2],f:c[3],hp:c[4],mhp:c[5],dead:!!c[6],flags:c[7],a:c[8],s:c[9],moving:!!c[10]});continue}
    const pr=peers[r.k];const p=pr&&pr.p;
    if(!p||pr.gid!==G.gid){const s=G.lastSeen[r.k];if(s)out.push({k:r.k,ch:r.ch,nm:r.nm,x:s.x,z:s.z,f:0,hp:s.hp,mhp:CHI[r.ch].hp,dead:s.dead,flags:0,a:-1,s:-1});continue}
    out.push({k:r.k,ch:r.ch,nm:r.nm,x:p[0],z:p[1],f:p[2],hp:p[3],mhp:p[4],dead:!!p[5],flags:p[6],moving:!!p[7],iv:p[8]?now()+100:0,a:pr.a||0,s:pr.s||0});
  }
  G.actors=out;
}

function showScreen(id){for(const s of['title','lobby','result'])$('#'+s).hidden=s!==id;const play=G.mode==='play'||G.mode==='result';$('#hud').hidden=!play;$('#controls').hidden=!(G.mode==='play'&&!G.spectate);$('#spect').hidden=!(G.mode==='play'&&G.spectate)}
function flow(w){
  if(G.mode==='title')return;
  const st=w?w.st:'lobby';
  if(G.mode==='lobby'){
    if(st==='lobby'&&!isHost())G.readyNext=true;
    if(st==='play'&&w.gid&&w.gid!==G.gid&&(G.readyNext||G.autoJoin===w.gid))enterGame(w);
    lobbyRender(w);return;
  }
  if(G.mode==='play'){
    if(st==='lobby'||!w){toLobby();return}
    if(w.gid!==G.gid){enterGame(w);return}
    // roster changes: am I in?
    const inRo=(w.ro||[]).some(r=>r.k===G.myKey);
    if(inRo&&G.spectate){G.spectate=false;const i=w.ro.findIndex(r=>r.k===G.myKey);resetMe(G.ch,SPAWN[i][0],SPAWN[i][1]);showScreen(null)}
    if(!inRo&&!G.spectate&&w.ro&&now()-G.enteredAt>3000){G.spectate=true;showScreen(null)}
    if(st==='win'||st==='lose')showResult(w);
    return;
  }
  if(G.mode==='result'){
    if(st==='lobby'){toLobby();return}
    if(st==='play'&&w.gid!==G.gid){enterGame(w);return}
    resultButtons();
  }
}
function enterGame(w){
  G.mode='play';G.gid=w.gid;G.spectate=false;G.enteredAt=now();
  G.seenRv={};G.seenSup={};G.picked=new Set();G.hitDone=new Set();G.lastBossSt='';G.lastBossHp=1e9;BV.init=false;G.awakenAt=G.deadAt=ht();
  for(const k of[...vis.keys()])dropVis(k);
  const i=Math.max(0,(w.ro||[]).findIndex(r=>r.k===G.myKey));
  resetMe(G.ch,SPAWN[i][0],SPAWN[i][1]);
  showScreen(null);banner('バトル開始！','ヨイヤミをたおせ',1600);sfx('boss');
  try{navigator.wakeLock&&navigator.wakeLock.request('screen').catch(()=>{})}catch(e){}
}
function toLobby(){G.mode='lobby';G.autoJoin=0;G.readyNext=true;H=isHost()?null:H;showScreen('lobby');lobbyRender(G.w,true)}
function startBattle(){
  if(!isHost())return;initAudio();
  hostStart();G.w=hostWorld();G.autoJoin=G.w.gid;enterGame(G.w);
}

  }
  net.solo=false;G.joinT=now();net.code=code;G.roomLabel=raw;G.joinedAt=Date.now();H=null;
  // wait briefly to learn our own peer label
  for(let i=0;i<30;i++){const mine=(net.chan.peers()||[]).find(p=>p.sameTab);if(mine){net.myPeer=mine.peer;break}await new Promise(r=>setTimeout(r,100))}
  G.myKey=net.myPeer;
  btn.disabled=false;btn.textContent='合言葉で部屋に入る';
  G.mode='lobby';showScreen('lobby');lobbyRender(null,true);
};
async function leaveToTitle(){
  await net.leave();H=null;G.mode='title';G.w=null;G.gid=0;G.spectate=false;
  for(const k of[...vis.keys()])dropVis(k);
  showScreen('title');
}
$('#btnExit').onclick=leaveToTitle;
$('#btnTitle').onclick=leaveToTitle;
let leaveArm=0;
$('#btnLeave').onclick=()=>{const b=$('#btnLeave');if(now()-leaveArm<2500){leaveToTitle();b.classList.remove('warn');b.textContent='ぬける';return}leaveArm=now();b.classList.add('warn');b.textContent='もう一度で退出';setTimeout(()=>{b.classList.remove('warn');b.textContent='ぬける'},2500)};

/* ---------- lobby ---------- */
function charCards(){
  const box=$('#chars');box.textContent='';
  for(const c of CH){
    const b=document.createElement('button');b.type='button';b.className='card'+(c.id===G.ch?' sel':'');b.id='pick-'+c.id;
    const im=document.createElement('img');im.src=IMG[c.id];im.alt='';b.appendChild(im);
    const n=document.createElement('div');n.textContent=c.nm;b.appendChild(n);
    const t=document.createElement('div');t.className='t';t.textContent=c.type;b.appendChild(t);
    b.onclick=()=>{G.ch=c.id;store('neko.ch',c.id);charCards();detail()};
    box.appendChild(b);
  }
}
function detail(){
  const c=CHI[G.ch],d=$('#detail');d.textContent='';
  const rows=[['HP',c.hp/150,c.hp],['はやさ',c.spd/8,c.spd],['こうげき',c.atk/14,c.atk],['まもり',c.def/15,c.def]];
  for(const[l,v,n] of rows){const a=document.createElement('div');a.textContent=l;const bar=document.createElement('div');bar.className='bar';const i=document.createElement('i');i.style.width=Math.round(v*100)+'%';bar.appendChild(i);bar.title=String(n);d.append(a,bar)}
  const sp=document.createElement('div');sp.className='spinfo';
  const b=document.createElement('b');b.textContent='必殺技「'+c.sp+'」';sp.appendChild(b);sp.appendChild(document.createTextNode('　'+c.spDesc+'。ふつうの攻撃は'+(c.kind==='melee'?'近くをひっかく':'たまを飛ばす')+'タイプ。'));
  d.appendChild(sp);
}
let lobbySig='';
function lobbyRender(w,force){
  const ps=participants().sort((a,b)=>a.pr.jt-b.pr.jt);
  const host=isHost();
  const sig=JSON.stringify([ps.map(p=>[p.peer,p.pr.nm,p.pr.ch]),host,w&&w.st,G.ch,!net.solo&&ps.length<2&&G.joinT&&now()-G.joinT>15000]);
  if(sig===lobbySig&&!force)return;lobbySig=sig;
  $('#lobbyTitle').textContent=net.solo?'ひとりで遊ぶ':'部屋 '+Math.min(ps.length,4)+'/4人';
  $('#lobbyCode').textContent=net.solo?'CPU 3人といっしょ':'合言葉：'+G.roomLabel;
  const slots=$('#slots');slots.textContent='';
  for(let i=0;i<4;i++){
    const s=document.createElement('div');const p=ps[i];
    if(p){s.className='slot on';const ch=CHI[p.me?G.ch:p.pr.ch]||CH[0];const im=document.createElement('img');im.src=IMG[ch.id];im.alt='';const n=document.createElement('div');n.className='nm';n.textContent=(p.me?G.nick:String(p.pr.nm||'プレイヤー'))+(p.me?'（あなた）':'');const tg=document.createElement('div');tg.className='tag';tg.textContent=i===0?'ホスト':'参加';s.append(im,n,tg)}
    else{s.className='slot';const im=document.createElement('div');im.style.height='48px';const n=document.createElement('div');n.className='nm';n.textContent='CPU';const tg=document.createElement('div');tg.className='tag cpu';tg.textContent='自動で参加';s.append(im,n,tg)}
    slots.appendChild(s);
  }
  if(force||!$('#chars').children.length){charCards();detail()}
  const playing=w&&w.st&&w.st!=='lobby'&&!host;
  $('#btnStart').hidden=!host;
  $('#btnDrop').hidden=!(playing&&w.st==='play');
  const alone=!net.solo&&ps.length<2&&G.joinT&&now()-G.joinT>15000;
  $('#lobbyWait').textContent=alone?'まだだれも見つかりません。友だちも同じ合言葉を入れているか確認してね。つながらないときはWi‑Fiとモバイル回線を切りかえてみてね':host?(net.solo?'':'みんながそろったら「バトル開始」。足りない分はCPUが入ります'):playing?'いまバトル中です。「途中から参加する」で入れます':'ホストがバトルを始めるのを待っています';
}
$('#btnStart').onclick=startBattle;
$('#btnDrop').onclick=()=>{initAudio();const w=G.w;if(w&&w.st==='play'){G.autoJoin=w.gid;enterGame(w)}};

/* ---------- result ---------- */
function showResult(w){
  if(G.mode==='result')return;G.mode='result';
  const win=w.st==='win',rs=w.rs||{el:0,dmg:{},names:{}};
  $('#resEyebrow').textContent=win?'ヨイヤミをたおした':'ぜんめつ';
  $('#resTitle').textContent=win?'クリア！':'ざんねん…';
  $('#resTitle').style.color=win?'var(--flame)':'var(--ink)';
  $('#resText').textContent=`バトル時間 ${Math.floor(rs.el/60)}分${rs.el%60}秒`+(win?'。みんなおつかれさま！':'。アイテムと復活をうまく使ってもう一度！');
  const rk=$('#resRank');rk.textContent='';
  Object.entries(rs.dmg||{}).sort((a,b)=>b[1]-a[1]).forEach(([k,v],i)=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=(i+1)+'. '+((k===G.myKey?G.nick+'（あなた）':(rs.names||{})[k])||'?');const b=document.createElement('span');b.textContent=v+' ダメージ';d.append(a,b);rk.appendChild(d)});
  showScreen('result');resultButtons();
}
function resultButtons(){const host=isHost();$('#btnAgain').hidden=!host;$('#btnAgain').textContent=net.solo?'もう一度':'ロビーにもどる';$('#resWait').textContent=host?'':'ホストがロビーにもどるのを待っています'}
$('#btnAgain').onclick=()=>{if(!isHost())return;if(net.solo){startBattle();return}if(H){H.st='lobby'}H=null;G.w=hostWorld();toLobby()};

/* ---------- HUD ---------- */
function updateHud(w){
  if(!w||!w.b)return;
  const[,,,hp,mx,ph]=w.b;const pct=Math.max(0,hp/mx*100);
  $('#bossHp').style.width=pct+'%';$('#bossLag').style.width=pct+'%';
  $('#bossHpb').classList.toggle('ph2',ph===2);
  $('#bossName').textContent=ph===2?'覚醒ヨイヤミ':'ヨイヤミ';
  $('#bossPh').textContent=(ph===2?'フェーズ2':'フェーズ1')+'　'+Math.max(0,hp)+' / '+mx;
  const el=w.el||0;$('#timer').textContent=Math.floor(el/60)+':'+String(el%60).padStart(2,'0');
  $('#roomChip').textContent=net.solo?'ひとり':'合言葉：'+G.roomLabel;
  const party=$('#party');
  const sig=G.actors.map(a=>a.k+a.ch).join();
  if(party.dataset.sig!==sig){party.dataset.sig=sig;party.textContent='';for(const a of G.actors){const d=document.createElement('div');d.className='pm';d.dataset.k=a.k;const im=document.createElement('img');im.src=IMG[a.ch];im.alt='';const col=document.createElement('div');col.className='col';const n=document.createElement('div');n.className='n';n.textContent=a.k===G.myKey?G.nick+'（あなた）':a.cpu?CHI[a.ch].nm+'（CPU）':a.nm;const hb=document.createElement('div');hb.className='hb';hb.appendChild(document.createElement('i'));const stt=document.createElement('div');stt.className='st';col.append(n,hb,stt);d.append(im,col);party.appendChild(d)}}
  for(const el2 of party.children){const a=G.actors.find(x=>x.k===el2.dataset.k);if(!a)continue;el2.classList.toggle('me',a.k===G.myKey);el2.classList.toggle('down',a.dead);el2.querySelector('.hb>i').style.width=Math.max(0,a.hp/a.mhp*100)+'%';el2.querySelector('.st').textContent=a.dead?'ダウン中':''}
  const bf=$('#buffs');const T=now();const items=[];if(me.buff){if(me.buff.v>T)items.push('とうめい');if(me.buff.p>T)items.push('攻撃UP');if(me.buff.s>T)items.push('速さUP');if(me.buff.sh>T)items.push('けっかい')}
  const bs=items.join();if(bf.dataset.s!==bs){bf.dataset.s=bs;bf.textContent='';for(const t of items){const s=document.createElement('span');s.textContent=t;bf.appendChild(s)}}
}
function updateControls(){
  if(G.mode!=='play'||G.spectate)return;
  const b=$('#btnSp');const near=!me.dead&&nearDowned();
  b.classList.toggle('rev',!!near);b.classList.toggle('ready',!near&&me.g>=1);
  b.style.setProperty('--g',near?1:me.g.toFixed(3));
  const lbl=near?'たすける':me.g>=1?'ひっさつ':Math.floor(me.g*100)+'%';
  if($('#spLabel').textContent!==lbl)$('#spLabel').textContent=lbl;
}

/* =====================================================================
   INPUT
   ===================================================================== */
const zone=$('#stickZone'),base=$('#stickBase'),knob=$('#stickKnob');let stickId=null,sx0=0,sy0=0;
zone.addEventListener('pointerdown',e=>{initAudio();stickId=e.pointerId;zone.setPointerCapture(e.pointerId);const r=zone.getBoundingClientRect();sx0=e.clientX;sy0=e.clientY;base.style.left=(e.clientX-r.left)+'px';base.style.top=(e.clientY-r.top)+'px';moveStick(e)});
zone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
const endStick=e=>{if(e.pointerId!==stickId)return;stickId=null;input.x=input.z=0;knob.style.transform=''};
zone.addEventListener('pointerup',endStick);zone.addEventListener('pointercancel',endStick);
function moveStick(e){let dx=e.clientX-sx0,dy=e.clientY-sy0;const l=Math.hypot(dx,dy),m=52;if(l>m){dx=dx/l*m;dy=dy/l*m}knob.style.transform=`translate(${dx}px,${dy}px)`;input.x=dx/m;input.z=dy/m}
const atkB=$('#btnAtk'),spB=$('#btnSp');
atkB.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();input.atk=true;atkB.setPointerCapture(e.pointerId)});
for(const ev of['pointerup','pointercancel','lostpointercapture'])atkB.addEventListener(ev,()=>input.atk=false);
spB.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();if(G.mode==='play'&&!me.dead&&!me.dash&&!me.rapid)doSpecial(now())});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;input.keys[e.code]=true;if(e.code==='KeyK'&&!e.repeat&&G.mode==='play'&&!G.spectate&&!me.dead&&!me.dash&&!me.rapid)doSpecial(now());if(G.mode==='play'&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{input.keys[e.code]=false});
addEventListener('blur',()=>{input.keys={};input.atk=false});
document.addEventListener('contextmenu',e=>{if(G.mode==='play')e.preventDefault()});

/* =====================================================================
   BOOT
   ===================================================================== */
(async()=>{
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))])}catch(e){}
  buildStage();
  await buildCharTextures();
  buildBossVis();
  showScreen('title');
  requestAnimationFrame(frame);
})();
</script>
