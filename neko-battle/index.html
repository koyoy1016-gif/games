<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1c1830"><style>body{margin:0}img{max-width:100%}</style>
<title>駅前ネコ大決戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed third-person 3D street; arcade-style thick-outlined panels and a console button cluster */
:root{
  --ink:#1c1830; --paper:#fff8ec; --flame:#ff5a36; --spirit:#3fb8ff;
  --steel:#2e8a57; --gold:#ffc83a; --veil:rgba(28,24,48,.84); --mute:#8d86a8;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#cfe0ea;color:var(--ink);font-family:var(--f-body);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#cfe0ea}
button{font-family:var(--f-body);font-weight:800;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--spirit);outline-offset:2px}

.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-start;justify-content:flex-start}
.screen>.panel{margin-top:auto}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  padding:22px;width:min(460px,100%);display:flex;flex-direction:column;gap:14px;user-select:text;-webkit-user-select:text}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--flame)}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8.5vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h1 .em{color:var(--flame)}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.lede{margin:0;font-size:14px;line-height:1.7;color:#4a4560}
label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px}
input{font:800 18px var(--f-body);padding:12px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:14px 18px;border-radius:16px;font-size:16px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);flex:1 1 180px;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.main{background:var(--flame);color:#fff}
.btn.sub{background:#fff;color:var(--ink)}
.btn.blue{background:var(--spirit);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.status{font-size:12px;color:#5b5573;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none;margin-top:4px}
.dot.ok{background:#2fbf6a}.dot.ng{background:var(--flame)}
.keys{font-size:12px;color:#5b5573;margin:0;line-height:1.5}

#lobby .panel{width:min(640px,100%)}
.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.code-pill{background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:2px dashed #b9b2cf;border-radius:14px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;font-size:12px;text-align:center}
.slot.on{border:2px solid var(--ink);background:#fff}
.slot img,.slot .ph{width:48px;height:48px;object-fit:contain}
.slot .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .tag{font-size:10px;color:#fff;background:var(--steel);border-radius:6px;padding:1px 6px}
.slot .tag.cpu{background:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{background:#fff;border:3px solid #d8d1e8;border-radius:16px;padding:6px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink);font-size:13px;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:contain;max-width:100%}
.card .t{font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:0 6px}
.card.sel{border-color:var(--ink);background:#fff1c9;box-shadow:3px 3px 0 var(--ink)}
.detail{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:13px}
.bar{height:10px;background:#e7e1f2;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar>i{display:block;height:100%;background:var(--flame)}
.spinfo{grid-column:1/-1;background:#fff;border-radius:12px;padding:8px 10px;border:2px solid var(--ink);line-height:1.6}
.spinfo b{color:var(--flame)}
.wait{font-size:13px;color:#5b5573;text-align:center;line-height:1.5}

#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-body)}
.boss-bar{position:absolute;left:50%;transform:translateX(-50%);top:calc(10px + env(safe-area-inset-top,0px));width:min(560px,calc(100% - 32px));display:flex;flex-direction:column;gap:4px}
.boss-name{display:flex;justify-content:space-between;align-items:baseline;color:#fff;text-shadow:0 2px 0 var(--ink),0 0 6px var(--ink);font-family:var(--f-display);font-size:18px}
.boss-name small{font-family:var(--f-body);font-weight:800;font-size:12px;font-variant-numeric:tabular-nums}
.hpb{height:16px;border:3px solid var(--ink);border-radius:10px;background:#3a3350;overflow:hidden;position:relative}
.hpb>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(#c58bff,#7b3cff);transition:width .15s}
.hpb>i.lag{background:#fff;opacity:.7;transition:width .8s .2s}
.hpb.ph2>i:not(.lag){background:linear-gradient(#ff7a6b,#d1123f)}
.party{position:absolute;left:max(8px,env(safe-area-inset-left,0px));top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:5px}
.pm{display:flex;align-items:center;gap:6px;background:var(--veil);border-radius:12px;padding:3px 8px 3px 3px;width:132px;color:#fff;font-size:11px;font-weight:800}
.pm img{width:28px;height:28px;object-fit:contain}
.pm .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.pm .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm .hb{height:6px;border-radius:4px;background:#433b5c;overflow:hidden}
.pm .hb>i{display:block;height:100%;background:#4ee07f}
.pm.me{outline:2px solid var(--gold)}
.pm.tg .n::after{content:" ◀ねらわれ中";color:#ff6a6a}
.pm.down{opacity:.75}.pm.down .hb>i{background:var(--flame)}
.topr{position:absolute;right:max(8px,env(safe-area-inset-right,0px));top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:auto}
.chip{background:var(--veil);color:#fff;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:800;font-variant-numeric:tabular-nums;max-width:46vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnLeave{background:var(--veil);color:#fff;border-radius:10px;padding:6px 10px;font-size:12px}
#btnLeave.warn{background:var(--flame)}
.buffs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.buffs span{background:var(--veil);color:#fff;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:800}
#targeted{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#d1123f;color:#fff;font-weight:800;font-size:13px;padding:5px 12px;border-radius:999px;border:2px solid var(--ink);pointer-events:none;animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.55}}
#banner{position:fixed;left:0;right:0;top:30%;text-align:center;font-family:var(--f-display);font-size:clamp(34px,10vw,72px);color:#fff;
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:var(--f-body);font-weight:800;font-size:16px;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink)}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);background:var(--veil);color:#fff;font-weight:800;font-size:14px;padding:7px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
#toast.show{opacity:1}
.dmg{position:fixed;left:0;top:0;font-family:var(--f-display);color:#fff;-webkit-text-stroke:1.5px var(--ink);font-size:22px;pointer-events:none;will-change:transform;white-space:nowrap}
.dmg.crit{color:var(--gold);font-size:30px}.dmg.big{color:#ff8a3a;font-size:38px}.dmg.hurt{color:#ff6a6a;font-size:20px}.dmg.heal{color:#6dff9e;font-size:20px}.dmg.burn{color:#ffb347;font-size:16px}

/* controls: joystick left, console cluster right (A big, X above, Y left, jump top-left) */
#controls{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:52%;height:55%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;background:rgba(28,24,48,.28);border:3px solid rgba(255,255,255,.65)}
#stickKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,255,255,.9);border:3px solid var(--ink)}
.cluster{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:196px;height:196px;pointer-events:none}
.abtn{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid var(--ink);box-shadow:3px 4px 0 var(--ink);
  display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;line-height:1.05;padding:0}
.abtn b{font-family:var(--f-display);font-weight:400;font-size:22px;-webkit-text-stroke:1px var(--ink)}
.abtn span{font-size:10px;font-weight:800;text-shadow:0 1px 0 var(--ink)}
.abtn:active,.abtn.down{transform:translate(2px,3px);box-shadow:1px 1px 0 var(--ink)}
#bA{width:86px;height:86px;right:0;bottom:22px;background:var(--flame)}
#bA b{font-size:30px}
#bX{width:70px;height:70px;right:8px;bottom:118px;background:conic-gradient(var(--c,#3fb8ff) calc(var(--g,1)*1turn),#5a5373 0)}
#bX .in{position:absolute;inset:5px;border-radius:50%;background:#2b2546;display:flex;flex-direction:column;align-items:center;justify-content:center}
#bX.ready .in{background:var(--c,#1e6fd8)}
#bX.rev{background:#7dff9a}#bX.rev .in{background:#22a35a}
#bX .in *{position:relative}
#bY{width:66px;height:66px;right:96px;bottom:6px;background:#2fbf6a}
#bJ{width:60px;height:60px;right:104px;bottom:92px;background:#ffc83a;color:var(--ink)}
#bJ span{color:var(--ink);text-shadow:none}
#spect{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}

#result .panel{align-self:center;margin-inline:auto;text-align:center}
#result h2{font-size:40px}
.rank{display:flex;flex-direction:column;gap:6px;text-align:left}
.rank div{display:flex;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.rank div span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-height:620px){.lede{display:none}h1{font-size:34px}.panel{padding:16px;gap:10px}}
@media (max-width:420px){.pm{width:112px;font-size:10px}.pm img{width:22px;height:22px}}
</style>

</head><body>
<canvas id="gl"></canvas>

<div id="hud" hidden>
  <div class="boss-bar">
    <div class="boss-name"><span id="bossName">ヨイヤミ</span><small id="bossPh">フェーズ1</small></div>
    <div class="hpb" id="bossHpb"><i class="lag" id="bossLag" style="width:100%"></i><i id="bossHp" style="width:100%"></i></div>
  </div>
  <div class="party" id="party"></div>
  <div class="topr">
    <div class="chip" id="timer">0:00</div>
    <div class="chip" id="roomChip">ひとり</div>
    <div class="buffs" id="buffs"></div>
    <button id="btnLeave" type="button">ぬける</button>
  </div>
  <div id="targeted" hidden>ねらわれている！</div>
</div>

<div id="controls" hidden>
  <div id="stickZone"><div id="stickBase" style="left:96px;top:calc(100% - 120px)"><div id="stickKnob"></div></div></div>
  <div class="cluster">
    <button class="abtn" id="bJ" type="button" aria-label="ジャンプ"><b>⤒</b><span>ジャンプ</span></button>
    <button class="abtn" id="bX" type="button" aria-label="属性わざ"><div class="in"><b>X</b><span id="xLabel">わざ</span></div></button>
    <button class="abtn" id="bY" type="button" aria-label="回避"><b>Y</b><span>かいひ</span></button>
    <button class="abtn" id="bA" type="button" aria-label="攻撃"><b>A</b><span>こうげき</span></button>
  </div>
</div>
<div id="spect" class="chip" hidden>満員のため観戦中</div>

<div id="banner"></div>
<div id="toast"></div>
<div id="dmgLayer"></div>

<section class="screen" id="title">
  <div class="panel">
    <div class="eyebrow">4人きょうりょく 3Dボスバトル</div>
    <h1>駅前<span class="em">ネコ</span><br>大決戦</h1>
    <p class="lede">駅前のアーケード通りに化けネコ「ヨイヤミ」があらわれた。同じ合言葉を入れた人と同じ部屋で遊べて、4人に足りない分はCPUが入ります。</p>
    <label for="nick">ニックネーム<input id="nick" maxlength="10" placeholder="なまえ" autocomplete="off"></label>
    <label for="code">合言葉<input id="code" maxlength="24" placeholder="例：ねこまつり" autocomplete="off"></label>
    <div class="row">
      <button class="btn main" id="btnJoin" type="button" disabled>合言葉で部屋に入る</button>
      <button class="btn sub" id="btnSolo" type="button">ひとりで遊ぶ</button>
    </div>
    <div class="status"><span class="dot" id="netDot"></span><span id="netMsg">通信のじゅんびをしています…</span></div>
    <p class="keys">パソコン：WASDで移動／J＝A こうげき／K＝X わざ／L＝Y かいひ／スペース＝ジャンプ</p>
  </div>
</section>

<section class="screen" id="lobby" hidden>
  <div class="panel">
    <div class="lobby-head">
      <div><div class="eyebrow">ロビー</div><h2 id="lobbyTitle">部屋</h2></div>
      <div class="code-pill" id="lobbyCode">合言葉</div>
    </div>
    <div class="slots" id="slots"></div>
    <div class="eyebrow">キャラクターをえらぶ</div>
    <div class="grid" id="chars"></div>
    <div class="detail" id="detail"></div>
    <div class="row">
      <button class="btn main" id="btnStart" type="button">バトル開始</button>
      <button class="btn blue" id="btnDrop" type="button" hidden>途中から参加する</button>
      <button class="btn sub" id="btnExit" type="button">部屋を出る</button>
    </div>
    <div class="wait" id="lobbyWait"></div>
  </div>
</section>

<section class="screen" id="result" hidden>
  <div class="panel">
    <div class="eyebrow" id="resEyebrow">バトル結果</div>
    <h2 id="resTitle">クリア！</h2>
    <p class="lede" id="resText"></p>
    <div class="rank" id="resRank"></div>
    <div class="row">
      <button class="btn main" id="btnAgain" type="button">もう一度</button>
      <button class="btn sub" id="btnTitle" type="button">タイトルへ</button>
    </div>
    <div class="wait" id="resWait"></div>
  </div>
</section>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

/* =====================================================================
   DATA — 4 original allies, one boss
   ===================================================================== */
const CH=[
  {id:'fire',nm:'ホムラ',el:'炎',type:'ほのお',hp:110,spd:6.4,atk:11,def:10,kind:'melee',reach:2.4,cd:.36,xName:'ほのおのいき',xShort:'ほのお',xDesc:'前に炎をはいてダメージ。ボスは4秒間もえつづける',xCd:7,col:'#ff5a36',fx:0xff7a2a},
  {id:'aqua',nm:'シズク',el:'水',type:'えんきょり',hp:90,spd:6.6,atk:10,def:8,kind:'shot',range:15,cd:.32,xName:'つらぬきビーム',xShort:'ビーム',xDesc:'遠くまでとどく水のビームで大ダメージ',xCd:8,col:'#3fb8ff',fx:0x4fd3ff},
  {id:'leaf',nm:'ミント',el:'草',type:'かいふく',hp:100,spd:6.0,atk:8,def:11,kind:'shot',range:10,cd:.42,xName:'いやしのはな',xShort:'かいふく',xDesc:'まわりの仲間みんなのHPを大きく回復',xCd:10,col:'#2fbf6a',fx:0x7dff9a},
  {id:'rock',nm:'ガンテツ',el:'岩',type:'いちげき',hp:150,spd:5.2,atk:15,def:15,kind:'melee',reach:2.9,cd:.72,xName:'だいちくだき',xShort:'いちげき',xDesc:'ためてハンマーをふりおろす一撃。当たればとても大ダメージ',xCd:9,col:'#b7793f',fx:0xffd08a},
];
const CHI=Object.fromEntries(CH.map(c=>[c.id,c]));
const BOSS_HP=[0,2800,3600];
const AX=7.4, AZ=21;
const SPAWN=[[-4.5,12],[-1.5,13],[1.5,13],[4.5,12]];
const ITEM={h:{nm:'回復',k:'回',c:'#2fbf6a'},v:{nm:'とうめい',k:'消',c:'#8a5cff'},p:{nm:'攻撃アップ',k:'攻',c:'#ff5a36'},s:{nm:'スピードアップ',k:'速',c:'#1e8fe0'}};
const BUFF_T={v:6000,p:10000,s:8000};
const GRAV=22, JUMPV=8.2, ROLL_MS=420, ROLL_IF=340;

/* =====================================================================
   UTIL
   ===================================================================== */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const r2=v=>Math.round(v*100)/100;
const now=()=>performance.now();
const rnd=(a,b)=>a+Math.random()*(b-a);
function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function hashStr(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function pickW(list){let s=0;for(const x of list)s+=x[1];let r=Math.random()*s;for(const x of list){r-=x[1];if(r<=0)return x[0]}return list[0][0]}
const easeOut=t=>1-(1-t)*(1-t);
let toastT=0;
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),1600)}
let bannerT=0;
function banner(main,sub,ms=1800){const el=$('#banner');el.textContent=main;if(sub){const s=document.createElement('small');s.textContent=sub;el.appendChild(s)}el.classList.add('show');clearTimeout(bannerT);bannerT=setTimeout(()=>el.classList.remove('show'),ms)}

let AC=null;const sfxLast={};
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
function sfx(type){

  const P={hit:[620,200,.08,'square',.05],sp:[260,980,.4,'sawtooth',.06],hurt:[220,70,.22,'triangle',.12],boss:[110,38,.8,'sawtooth',.09],item:[700,1400,.16,'sine',.09],rev:[380,1100,.45,'sine',.09],swing:[300,140,.07,'triangle',.04],slam:[90,30,.4,'square',.08],jump:[300,600,.12,'sine',.05],dodge:[900,1500,.2,'sine',.07],big:[140,40,.5,'square',.1]}[type];

const net={
  room:null, chan:null, solo:true, fallback:false, code:'', label:'', myPeer:'me', local:{},
  set(p){Object.assign(this.local,p);if(this.chan&&!this.solo){this.chan.presence(p).catch(()=>{})}},
  list(){
    if(this.solo||!this.chan)return [{peer:'me',me:true,pr:this.local}];
    const out=[];let saw=false;
    for(const x of this.chan.peers()){
      if(x.sameTab){saw=true;this.myPeer=x.peer;out.push({peer:x.peer,me:true,pr:this.local});continue}
      if(x.kind!=='viewer')continue;
      const pr=x.presence||{};
      if(this.fallback&&pr.code!==this.code)continue;
      if(typeof pr.jt!=='number')continue;
      out.push({peer:x.peer,me:false,pr});
    }
    if(!saw)out.push({peer:this.myPeer,me:true,pr:this.local});
    return out;
  },
  async leave(){

/* P2P (no login): WebRTC between players, found through public Nostr relays.
   Presence objects are broadcast ~20x/s so the rest of the netcode stays the same. */
const PUBLIC_URL='https://koyoy1016-gif.github.io/games/neko-battle/';
class P2PChan{
  constructor(room,selfId){
    this.room=room;this.self=selfId;this.local={};this.others=new Map();this.dirty=true;this.lastSend=0;
    this.act=room.makeAction('pr');
    this.act.onMessage=(data,ctx)=>{if(data&&typeof data==='object'&&ctx&&ctx.peerId)this.others.set(ctx.peerId,{presence:data,t:performance.now()})};
    room.onPeerJoin=id=>{this.act.send(this.local,{target:id}).catch(()=>{})};
    room.onPeerLeave=id=>{this.others.delete(id)};
    this.iv=setInterval(()=>this.flush(),50);
  }
  presence(p){for(const k in p){if(p[k]===null)delete this.local[k];else this.local[k]=p[k]}this.dirty=true;return Promise.resolve()}
  flush(){const T=performance.now();if(!this.dirty&&T-this.lastSend<1000)return;this.dirty=false;this.lastSend=T;try{this.act.send(this.local).catch(()=>{})}catch(e){}}
  peers(){const T=performance.now();const out=[{peer:this.self,sameTab:true,isMe:true,kind:'viewer',presence:this.local}];
    for(const[id,o] of this.others){if(T-o.t>6000){this.others.delete(id);continue}out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:o.presence})}return out}
  async leave(){clearInterval(this.iv);try{await this.room.leave()}catch(e){}}
}

function animChar(m,st,dt,T){
  const u=m.userData,ch=st.ch;
  const moving=st.moving&&!st.dead;
  u.phase+=dt*(moving?11:0);
  const sw=Math.sin(u.phase);
  let lL=moving?sw*.8:0,lR=moving?-sw*.8:0;
  let aL=moving?-sw*.6:Math.sin(T/500)*.05,aR=moving?sw*.6:-Math.sin(T/500)*.05;
  u.bodyG.position.y=-.7+(moving?Math.abs(Math.cos(u.phase))*.07:Math.sin(T/420)*.012);
  // A attack swing
  const ea=(T-u.atkT)/1000;
  if(ea<.34){const k=ea/.34;if(ch==='rock'){aR=lerp(-2.9,-.3,easeOut(clamp(k*1.3,0,1)));aL=aR*.8}else if(CHI[ch]&&CHI[ch].kind==='shot'){aR=-1.5}else{aR=lerp(-2.3,.4,easeOut(k));aL=-.6}}
  // X skill pose
  const ex=(T-u.castT)/1000;
  if(ex<.8){
    if(ch==='rock'){if(ex<.5){aR=aL=lerp(-1,-3.0,ex/.5)}else{const k=clamp((ex-.5)/.18,0,1);aR=aL=lerp(-3.0,-.2,easeOut(k))}}
    else if(ch==='fire'){aL=aR=-1.3;u.head.rotation.x=-.2}
    else{aL=aR=lerp(-2.8,-2.4,Math.sin(ex*10)*.5+.5)}
  }else u.head.rotation.x=0;
  if(st.y>.05){lL=-.7;lR=-.3;aL=Math.min(aL,-.8);aR=Math.min(aR,-.8)}
  u.legL.rotation.x=lL;u.legR.rotation.x=lR;u.armL.rotation.x=aL;u.armR.rotation.x=aR;
  // roll: tumble forward around body center
  const er=(T-u.rollT)/ROLL_MS;u.pivot.rotation.x=er>=0&&er<1?easeOut(er)*Math.PI*2:0;
  if(st.dead){u.pivot.rotation.z=1.45;u.pivot.position.y=.32}else{u.pivot.rotation.z=0;u.pivot.position.y=.7}
  for(const t of u.tails)t.g.rotation.y+=(Math.sin(T/260+t.g.position.x*9)*.45-t.g.rotation.y)*.2;
  if(u.acc.orb){const a=T/400;u.acc.orb.position.set(Math.cos(a)*.6,1.1+Math.sin(T/300)*.08,Math.sin(a)*.6)}
  if(u.acc.flames)for(const f of u.acc.flames)if(f.isSprite)f.scale.setScalar(.6+Math.sin(T/70+f.id)*.08);
  // flash / invisible / dead tint
  const hit=clamp(1-(T-u.hitT)/180,0,1);
  const inv=!!(st.flags&1);
  for(const mt of u.mats){mt.emissive&&!mt.userData.keep&&mt.emissive.setRGB(hit*.8,hit*.15,hit*.15);mt.transparent=inv||st.dead;mt.opacity=inv?.3:st.dead?.7:1}
  for(const o of u.outs)o.visible=!inv;
  const blink=st.iv&&T<st.iv&&!st.dead&&((T/80|0)%2===0);u.pivot.visible=!blink;
  m.position.set(st.x,st.y||0,st.z);m.rotation.y=Math.PI/2-st.f;
  u.sh.position.y=.04-(st.y||0);u.sh.scale.setScalar(1/(1+(st.y||0)*.4));
}

const ATK={claw:{lock:1050,end:950},charge:{lock:1450,end:1350},shot:{lock:1000,end:2800},drop:{lock:2100,end:2600},warp:{lock:1500,end:1900},ring:{lock:1500,end:1900},meteor:{lock:1100,end:1700}};

function bossRadius(ph){return 1.45*bossK(ph)}
function coneHit(cx,cz,ang,R,half,px,pz){const dx=px-cx,dz=pz-cz,d=Math.hypot(dx,dz);if(d>R+.4)return false;if(d<1.2)return true;return Math.abs(angDiff(ang,Math.atan2(dz,dx)))<=half}

function shotPos(a,i,ee){const n=a.n,an=a.a+(i-(n-1)/2)*.26,r=1.6+ee*.011;return{x:a.x+Math.cos(an)*r,z:a.z+Math.sin(an)*r}}
const WARP_HIT=[1200,1700];
// out: [subId, damage, srcX, srcZ, ground]
function hazardHits(a,T,px,pz,py,out){
  const e=T-a.t,k=bossK(a.p),dm=a.p===2?1.3:1;py=py||0;
  switch(a.y){
    case'claw':{const tl=a.p===2?600:700;if(e>=tl&&e<=tl+160&&coneHit(a.x,a.z,a.a,3.9*k,1.05,px,pz))out.push([0,26*dm,a.x,a.z,0]);break}
    case'charge':if(e>=800&&e<=1300){const q=chargePos(a,T);if(Math.hypot(px-q.x,pz-q.z)<1.6*k)out.push([0,30*dm,q.x-Math.cos(a.a)*2,q.z-Math.sin(a.a)*2,0])}break;
    case'shot':{const ee=e-500;if(ee>=0&&ee<=2200&&py<1.2)for(let i=0;i<a.n;i++){const o=shotPos(a,i,ee);if(Math.hypot(px-o.x,pz-o.z)<.75)out.push([1+i,16*dm,a.x,a.z,0])}break}
    case'drop':
      if(e>=1700&&e<=1850&&Math.hypot(px-a.tx,pz-a.tz)<3.1*k)out.push([0,34*dm,a.tx,a.tz,0]);
      if(e>=1750&&e<=2550&&py<.55){const r=(e-1750)/800*10,d=Math.hypot(px-a.tx,pz-a.tz);if(r>3.2&&Math.abs(d-r)<.6)out.push([1,18*dm,a.tx,a.tz,1])}
      break;
    case'warp':{const hits=a.p===2?2:1;for(let h=0;h<hits;h++){const t0=WARP_HIT[h];if(e>=t0&&e<=t0+160&&a.wx!==undefined&&coneHit(a.wx,a.wz,a.aw,3.7*k,1.1,px,pz))out.push([h,30*dm,a.wx,a.wz,0])}break}
    case'ring':if(e>=600&&e<=1800&&py<.55){const r=(e-600)/1200*11*k,d=Math.hypot(px-a.x,pz-a.z);if(r>1.6&&Math.abs(d-r)<.6)out.push([0,22*dm,a.x,a.z,1])}break;
    case'meteor':if(e>=1400&&e<=1560)a.pts.forEach((q,i)=>{if(Math.hypot(px-q[0],pz-q[1])<2.4)out.push([i,28*dm,q[0],q[1],0])});break;
  }
}
// boss pose override while an attack moves it
function bossOverride(a,T){
  const e=T-a.t;
  if(a.y==='charge'&&e>=800&&e<=1450){const q=chargePos(a,T);return{x:q.x,z:q.z,y:0}}
  if(a.y==='drop'&&e>=0&&e<=1850){
    if(e<500)return{x:a.x,z:a.z,y:easeOut(e/500)*20,air:1};
    if(e<1300)return{x:a.x,z:a.z,y:20,air:1,hidden:1};
    if(e<1700){const u=(e-1300)/400;return{x:a.tx,z:a.tz,y:20*(1-u*u),air:1}}
    return{x:a.tx,z:a.tz,y:0};
  }
  if(a.y==='warp'&&e>=0&&e<=1950){
    if(e<450)return{x:a.x,z:a.z,y:0,fade:1-e/450};
    if(e<900||a.wx===undefined)return{x:a.x,z:a.z,y:0,hidden:1};
    return{x:a.wx,z:a.wz,y:0,fade:clamp((e-900)/120,0,1),face:a.aw};

}

  const hs=humanEntries().sort((a,b)=>a.pr.jt-b.pr.jt).slice(0,4);
  const hk=new Set(hs.map(e=>e.me?G.myKey:e.peer));

    return{k,ch:r.ch,nm:'CPU',cpu:1};
  });

function doRoll(T){

  let dx=G.move.x,dz=G.move.z;if(Math.hypot(dx,dz)<.1){dx=-G.camF.x;dz=-G.camF.z}const l=Math.hypot(dx,dz)||1;
  me.roll={t0:T,dx:dx/l,dz:dz/l};me.rollCd=T+ROLL_MS+260;me.r++;me.f=Math.atan2(dz,dx);
  const v=vis.get(G.myKey);if(v)v.m.userData.rollT=T;sfx('dodge');

function updateMe(dt,T){
  const c=CHI[me.ch],w=G.w;
  if(me.dead){me.moving=false;return}
  me.cd-=dt;me.xcd=Math.max(0,me.xcd-dt);
  physics(me,dt);
  // camera-relative movement
  let ix=input.x,iz=input.z;const k=input.keys;
  if(k.KeyA||k.ArrowLeft)ix-=1;if(k.KeyD||k.ArrowRight)ix+=1;if(k.KeyW||k.ArrowUp)iz-=1;if(k.KeyS||k.ArrowDown)iz+=1;
  const ml=Math.hypot(ix,iz);if(ml>1){ix/=ml;iz/=ml}
  const F=G.camF,R={x:-F.z,z:F.x};
  G.move={x:R.x*ix-F.x*iz,z:R.z*ix-F.z*iz};
  me.moving=false;
  if(me.kb&&now()<me.kb.until){me.x+=me.kb.vx*dt;me.z+=me.kb.vz*dt}
  if(me.roll){const e=T-me.roll.t0;if(e>ROLL_MS)me.roll=null;else{const sp=12*(1-e/ROLL_MS)+2;me.x+=me.roll.dx*sp*dt;me.z+=me.roll.dz*sp*dt;me.moving=false}}
  else if(me.heavy){if(T-me.heavy.t0>=500){const ok=bossAttackable(w);const d=ok?xDamage(me,{x:G.bossV.x,z:G.bossV.z},G.lastPh):0;heavyLand(me);if(d)dealBoss(d,'big');me.heavy=null}}
  else if(now()>me.stun&&ml>.08){const sp=c.spd*(me.buff.s>now()?1.4:1);me.x+=G.move.x*sp*dt;me.z+=G.move.z*sp*dt;me.f=Math.atan2(G.move.z,G.move.x);me.moving=me.y===0}
  const p=inArena(me.x,me.z);me.x=p.x;me.z=p.z;
  if(input.A||k.KeyJ){if(now()>me.stun)doA(T)}
  // hazards (rolling i-frames turn a would-be hit into a just dodge)
  const HT=ht(),rollIF=me.roll&&T-me.roll.t0<ROLL_IF;
  if((now()>me.iv||rollIF)&&!(me.buff.v>now())){
    for(const a of(w&&w.at)||[]){const out=[];hazardHits(a,HT,me.x,me.z,me.y,out);
      for(const h of out){const key=a.i+'/'+h[0];if(G.hitDone.has(key))continue;G.hitDone.add(key);
        if(rollIF){if(T-me.lastJust>800){me.lastJust=T;me.buff.p=now()+3000;me.xcd=Math.max(0,me.xcd-2.5);banner('ジャスト回避！','3秒間 攻撃アップ',900);sfx('dodge');fxBurst(me.x,1,me.z,0x9fffe0,12,5,.6)}continue}
        const d=takeHit(me,h[1],h[2],h[3]);dmgNum(d,me.x,2,me.z,'hurt');sfx('hurt');shake(.35);const v=vis.get(G.myKey);if(v)v.m.userData.hitT=T;
        if(me.dead){banner('ダウン…','仲間に近づいてXでたすけてもらおう',2200)}break}
      if(now()<me.iv&&!rollIF)break}
  }
  for(const it of(w&&w.it)||[]){const[id,ty,x,z]=it;if(G.picked.has(id))continue;if(Math.hypot(x-me.x,z-me.z)<1.2&&me.y<1.5){G.picked.add(id);me.pk.push(id);if(me.pk.length>8)me.pk.shift();applyItem(me,ty);sfx('item');toast(ITEM[ty].nm+'！');if(ty==='h')dmgNum('+'+Math.round(me.mhp*.45),me.x,2.2,me.z,'heal');fxBurst(x,1,z,new THREE.Color(ITEM[ty].c).getHex(),10,5,.6)}}
}
function checkRevivesAndSupport(){
  const w=G.w;if(!w)return;const src=[];
  for(const e of participants()){const pr=e.me?net.local:e.pr;if(pr.gid!==G.gid)continue;src.push([e.me?G.myKey:e.peer,pr.rv||{},pr.sup||[]])}
  src.push(['#cpu',w.cr||{},w.cs||[]]);
  for(const[s,rv,sup] of src){
    const n=rv[G.myKey]||0;if(n>(G.seenRv[s]||0)){G.seenRv[s]=n;if(me.dead){me.dead=false;me.hp=Math.round(me.mhp*.5);me.iv=now()+2000;banner('復活！','',1200);sfx('rev');fxBurst(me.x,1,me.z,0x7dff9a,16,5,.8)}}
    for(const x of sup)if(x[0]>(G.seenSup[s]||0)){G.seenSup[s]=x[0];applySupportToMe(x)}
  }
}

const camPos=new THREE.Vector3(0,6,30),camLook=new THREE.Vector3(0,1,0);
G.camYaw=-Math.PI/2;G.camF={x:0,z:-1};G.move={x:0,z:0};
function updateCamera(dt,T){
  const portrait=camera.aspect<.9;
  const fov=portrait?64:52;if(camera.fov!==fov){camera.fov=fov;camera.updateProjectionMatrix()}
  let tp,tl;
  if(G.mode==='play'&&!G.spectate){
    const bx=G.bossV.x,bz=G.bossV.z,d=Math.hypot(bx-me.x,bz-me.z);
    if(d>2.2&&!G.bossV.hidden){const want=Math.atan2(bz-me.z,bx-me.x);G.camYaw+=angDiff(G.camYaw,want)*Math.min(1,dt*2.6)}
    const F={x:Math.cos(G.camYaw),z:Math.sin(G.camYaw)};G.camF=F;
    const near=clamp(1-d/7,0,1)*(G.bossV.hidden?0:1);
    const dist=(portrait?6.4:7.2)+near*1.8,h=(portrait?3.5:3.2)+near*1.6;
    let cx=me.x-F.x*dist,cz=me.z-F.z*dist;
    // keep the camera out of the buildings
    const lim=7.9;if(Math.abs(cx)>lim){const t=(Math.sign(cx)*lim-me.x)/(cx-me.x);cx=me.x+(cx-me.x)*t;cz=me.z+(cz-me.z)*t}
    tp=new THREE.Vector3(cx,h+me.y*.4,cz);tl=new THREE.Vector3(me.x+F.x*3,1.3+me.y*.5+near*.8,me.z+F.z*3);
    const k=Math.min(1,dt*7);camPos.lerp(tp,k);camLook.lerp(tl,k);
  }else{
    if(G.mode==='play'||G.mode==='result'){const a=T/4000;tp=new THREE.Vector3(G.bossV.x+Math.cos(a)*9,5,G.bossV.z+Math.sin(a)*9);tl=new THREE.Vector3(G.bossV.x,2,G.bossV.z)}
    else{tp=new THREE.Vector3(-3.5+Math.sin(T/5000)*1.5,4.5,13);tl=new THREE.Vector3(0,3.2,-14)}
    const k=Math.min(1,dt*2.5);camPos.lerp(tp,k);camLook.lerp(tl,k);
  }
  camera.position.copy(camPos);
  if(shakeAmt>0){camera.position.x+=rnd(-1,1)*shakeAmt*.6;camera.position.y+=rnd(-1,1)*shakeAmt*.6;shakeAmt=Math.max(0,shakeAmt-dt*1.6)}
  camera.lookAt(camLook);
}

let lastT=now(),hudT=0,wasHost=false,lastHostPeer=null;
function frame(){requestAnimationFrame(frame);const T=now();let dt=Math.min((T-lastT)/1000,.05);lastT=T;try{step(dt,T)}catch(err){console.error(err)}renderer.render(scene,camera)}
function step(dt,T){
  if(!net.solo&&net.myPeer!=='me'&&G.myKey!==net.myPeer&&G.mode==='lobby')G.myKey=net.myPeer;
  const he=hostEntry(),amHost=!he||he.me,hp=he?he.peer:null;
  if(hp!==lastHostPeer){G.off=null;lastHostPeer=hp}
  if(amHost&&!wasHost&&G.w&&G.w.st&&G.w.st!=='lobby'&&G.mode!=='title'&&!H)hostFromWorld(G.w);
  if(!amHost&&wasHost)H=null;
  wasHost=amHost;
  if(amHost){if(H)hostTick(dt);G.w=hostWorld()}
  else if(he&&he.pr.w){const w=he.pr.w;G.w=w;const s=w.t-T;if(G.off===null||s>G.off)G.off=s;else G.off=G.off*.995+s*.005}
  const w=G.w;
  for(const e of participants()){if(e.me)continue;const p=e.pr.p;if(p&&e.pr.gid===G.gid)G.lastSeen[e.peer]={x:p[0],z:p[1],f:p[2],hp:p[3],dead:!!p[5],inv:!!(p[6]&1)}}
  flow(w);
  if(G.mode==='play'||G.mode==='result'){
    const HT=ht();
    if(w&&w.b){
      const st=w.b[6];
      if(st!==G.lastBossSt){if(st==='awaken'){G.awakenAt=HT;banner('かくせい！','ヨイヤミがさらに強くなった',2600);shake(.9);sfx('boss')}if(st==='dead'){G.deadAt=HT;banner('たおした！','',2200);sfx('boss')}G.lastBossSt=st}
      G.lastPh=w.b[5];if(w.b[3]<G.lastBossHp-1)G.bossFlash=Math.max(G.bossFlash||0,.5);G.lastBossHp=w.b[3];
    }
    if(G.mode==='play'&&!G.spectate)updateMe(dt,T);
    checkRevivesAndSupport();
    buildActors(w);
    const seen=new Set();
    for(const a of G.actors){
      seen.add(a.k);
      const v=actorVis(a.k,a.ch,a.k===G.myKey?'あなた':a.cpu?'CPU':a.nm,a.k===G.myKey?'me':a.cpu?'cpu':'human');
      if(a.k!==G.myKey){
        const c=CHI[a.ch];
        if(a.a!==v.a){if(v.a>=0&&a.a>v.a){v.m.userData.atkT=T;if(c.kind==='melee')fxSlash(a.x+Math.cos(a.f)*.6,a.z+Math.sin(a.f)*.6,a.f,c.reach+.4,c.fx);else fireShot(a.x,a.z,a.f,c.fx,0,false,false)}v.a=a.a}
        if(a.s!==v.s){if(v.s>=0&&a.s>v.s){v.m.userData.castT=T;xFx(a,c);if(c.id==='rock')setTimeout(()=>heavyLand(a),500)}v.s=a.s}
        if(a.r!==v.r){if(v.r>=0&&a.r>v.r)v.m.userData.rollT=T;v.r=a.r}
      }
      updateActorVis(v,a,dt,T);
    }
    for(const k of[...vis.keys()])if(!seen.has(k))dropVis(k);
    updateBossVis(dt,HT,w);updateTele(HT,w);updateItems(T,w);
    runShots(dt,bossAttackable(w),bossRadius(G.lastPh));runBurn(T);
    if(T-hudT>90){hudT=T;updateHud(w)}
    updateControls(T);
  }else{
    if(BOSS){BOSS.visible=false;bossAura.visible=false;marker.visible=false}
    for(const k of[...vis.keys()])dropVis(k);updateTele(0,null);updateItems(T,null);
  }
  if(G.mode!=='title')publishMe();
  runFx();runDmg();
  if(T-(G.scrT||0)>120){G.scrT=T;drawScreen(T)}
  updateCamera(dt,T);
}
function buildActors(w){
  const out=[];if(!w||!w.ro){G.actors=out;return}
  const cpus=Object.fromEntries((w.c||[]).map(c=>[c[0],c]));
  const peers=Object.fromEntries(participants().filter(e=>!e.me).map(e=>[e.peer,e.pr]));
  for(const r of w.ro){
    if(r.k===G.myKey){if(G.mode==='play'&&!G.spectate)out.push({k:r.k,ch:me.ch,nm:r.nm,x:me.x,z:me.z,y:me.y,f:me.f,hp:me.hp,mhp:me.mhp,dead:me.dead,flags:flags(me),moving:me.moving,iv:me.iv,local:true,a:me.a,s:me.s,r:me.r});continue}
    if(r.cpu){const c=cpus[r.k];if(!c)continue;out.push({k:r.k,ch:r.ch,nm:CHI[r.ch].nm,cpu:1,x:c[1],z:c[2],f:c[3],hp:c[4],mhp:c[5],dead:!!c[6],flags:c[7],a:c[8],s:c[9],moving:!!c[10],y:c[11]||0,r:c[12]||0});continue}
    const pr=peers[r.k],p=pr&&pr.p;
    if(!p||pr.gid!==G.gid){const s=G.lastSeen[r.k];if(s)out.push({k:r.k,ch:r.ch,nm:r.nm,x:s.x,z:s.z,y:0,f:s.f||0,hp:s.hp,mhp:CHI[r.ch].hp,dead:s.dead,flags:0,a:-1,s:-1,r:-1});continue}
    out.push({k:r.k,ch:r.ch,nm:r.nm,x:p[0],z:p[1],f:p[2],hp:p[3],mhp:p[4],dead:!!p[5],flags:p[6],moving:!!p[7],iv:p[8]?now()+100:0,y:p[9]||0,a:pr.a||0,s:pr.s||0,r:pr.r||0});
  }
  G.actors=out;
}

function showScreen(id){for(const s of['title','lobby','result'])$('#'+s).hidden=s!==id;const play=G.mode==='play'||G.mode==='result';$('#hud').hidden=!play;$('#controls').hidden=!(G.mode==='play'&&!G.spectate);$('#spect').hidden=!(G.mode==='play'&&G.spectate)}
function flow(w){
  if(G.mode==='title')return;
  const st=w?w.st:'lobby';
  if(G.mode==='lobby'){if(st==='lobby'&&!isHost())G.readyNext=true;if(st==='play'&&w.gid&&w.gid!==G.gid&&(G.readyNext||G.autoJoin===w.gid))enterGame(w);lobbyRender(w);return}
  if(G.mode==='play'){
    if(st==='lobby'||!w){toLobby();return}
    if(w.gid!==G.gid){enterGame(w);return}
    const inRo=(w.ro||[]).some(r=>r.k===G.myKey);
    if(inRo&&G.spectate){G.spectate=false;const i=w.ro.findIndex(r=>r.k===G.myKey);resetMe(G.ch,SPAWN[i][0],SPAWN[i][1]);showScreen(null)}
    if(!inRo&&!G.spectate&&w.ro&&now()-G.enteredAt>3000){G.spectate=true;showScreen(null)}
    if(st==='win'||st==='lose')showResult(w);
    return;
  }
  if(G.mode==='result'){if(st==='lobby'){toLobby();return}if(st==='play'&&w.gid!==G.gid){enterGame(w);return}resultButtons()}
}

$('#btnExit').onclick=leaveToTitle;$('#btnTitle').onclick=leaveToTitle;
let leaveArm=0;
$('#btnLeave').onclick=()=>{const b=$('#btnLeave');if(now()-leaveArm<2500){leaveToTitle();b.classList.remove('warn');b.textContent='ぬける';return}leaveArm=now();b.classList.add('warn');b.textContent='もう一度で退出';setTimeout(()=>{b.classList.remove('warn');b.textContent='ぬける'},2500)};

function charCards(){
  const box=$('#chars');box.textContent='';
  for(const c of CH){
    const b=document.createElement('button');b.type='button';b.className='card'+(c.id===G.ch?' sel':'');b.id='pick-'+c.id;
    const im=document.createElement('img');im.src=THUMB[c.id]||'';im.alt='';b.appendChild(im);
    const n=document.createElement('div');n.textContent=c.nm;b.appendChild(n);
    const t=document.createElement('div');t.className='t';t.style.background=c.col;t.textContent=c.type;b.appendChild(t);
    b.onclick=()=>{G.ch=c.id;store('neko.ch3d',c.id);charCards();detail()};box.appendChild(b);
  }
}
function detail(){
  const c=CHI[G.ch],d=$('#detail');d.textContent='';
  for(const[l,v] of[['HP',c.hp/150],['はやさ',c.spd/8],['こうげき',c.atk/15],['まもり',c.def/15]]){const a=document.createElement('div');a.textContent=l;const bar=document.createElement('div');bar.className='bar';const i=document.createElement('i');i.style.width=Math.round(v*100)+'%';i.style.background=c.col;bar.appendChild(i);d.append(a,bar)}
  const sp=document.createElement('div');sp.className='spinfo';
  const b=document.createElement('b');b.textContent='X「'+c.xName+'」';sp.appendChild(b);
  sp.appendChild(document.createTextNode('　'+c.xDesc+'。Aのこうげきは'+(c.kind==='melee'?(c.id==='rock'?'おそいけど重いハンマー':'すばやいひっかき'):'たまを飛ばす')+'タイプ。'));
  d.appendChild(sp);
}
let lobbySig='';
function lobbyRender(w,force){
  const ps=participants().sort((a,b)=>a.pr.jt-b.pr.jt),host=isHost();
  const alone=!net.solo&&ps.length<2&&G.joinT&&now()-G.joinT>15000;
  const sig=JSON.stringify([ps.map(p=>[p.peer,p.pr.nm,p.pr.ch]),host,w&&w.st,G.ch,alone]);
  if(sig===lobbySig&&!force)return;lobbySig=sig;
  $('#lobbyTitle').textContent=net.solo?'ひとりで遊ぶ':'部屋 '+Math.min(ps.length,4)+'/4人';
  $('#lobbyCode').textContent=net.solo?'CPU 3人といっしょ':'合言葉：'+G.roomLabel;
  const slots=$('#slots');slots.textContent='';
  for(let i=0;i<4;i++){
    const s=document.createElement('div');const p=ps[i];
    if(p){s.className='slot on';const ch=CHI[p.me?G.ch:p.pr.ch]||CH[0];const im=document.createElement('img');im.src=THUMB[ch.id]||'';im.alt='';const n=document.createElement('div');n.className='nm';n.textContent=(p.me?G.nick:String(p.pr.nm||'プレイヤー'))+(p.me?'（あなた）':'');const tg=document.createElement('div');tg.className='tag';tg.textContent=i===0?'ホスト':'参加';s.append(im,n,tg)}
    else{s.className='slot';const ph=document.createElement('div');ph.className='ph';const n=document.createElement('div');n.className='nm';n.textContent='CPU';const tg=document.createElement('div');tg.className='tag cpu';tg.textContent='自動で参加';s.append(ph,n,tg)}
    slots.appendChild(s);
  }
  if(force||!$('#chars').children.length){charCards();detail()}
  const playing=w&&w.st&&w.st!=='lobby'&&!host;
  $('#btnStart').hidden=!host;$('#btnDrop').hidden=!(playing&&w.st==='play');
  $('#lobbyWait').textContent=alone?'まだだれも見つかりません。友だちも同じ合言葉を入れているか確認してね。つながらないときはWi‑Fiとモバイル回線を切りかえてみてね':host?(net.solo?'':'みんながそろったら「バトル開始」。足りない分はCPUが入ります'):playing?'いまバトル中です。「途中から参加する」で入れます':'ホストがバトルを始めるのを待っています';
}
$('#btnStart').onclick=startBattle;
$('#btnDrop').onclick=()=>{initAudio();const w=G.w;if(w&&w.st==='play'){G.autoJoin=w.gid;enterGame(w)}};
function showResult(w){
  if(G.mode==='result')return;G.mode='result';
  const win=w.st==='win',rs=w.rs||{el:0,dmg:{},names:{}};
  $('#resEyebrow').textContent=win?'ヨイヤミをたおした':'ぜんめつ';$('#resTitle').textContent=win?'クリア！':'ざんねん…';$('#resTitle').style.color=win?'var(--flame)':'var(--ink)';
  $('#resText').textContent=`バトル時間 ${Math.floor(rs.el/60)}分${rs.el%60}秒`+(win?'。みんなおつかれさま！':'。Yの回避とジャンプをうまく使ってもう一度！');
  const rk=$('#resRank');rk.textContent='';
  Object.entries(rs.dmg||{}).sort((a,b)=>b[1]-a[1]).forEach(([k,v],i)=>{const d=document.createElement('div');const a=document.createElement('span');a.textContent=(i+1)+'. '+((k===G.myKey?G.nick+'（あなた）':(rs.names||{})[k])||'?');const b=document.createElement('span');b.textContent=v+' ダメージ';d.append(a,b);rk.appendChild(d)});
  showScreen('result');resultButtons();
}
function resultButtons(){const host=isHost();$('#btnAgain').hidden=!host;$('#btnAgain').textContent=net.solo?'もう一度':'ロビーにもどる';$('#resWait').textContent=host?'':'ホストがロビーにもどるのを待っています'}
$('#btnAgain').onclick=()=>{if(!isHost())return;if(net.solo){startBattle();return}H=null;G.w=hostWorld();toLobby()};
function updateHud(w){
  if(!w||!w.b)return;
  const[,,,hp,mx,ph,,,tgt]=w.b;const pct=Math.max(0,hp/mx*100);
  $('#bossHp').style.width=pct+'%';$('#bossLag').style.width=pct+'%';$('#bossHpb').classList.toggle('ph2',ph===2);
  $('#bossName').textContent=ph===2?'覚醒ヨイヤミ':'ヨイヤミ';$('#bossPh').textContent=(ph===2?'フェーズ2':'フェーズ1')+'　'+Math.max(0,hp)+' / '+mx;
  const el=w.el||0;$('#timer').textContent=Math.floor(el/60)+':'+String(el%60).padStart(2,'0');
  $('#roomChip').textContent=net.solo?'ひとり':'合言葉：'+G.roomLabel;
  $('#targeted').hidden=!(tgt===G.myKey&&G.mode==='play'&&!me.dead&&w.st==='play');
  const party=$('#party'),sig=G.actors.map(a=>a.k+a.ch).join();
  if(party.dataset.sig!==sig){party.dataset.sig=sig;party.textContent='';for(const a of G.actors){const d=document.createElement('div');d.className='pm';d.dataset.k=a.k;const im=document.createElement('img');im.src=THUMB[a.ch]||'';im.alt='';const col=document.createElement('div');col.className='col';const n=document.createElement('div');n.className='n';n.textContent=a.k===G.myKey?G.nick:a.cpu?CHI[a.ch].nm+'(CPU)':a.nm;const hb=document.createElement('div');hb.className='hb';hb.appendChild(document.createElement('i'));col.append(n,hb);d.append(im,col);party.appendChild(d)}}
  for(const el2 of party.children){const a=G.actors.find(x=>x.k===el2.dataset.k);if(!a)continue;el2.classList.toggle('me',a.k===G.myKey);el2.classList.toggle('down',a.dead);el2.classList.toggle('tg',a.k===tgt);el2.querySelector('.hb>i').style.width=Math.max(0,a.hp/a.mhp*100)+'%'}
  const bf=$('#buffs'),T=now(),items=[];if(me.buff){if(me.buff.v>T)items.push('とうめい');if(me.buff.p>T)items.push('攻撃UP');if(me.buff.s>T)items.push('速さUP')}if(me.burn&&T<me.burn.until)items.push('もやし中');
  const bs=items.join();if(bf.dataset.s!==bs){bf.dataset.s=bs;bf.textContent='';for(const t of items){const s=document.createElement('span');s.textContent=t;bf.appendChild(s)}}
}
function updateControls(T){
  if(G.mode!=='play'||G.spectate)return;
  const c=CHI[me.ch],b=$('#bX'),near=!me.dead&&nearDowned();
  b.style.setProperty('--c',c.col);
  const g=near?1:1-me.xcd/c.xCd;
  b.classList.toggle('rev',!!near);b.classList.toggle('ready',!near&&me.xcd<=0);b.style.setProperty('--g',g.toFixed(3));
  const lbl=near?'たすける':me.xcd>0?Math.ceil(me.xcd)+'秒':c.xShort;if($('#xLabel').textContent!==lbl)$('#xLabel').textContent=lbl;
}

/* =====================================================================
   INPUT
   ===================================================================== */
const zone=$('#stickZone'),base=$('#stickBase'),knob=$('#stickKnob');let stickId=null,sx0=0,sy0=0;
zone.addEventListener('pointerdown',e=>{initAudio();stickId=e.pointerId;zone.setPointerCapture(e.pointerId);const r=zone.getBoundingClientRect();sx0=e.clientX;sy0=e.clientY;base.style.left=(e.clientX-r.left)+'px';base.style.top=(e.clientY-r.top)+'px';moveStick(e)});
zone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
const endStick=e=>{if(e.pointerId!==stickId)return;stickId=null;input.x=input.z=0;knob.style.transform=''};
zone.addEventListener('pointerup',endStick);zone.addEventListener('pointercancel',endStick);
function moveStick(e){let dx=e.clientX-sx0,dy=e.clientY-sy0;const l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m}knob.style.transform=`translate(${dx}px,${dy}px)`;input.x=dx/m;input.z=dy/m}
function btn(id,down,up){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(_){}if(G.mode==='play'&&!G.spectate)down()});for(const ev of['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{el.classList.remove('down');up&&up()})}
btn('#bA',()=>{input.A=true},()=>{input.A=false});
btn('#bX',()=>{if(!me.dead)doX(now())});
btn('#bY',()=>doRoll(now()));
btn('#bJ',()=>doJump());
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;input.keys[e.code]=true;if(G.mode==='play'&&!G.spectate&&!e.repeat){if(e.code==='KeyK'&&!me.dead)doX(now());if(e.code==='KeyL')doRoll(now());if(e.code==='Space')doJump()}if(G.mode==='play'&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{input.keys[e.code]=false});
addEventListener('blur',()=>{input.keys={};input.A=false});
document.addEventListener('contextmenu',e=>{if(G.mode==='play')e.preventDefault()});

/* =====================================================================
   BOOT
   ===================================================================== */
(async()=>{
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))])}catch(e){}
  buildStage();buildBossVis();makeThumbs();
  // a resting boss on the title street
  showScreen('title');requestAnimationFrame(frame);
})();
</script>
