<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#1c1830"><style>body{margin:0}img{max-width:100%}</style>
<title>駅前ネコ大決戦</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
/* Layout: full-bleed third-person street; console-style HUD — hex portraits, chevron bars, hex button cluster */
:root{
  --ink:#1c1830; --paper:#fff8ec; --flame:#ff5a36; --spirit:#3fb8ff; --steel:#2e8a57; --gold:#ffc83a;
  --navy:#1b1f5e; --navy2:#2b3290; --veil:rgba(20,18,44,.82); --mute:#8d86a8; --hp:#38d26a; --boss:#e04bd8;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden;background:#cfe0ea;color:var(--ink);font-family:var(--f-body);}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;background:#cfe0ea}
button{font-family:var(--f-body);font-weight:800;cursor:pointer;border:0}
button:focus-visible,input:focus-visible{outline:3px solid var(--spirit);outline-offset:2px}

.screen{position:fixed;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:flex-start;justify-content:flex-start}
.screen>.panel{margin-top:auto}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);
  padding:20px;width:min(460px,100%);display:flex;flex-direction:column;gap:12px;user-select:text;-webkit-user-select:text}
.eyebrow{font-weight:800;font-size:12px;letter-spacing:.14em;color:var(--flame)}
.area{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:var(--navy);color:#fff;border-radius:8px;padding:4px 10px 4px 6px;font-weight:800;font-size:12px}
.area b{background:var(--gold);color:var(--ink);border-radius:5px;padding:1px 6px;font-size:11px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,8.5vw,52px);line-height:1.05;margin:0;text-wrap:balance}
h1 .em{color:var(--flame)}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:0}
.lede{margin:0;font-size:14px;line-height:1.7;color:#4a4560}
label{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px}
input{font:800 18px var(--f-body);padding:11px 14px;border:3px solid var(--ink);border-radius:14px;background:#fff;color:var(--ink);width:100%;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:13px 18px;border-radius:16px;font-size:16px;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);flex:1 1 160px;transition:transform .08s}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.main{background:var(--flame);color:#fff}.btn.sub{background:#fff;color:var(--ink)}.btn.blue{background:var(--spirit);color:var(--ink)}
.btn[disabled]{opacity:.45;pointer-events:none}
.status{font-size:12px;color:#5b5573;display:flex;align-items:flex-start;gap:8px;line-height:1.5}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mute);flex:none;margin-top:4px}
.dot.ok{background:#2fbf6a}.dot.ng{background:var(--flame)}
.keys{font-size:11px;color:#5b5573;margin:0;line-height:1.5}

#lobby .panel{width:min(640px,100%)}
.lobby-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.code-pill{background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px;font-weight:800;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{border:2px dashed #b9b2cf;border-radius:14px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0;font-size:11px;text-align:center}
.slot.on{border:2px solid var(--ink);background:#fff}
.slot img,.slot .ph{width:52px;height:52px;object-fit:contain}
.slot .nm{font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot .tag{font-size:10px;color:#fff;background:var(--steel);border-radius:6px;padding:1px 6px}
.slot .tag.cpu{background:var(--mute)}
.pn{font-family:var(--f-display);font-weight:400;font-size:11px;color:#fff;border-radius:5px;padding:0 5px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:420px}
.yopts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.yopt{background:#fff;border:3px solid #d8d1e8;border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--ink);min-width:0}
.yopt b{font-size:13px}.yopt span{font-size:10px;font-weight:500;color:#5b5573;line-height:1.3;text-align:center}
.yopt.sel{border-color:var(--ink);background:#d9ffe4;box-shadow:3px 3px 0 var(--ink)}
.card{position:relative;background:#fff;border:3px solid #d8d1e8;border-radius:14px;padding:4px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink);font-size:12px;min-width:0}
.card img{width:100%;aspect-ratio:1;object-fit:contain;max-width:100%}
.card .t{font-size:10px;font-weight:800;color:#fff;border-radius:6px;padding:0 6px}
.card.sel{border-color:var(--ink);background:#fff1c9;box-shadow:3px 3px 0 var(--ink)}
.card .who{position:absolute;top:2px;left:2px;display:flex;gap:2px;flex-wrap:wrap}
.detail{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;align-items:center;font-size:12px}
.detail .ttl{grid-column:1/-1;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.detail .ttl b{font-family:var(--f-display);font-weight:400;font-size:18px}
.detail .ty{font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:1px 7px}
.bar{height:9px;background:#e7e1f2;border-radius:6px;overflow:hidden;border:2px solid var(--ink)}
.bar>i{display:block;height:100%}
.moves{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:4px 8px;background:#fff;border-radius:12px;padding:8px 10px;border:2px solid var(--ink);line-height:1.45}
.moves .k{font-family:var(--f-display);font-weight:400;font-size:12px;color:#fff;border-radius:6px;padding:0 6px;align-self:start;text-align:center}
.wait{font-size:13px;color:#5b5573;text-align:center;line-height:1.5}

/* ---------- HUD (console style) ---------- */
#hud{position:fixed;inset:0;pointer-events:none;font-family:var(--f-body)}
.bossbar{position:absolute;left:max(6px,env(safe-area-inset-left,0px));right:calc(112px + env(safe-area-inset-right,0px));max-width:520px;top:calc(8px + env(safe-area-inset-top,0px));display:flex;align-items:center}
.hex{width:48px;height:48px;flex:none;position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.5))}
.hex::before{content:"";position:absolute;inset:0;background:#0d0f33;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
.hex::after{content:"";position:absolute;inset:4px;background:linear-gradient(#6f6890,#3b3558);clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
.hex img{position:absolute;inset:4px;width:calc(100% - 8px);height:calc(100% - 8px);object-fit:cover;z-index:1;clip-path:polygon(25% 2%,75% 2%,100% 50%,75% 98%,25% 98%,0 50%)}
.cbar{position:relative;flex:1;height:20px;margin-left:-8px;filter:drop-shadow(0 2px 0 rgba(0,0,0,.45))}
.cbar .trk{position:absolute;inset:0;background:#0d0f33;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%)}
.cbar .in{position:absolute;inset:3px 12px 3px 10px;background:var(--navy);overflow:hidden;clip-path:polygon(0 0,calc(100% - 4px) 0,100% 50%,calc(100% - 4px) 100%,0 100%)}
.cbar .in i{position:absolute;inset:0 auto 0 0;transition:width .12s}
.cbar .in i.lag{background:#ff3048;transition:width .9s .25s}
.cbar .in i.fill{background:linear-gradient(#ff9af3 0,#e04bd8 45%,#a51ea0 100%)}
.cbar .in::after{content:"";position:absolute;inset:0 0 55% 0;background:rgba(255,255,255,.18)}
.cbar.ph2 .in i.fill{background:linear-gradient(#ffb0a0 0,#ff3d5a 45%,#a5102a 100%)}
.bossbar .cbar{height:24px}
.party{position:absolute;left:max(6px,env(safe-area-inset-left,0px));top:calc(64px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px}
.pm{display:flex;align-items:center;width:150px;pointer-events:auto;cursor:pointer}
.pm.sel .por{border-color:#2fbf6a;box-shadow:0 0 0 2px #0d0f33,0 0 10px 3px #7dff9a}
.pm .heal{position:absolute;left:-2px;bottom:-4px;z-index:3;font-size:9px;font-weight:800;color:#fff;background:#22a35a;border-radius:6px;padding:0 4px;border:2px solid #0d0f33}
.pm .por{width:44px;height:44px;flex:none;border-radius:50%;background:radial-gradient(#fff,#d9e2ff);border:3px solid #d1123f;box-shadow:0 0 0 2px #0d0f33;overflow:hidden;position:relative;z-index:1}
.pm .por img{width:100%;height:100%;object-fit:cover}
.pm .el{position:absolute;left:30px;top:-4px;z-index:2;font-family:var(--f-display);font-size:10px;color:#fff;border-radius:6px;padding:0 4px;border:2px solid #0d0f33}
.pm .cbar{height:16px;margin-left:-10px}
.pm .cbar .in{inset:3px 12px 3px 12px}
.pm .cbar .in i.fill{background:linear-gradient(#a8ffb8 0,#38d26a 50%,#1d8a45 100%)}
.pm.me .cbar .trk{background:var(--gold)}
.pm.me .por{border-color:var(--gold)}
.pm.down{opacity:.7}.pm.down .por img{filter:grayscale(1)}
.pm.tg .por{animation:tg .5s infinite alternate}
@keyframes tg{to{box-shadow:0 0 0 2px #0d0f33,0 0 10px 4px #ff2a4a}}
.pm .wrap{position:relative;display:flex;align-items:center;flex:1}
.topr{position:absolute;right:max(6px,env(safe-area-inset-right,0px));top:calc(8px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:flex-end;gap:5px;pointer-events:auto}
#mapBox{width:96px;height:150px;border-radius:12px;border:3px solid #0d0f33;background:#2a3060;box-shadow:0 2px 0 rgba(0,0,0,.4);overflow:hidden;cursor:pointer;position:relative}
#mapBox canvas{width:100%;height:100%;display:block}
#mapBox.big{position:fixed;right:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(320px,80vw);height:min(500px,70vh);z-index:30}
#mapBox .hint{position:absolute;right:4px;bottom:3px;font-size:9px;color:#fff;font-weight:800;opacity:.8}
.chip{background:var(--veil);color:#fff;border-radius:10px;padding:4px 9px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#btnLeave,#btnCam,#btnBgm{background:var(--veil);color:#fff;border-radius:10px;padding:5px 9px;font-size:11px}
#btnCam{background:#2b3290;border:2px solid #fff}
#btnLeave.warn{background:var(--flame)}
.buffs{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:150px}
.buffs span{background:var(--veil);color:#fff;border-radius:8px;padding:2px 7px;font-size:10px;font-weight:800}
#targeted{position:fixed;left:50%;top:calc(60px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:#d1123f;color:#fff;font-weight:800;font-size:12px;padding:3px 12px;border-radius:999px;border:2px solid #0d0f33;pointer-events:none;animation:blink .6s infinite alternate}
@keyframes blink{to{opacity:.55}}
#banner{position:fixed;left:0;right:0;top:28%;text-align:center;font-family:var(--f-display);font-size:clamp(34px,10vw,70px);color:#fff;
  -webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--ink);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;z-index:20}
#banner.show{opacity:1;transform:scale(1)}
#banner small{display:block;font-family:var(--f-body);font-weight:800;font-size:16px;-webkit-text-stroke:0;text-shadow:0 2px 0 var(--ink)}
#banner .ar{display:inline-block;font-family:var(--f-body);font-size:15px;-webkit-text-stroke:0;text-shadow:none;background:var(--navy);border:2px solid var(--ink);color:#fff;border-radius:8px;padding:2px 12px;margin-bottom:6px}
#skill{position:fixed;right:0;top:30%;pointer-events:none;opacity:0;transform:translateX(30px);transition:opacity .2s,transform .2s;z-index:19}
#skill.show{opacity:1;transform:none}
#skill div{background:linear-gradient(90deg,rgba(13,15,51,0),rgba(13,15,51,.92) 22%);color:#fff;font-family:var(--f-display);font-size:26px;padding:6px 18px 6px 50px;-webkit-text-stroke:.5px #000}
#skill small{display:block;font-family:var(--f-body);font-weight:800;font-size:11px;color:var(--gold)}
#spTitle{position:fixed;left:0;right:0;top:40%;display:flex;justify-content:center;gap:2px;pointer-events:none;z-index:21;opacity:0}
#spTitle span{font-family:var(--f-display);font-size:clamp(46px,15vw,96px);color:#fff;-webkit-text-stroke:3px #1c1830;text-shadow:0 0 18px #ffcf5a,4px 5px 0 #1c1830;display:inline-block;opacity:0;transform:scale(2.4) rotate(-8deg)}
#spTitle.show{opacity:1}
#spTitle.show span{animation:spIn .28s cubic-bezier(.2,1.6,.4,1) forwards,spOut .35s 1.25s ease-in forwards}
#spTitle.show span:nth-child(2){animation-delay:.08s,1.25s}#spTitle.show span:nth-child(3){animation-delay:.16s,1.25s}#spTitle.show span:nth-child(4){animation-delay:.24s,1.25s}
@keyframes spIn{to{opacity:1;transform:none}}@keyframes spOut{to{opacity:0;transform:scale(1.4)}}
#introCard{position:fixed;left:0;right:0;bottom:22%;text-align:center;pointer-events:none;z-index:20;animation:icIn .5s ease-out}
#introCard .ic-sub{display:inline-block;background:#d1123f;color:#fff;font-weight:800;font-size:13px;padding:2px 12px;border-radius:4px;letter-spacing:.2em}
#introCard .ic-name{font-family:var(--f-display);font-size:clamp(40px,12vw,76px);color:#fff;-webkit-text-stroke:2px #1c1830;text-shadow:0 0 22px #ff3048,4px 4px 0 #1c1830;line-height:1.15}
#introCard .ic-line{display:inline-block;background:rgba(13,15,51,.8);color:#fff;font-weight:800;font-size:13px;padding:4px 12px;border-radius:8px}
@keyframes icIn{from{opacity:0;transform:translateX(-40px)}}
#introNum{position:fixed;inset:0;pointer-events:none;z-index:19}
#atkName{position:fixed;left:50%;top:33%;transform:translate(-50%,-6px);background:linear-gradient(90deg,rgba(90,0,20,0),rgba(90,0,20,.9) 18%,rgba(90,0,20,.9) 82%,rgba(90,0,20,0));color:#fff;font-family:var(--f-display);font-size:18px;padding:3px 34px;pointer-events:none;opacity:0;transition:opacity .15s,transform .15s;white-space:nowrap;z-index:17;-webkit-text-stroke:.5px #000}
#atkName b{font-family:var(--f-body);font-weight:800;font-size:11px;color:#ffb0b8;margin-right:6px}
#atkName.show{opacity:1;transform:translate(-50%,0)}
#cine{position:fixed;inset:0;pointer-events:none;z-index:16}
#cine i{position:absolute;left:0;right:0;height:0;background:#000;transition:height .35s ease-out}
#cine .lbT{top:0}#cine .lbB{bottom:0}
#cine.on i{height:10vh}
#cine .skip{position:absolute;right:14px;bottom:calc(10vh + 10px);color:#fff;font-weight:800;font-size:12px;opacity:0;transition:opacity .3s .3s;text-shadow:0 1px 2px #000}
#cine.on .skip{opacity:.85}
#toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--veil);color:#fff;font-weight:800;font-size:14px;padding:6px 14px;border-radius:999px;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap;z-index:18}
#toast.show{opacity:1}
#overlay{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:5}
#fxc{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
.dmg{position:fixed;left:0;top:0;font-family:var(--f-display);color:#fff;-webkit-text-stroke:1.5px var(--ink);font-size:22px;pointer-events:none;will-change:transform;white-space:nowrap;z-index:8}
.dmg.crit{color:var(--gold);font-size:30px}.dmg.sp{color:#ffe14a;font-size:58px;-webkit-text-stroke:2.5px #7a1a00;text-shadow:0 0 18px #ff6a00}.dmg.critTag{color:#fff;background:#d1123f;font-family:var(--f-body);font-weight:800;font-size:13px;-webkit-text-stroke:0;padding:1px 8px;border-radius:8px;border:2px solid var(--ink)}.dmg.big{color:#ff8a3a;font-size:36px}.dmg.hurt{color:#ff6a6a;font-size:20px}.dmg.heal{color:#6dff9e;font-size:20px}.dmg.burn{color:#ffb347;font-size:16px}.dmg.sm{font-size:16px}

/* ---------- controls: joystick + hex button cluster ---------- */
#controls{position:fixed;inset:0;pointer-events:none}
#stickZone{position:absolute;left:0;bottom:0;width:50%;height:55%;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:124px;height:124px;margin:-62px 0 0 -62px;border-radius:50%;background:rgba(13,15,51,.3);border:3px solid rgba(255,255,255,.65)}
#stickKnob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,255,255,.92);border:3px solid var(--ink)}
.cluster{position:absolute;right:calc(6px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));width:190px;height:190px;pointer-events:none}
.hb{position:absolute;pointer-events:auto;touch-action:none;background:none;padding:0;filter:drop-shadow(2px 3px 0 #0d0f33)}
.hb .o{position:absolute;inset:0;background:#0d0f33;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)}
.hb .c{position:absolute;inset:4px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;line-height:1.05;overflow:hidden}
.hb .c::before{content:"";position:absolute;inset:0 0 50% 0;background:rgba(255,255,255,.2)}
.hb b{font-family:var(--f-display);font-weight:400;font-size:22px;-webkit-text-stroke:1px #0d0f33;position:relative}
.hb span{font-size:9px;font-weight:800;text-shadow:0 1px 0 #0d0f33;position:relative;white-space:nowrap}
.hb.down{transform:translate(2px,3px);filter:drop-shadow(0 0 0 #0d0f33)}
.hb .gauge{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(255,255,255,.35);transition:height .1s}
#bA{width:92px;height:80px;right:0;bottom:24px}#bA .c{background:linear-gradient(#ff8a5a,#e5361a)}#bA b{font-size:30px}
#bX{width:76px;height:66px;right:6px;bottom:116px}#bX .c{background:linear-gradient(#5ac8ff,#1e6fd8)}
#bX.wait .c{background:linear-gradient(#6a6488,#3b3558)}#bX.rev .c{background:linear-gradient(#8dffaa,#22a35a)}
#bY{width:76px;height:66px;right:100px;bottom:8px}#bY .c{background:linear-gradient(#7fe39a,#1f9a4c)}#bY.wait .c{background:linear-gradient(#6a6488,#3b3558)}
#bS{width:86px;height:75px;right:92px;bottom:96px}#bS .c{background:linear-gradient(#7c6a9a,#3b3558)}
#bS.ready .c{background:linear-gradient(#ffcf5a,#ff3d8a 60%,#7b3cff);animation:spg .5s infinite alternate}
@keyframes spg{to{filter:brightness(1.25)}}
#bS b{font-size:18px}
#spect{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%)}

#result .panel{align-self:center;margin-inline:auto;text-align:center}
#result h2{font-size:40px}
.rank{display:flex;flex-direction:column;gap:6px;text-align:left}
.rank div{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px 10px;font-weight:800;font-variant-numeric:tabular-nums}
.rank img{width:30px;height:30px;object-fit:contain;vertical-align:middle}
.rank div span:first-child{display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;

function angDiff(a,b){let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d}
function hashStr(str){let h=2166136261;for(const c of str){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}}
function pickW(list){let s=0;for(const x of list)s+=x[1];let r=Math.random()*s;for(const x of list){r-=x[1];if(r<=0)return x[0]}return list[0][0]}
const easeOut=t=>1-(1-t)*(1-t);
function segDist(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az,l2=vx*vx+vz*vz||1e-6,u=clamp(((px-ax)*vx+(pz-az)*vz)/l2,0,1);return Math.hypot(ax+vx*u-px,az+vz*u-pz)}
let toastT=0;

function overlay(bg,ms){const o=$('#overlay');o.style.transition='none';o.style.background=bg;o.style.opacity=1;requestAnimationFrame(()=>{o.style.transition=`opacity ${ms}ms ease-out`;o.style.opacity=0})}

let AC=null,NOISE=null,MASTER=null;const sfxLast={};
function initAudio(){if(AC)return;try{AC=new (window.AudioContext||window.webkitAudioContext)();MASTER=AC.createGain();MASTER.gain.value=.8;MASTER.connect(AC.destination);
  const n=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=n}catch(e){}}
function tone(f0,f1,dur,type,vol,delay=0){const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+dur+.05)}
function noise(dur,f0,f1,vol,q=1,type='bandpass',delay=0){const t=AC.currentTime+delay,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;f.type=type;f.Q.value=q;f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(MASTER);s.start(t);s.stop(t+dur+.05)}

    }

/* P2P (no login): WebRTC between players, found through public Nostr relays.
   Presence objects are broadcast ~20x/s so the rest of the netcode stays the same. */
const PUBLIC_URL='https://koyoy1016-gif.github.io/games/neko-battle/';
class P2PChan{
  constructor(room,selfId){
    this.room=room;this.self=selfId;this.local={};this.others=new Map();this.dirty=true;this.lastSend=0;
    this.act=room.makeAction('pr');
    this.act.onMessage=(data,ctx)=>{if(data&&typeof data==='object'&&ctx&&ctx.peerId)this.others.set(ctx.peerId,{presence:data,t:performance.now()})};
    room.onPeerJoin=id=>{this.act.send(this.local,{target:id}).catch(()=>{})};
    room.onPeerLeave=id=>{this.others.delete(id)};
    this.iv=setInterval(()=>this.flush(),50);
  }
  presence(p){for(const k in p){if(p[k]===null)delete this.local[k];else this.local[k]=p[k]}this.dirty=true;return Promise.resolve()}
  flush(){const T=performance.now();if(!this.dirty&&T-this.lastSend<1000)return;this.dirty=false;this.lastSend=T;try{this.act.send(this.local).catch(()=>{})}catch(e){}}
  peers(){const T=performance.now();const out=[{peer:this.self,sameTab:true,isMe:true,kind:'viewer',presence:this.local}];
    for(const[id,o] of this.others){if(T-o.t>6000){this.others.delete(id);continue}out.push({peer:id,sameTab:false,isMe:false,kind:'viewer',presence:o.presence})}return out}
  async leave(){clearInterval(this.iv);try{await this.room.leave()}catch(e){}}
}

/* merge the static street into a few draw calls (phones stay smooth) */
function mergeStatic(){
  const groups=new Map(),drop=[];
  scene.traverse(o=>{
    if(!o.isMesh||Array.isArray(o.material)||o.userData.dyn)return;
    const m=o.material;const key=[m.type,m.color&&m.color.getHex(),m.map?m.map.uuid:'',m.transparent,m.opacity,m.side,m.emissiveMap?m.emissiveMap.uuid:'',m.depthWrite].join('|');
    let g=groups.get(key);if(!g){g={mat:m,geos:[]};groups.set(key,g)}
    o.updateWorldMatrix(true,false);let geo=o.geometry.index?o.geometry.toNonIndexed():o.geometry.clone();geo.applyMatrix4(o.matrixWorld);
    if(!geo.attributes.uv){geo.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(geo.attributes.position.count*2),2))}
    if(!geo.attributes.normal)geo.computeVertexNormals();
    g.geos.push(geo);drop.push(o);
  });
  for(const o of drop)o.parent.remove(o);
  for(const{mat,geos} of groups.values()){
    let n=0;for(const g of geos)n+=g.attributes.position.count;
    const pos=new Float32Array(n*3),nor=new Float32Array(n*3),uv=new Float32Array(n*2);let k=0;
    for(const g of geos){pos.set(g.attributes.position.array,k*3);nor.set(g.attributes.normal.array,k*3);uv.set(g.attributes.uv.array,k*2);k+=g.attributes.position.count}
    const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('normal',new THREE.BufferAttribute(nor,3));geo.setAttribute('uv',new THREE.BufferAttribute(uv,2));
    scene.add(new THREE.Mesh(geo,mat));
  }
}

      m.rotation.y=.2;cam.position.set(0,1.25,1.6);cam.lookAt(0,1.12,0);r.render(sc,cam);FACE[id]=r.domElement.toDataURL('image/png');

/* =====================================================================
   BOSS ATTACKS — トバトーバー has seven fixed attacks, plus summoning
   robots and its special move. Every attack is a record the host
   publishes; each screen draws the red circles and checks hits on its own
   fighter. Every danger zone is round and shown before it lands.
   ===================================================================== */
const ATK={claw:{lock:1250,end:1150},charge:{lock:1500,end:1400},drop:{lock:2100,end:2000},smoke:{lock:2500,end:2400},raid:{lock:6100,end:6300},
  quake:{lock:2500,end:2900},stamp:{lock:1600,end:2300},summon:{lock:1700,end:1750},safe:{lock:6000,end:5900},rpunch:{lock:0,end:950},rbomb:{lock:0,end:1450}};
const ATK_NM={claw:'ひっかき',charge:'とっしん',drop:'とびかかり',smoke:'けむり奇襲',raid:'ばくだんの雨',quake:'じしん',stamp:'肉球スタンプ',summon:'ロボット発進',safe:'暗黒流星'};
const RAID_T0=700,RAID_T1=5200,RAID_T2=5900,SAFE_T0=1600,SAFE_HIT=4600,QUAKE_P=[1000,1600,2200],SMOKE_LOCK=1100,SMOKE_HIT=2100,CHARGE_T0=800,CHARGE_T1=1350;
const rageK=p=>p===2?BOSS_RAGE:1;
// every enemy hit costs 200–300 HP (×1.2 once awakened); the special move 1000–1100
const hitDmg=(p)=>Math.round(ri(200,300)*rageK(p));
function atkEnd(a){return a.end||ATK[a.y].end}
function bossK(ph){return (BOSS_S[ph]||6)/6}
function bossRadius(ph){return .6*(BOSS_S[ph]||6)}
function clawT(a){return a.p===2?700:820}
function clawC(a){const k=bossK(a.p);return{x:a.x+Math.cos(a.a)*4.4*k,z:a.z+Math.sin(a.a)*4.4*k,R:4.3*k}}
function chargePos(a,T){const u=clamp((T-a.t-CHARGE_T0)/(CHARGE_T1-CHARGE_T0),0,1),e=1-(1-u)*(1-u);return{x:a.x+Math.cos(a.a)*a.l*e,z:a.z+Math.sin(a.a)*a.l*e}}
function stampT(q){return 800+q[2]*140}
function quakeR(a){const r0=bossRadius(a.p);return[r0,r0+4.6]}
function raidPos(a,e){
  const th=e2=>a.a0+(e2-RAID_T0)/(RAID_T1-RAID_T0)*Math.PI*2,P=e2=>({x:8.6*Math.cos(th(e2)),z:17*Math.sin(th(e2)),y:15});
  if(e<RAID_T0){const p=P(RAID_T0),u=easeOut(e/RAID_T0);return{x:lerp(a.x,p.x,u),z:lerp(a.z,p.z,u),y:u*15}}
  if(e<RAID_T1)return P(e);
  const p=P(RAID_T1),u=clamp((e-RAID_T1)/(RAID_T2-RAID_T1),0,1);return{x:lerp(p.x,a.lx,u),z:lerp(p.z,a.lz,u),y:15*(1-u*u)};
}
// out rows: [subId, damage, srcX, srcZ]
function hazardHits(a,T,px,pz,py,out){
  const e=T-a.t,k=bossK(a.p),p=a.p;
  switch(a.y){
    case'claw':{const tl=clawT(a),c=clawC(a);if(e>=tl&&e<=tl+160&&Math.hypot(px-c.x,pz-c.z)<c.R)out.push([0,hitDmg(p),a.x,a.z]);break}
    case'charge':if(e>=CHARGE_T0&&e<=CHARGE_T1+50){const q=chargePos(a,T);if(Math.hypot(px-q.x,pz-q.z)<2.9*k+.3)out.push([0,hitDmg(p),q.x-Math.cos(a.a)*3,q.z-Math.sin(a.a)*3])}break;
    case'drop':if(e>=1700&&e<=1860&&Math.hypot(px-a.tx,pz-a.tz)<5*k)out.push([0,hitDmg(p),a.tx,a.tz]);break;
    case'smoke':if(a.hx!==undefined&&e>=SMOKE_HIT&&e<=SMOKE_HIT+160&&Math.hypot(px-a.hx,pz-a.hz)<3.6)out.push([0,hitDmg(p),a.wx,a.wz]);break;
    case'quake':{const[r0,r1]=quakeR(a);QUAKE_P.forEach((tp,i)=>{if(e>=tp&&e<=tp+700){const r=r0+(e-tp)/700*(r1-r0),d=Math.hypot(px-a.x,pz-a.z);if(Math.abs(d-r)<.8)out.push([i,hitDmg(p),a.x,a.z])}});break}
    case'raid':a.bm.forEach((q,i)=>{const tl=q[2]-a.t;if(e>=tl&&e<=tl+150&&Math.hypot(px-q[0],pz-q[1])<2.3)out.push([i,hitDmg(p),q[0],q[1]])});
      if(e>=RAID_T2&&e<=RAID_T2+150&&Math.hypot(px-a.lx,pz-a.lz)<5)out.push([99,hitDmg(p),a.lx,a.lz]);break;
    case'stamp':a.pts.forEach((q,i)=>{const te=stampT(q);if(e>=te&&e<=te+150&&Math.hypot(px-q[0],pz-q[1])<1.8)out.push([i,hitDmg(p),q[0],q[1]])});break;
    case'safe':if(e>=SAFE_HIT&&e<=SAFE_HIT+200&&!a.pts.some(q=>Math.hypot(px-q[0],pz-q[1])<2.7))out.push([0,Math.round(ri(1000,1100)*rageK(p)),px+.01,pz+1]);break;
    case'rpunch':{const cx=a.x+Math.cos(a.a)*1.6,cz=a.z+Math.sin(a.a)*1.6;if(e>=700&&e<=850&&Math.hypot(px-cx,pz-cz)<2)out.push([0,hitDmg(p),a.x,a.z]);break}
    case'rbomb':if(e>=1200&&e<=1350&&Math.hypot(px-a.tx,pz-a.tz)<2.2)out.push([0,hitDmg(p),a.tx,a.tz]);break;
  }
}
function bossOverride(a,T){
  const e=T-a.t;
  switch(a.y){
    case'charge':if(e>=CHARGE_T0&&e<=CHARGE_T1+150){const q=chargePos(a,T);return{x:q.x,z:q.z,y:0}}break;
    case'drop':if(e>=0&&e<=1850){if(e<500)return{x:a.x,z:a.z,y:easeOut(e/500)*28,air:1};if(e<1300)return{x:a.x,z:a.z,y:28,air:1,hidden:1};if(e<1700){const u=(e-1300)/400;return{x:a.tx,z:a.tz,y:28*(1-u*u),air:1}}return{x:a.tx,z:a.tz,y:0}}break;
    case'smoke':if(e>=0&&e<=2400){if(e<400)return{x:a.x,z:a.z,y:0};if(e<650)return{x:a.x,z:a.z,y:0,fade:1-(e-400)/250};if(e<1300||a.wx===undefined)return{x:a.x,z:a.z,y:0,hidden:1};return{x:a.wx,z:a.wz,y:0,fade:clamp((e-1300)/200,0,1),face:a.aw}}break;
    case'raid':if(e>=0&&e<=RAID_T2+100){const p=raidPos(a,e),p2=raidPos(a,e+60);return{x:p.x,z:p.z,y:p.y,air:p.y>2?1:0,face:Math.atan2(p2.z-p.z,p2.x-p.x)}}break;
    case'safe':if(e>=0&&e<=5900){const up=e<900?easeOut(e/900):e<SAFE_HIT+300?1:1-clamp((e-SAFE_HIT-300)/700,0,1);return{x:a.x,z:a.z,y:up*13,air:up>.15?1:0}}break;
  }
  return null;
}
function inArena(x,z){return{x:clamp(x,-AX,AX),z:clamp(z,-AZ,AZ)}}

let H=null;
function newBoss(){return{x:0,z:-12,f:Math.PI/2,hp:BOSS_HP[1],mx:BOSS_HP[1],ph:1,st:'idle',stT:now(),idle:7200,tgt:null,inv:0,last:'',raidAt:now()+22000,safeAt:now()+38000,bn:0,stun:0}}
function hostStart(){

  H={st:'play',gid,t0:now(),ro:[],b:newBoss(),at:[],it:[],itN:1,itT:now()+4000,cpus:{},cr:{},cs:[],csSeq:0,cd:{},taken:{},mtaken:{},seenRv:{},seenSup:{},gone:{},aid:1,end:0,rs:null,cpuN:0,cdQ:[],mi:[],miN:1};

function cpuNew(ch,x,z,hp,dead){const c=CHI[ch];return{ch,x,z,y:0,vy:0,f:-Math.PI/2,hp:hp??c.hp,mhp:c.hp,dead:!!dead,cd:rnd(.2,.8),xcd:rnd(2,5),g:rnd(0,.3),a:0,s:0,r:0,sp:0,stun:0,iv:0,buff:{v:0,p:0,s:0},taunt:0,guard:0,barrier:0,hit:new Set(),think:0,goal:null,revT:0,roll:null,busy:0,kb:null,mv:0,charge:null,field:0,ab:0,abm:1,armor:0}}
function humanEntries(){return participants().filter(e=>e.me?G.gid===H.gid&&G.mode!=='lobby'&&G.mode!=='title':e.pr.gid===H.gid)}
function syncRoster(){
  const T=now();
  const hs=humanEntries().sort((a,b)=>a.pr.jt-b.pr.jt).slice(0,4);
  const hk=new Set(hs.map(e=>e.me?G.myKey:e.peer));
  let ro=H.ro.map(r=>{
    if(r.cpu||hk.has(r.k)){delete H.gone[r.k];return r}
    if(!H.gone[r.k])H.gone[r.k]=T;
    if(T-H.gone[r.k]<2500)return r;
    const last=G.lastSeen[r.k]||{x:0,z:10,hp:CHI[r.ch].hp,dead:false};
    const k='cpu'+(H.cpuN++);H.cpus[k]=cpuNew(r.ch,last.x,last.z,last.hp,last.dead);delete H.gone[r.k];
    return{k,ch:r.ch,nm:'CPU',cpu:1};
  });
  for(const e of hs){
    const k=e.me?G.myKey:e.peer;if(ro.some(r=>r.k===k))continue;
    const pr=e.me?net.local:e.pr;const ch=CHI[pr.ch]?pr.ch:'sword',nm=String((e.me?G.nick:pr.nm)||'プレイヤー').slice(0,10);
    if(ro.length<4)ro.push({k,ch,nm});
    else{const ci=ro.findIndex(r=>r.cpu);if(ci<0)continue;delete H.cpus[ro[ci].k];ro[ci]={k,ch,nm}}
  }
  const used=new Set(ro.map(r=>r.ch));
  const pref=['sword','cheer','power','nurse','boxer','miko','oni','champ','ronin','pom','ninja','kungfu','sumo','mender','bell'];
  while(ro.length<4){const ch=pref.find(c=>!used.has(c));used.add(ch);const k='cpu'+(H.cpuN++);const sp=SPAWN[ro.length];H.cpus[k]=cpuNew(ch,sp[0],sp[1]);ro.push({k,ch,nm:'CPU',cpu:1})}
  H.ro=ro;
}
function spawnItem(){
  const ty=pickW([['h',4],['p',2],['s',2],['v',1.5],['g',1.5]]);
  for(let i=0;i<12;i++){const x=rnd(-AX+1,AX-1),z=rnd(-AZ+2,AZ-2);if(Math.hypot(x-H.b.x,z-H.b.z)<5)continue;if(H.it.some(t=>Math.hypot(t[2]-x,t[3]-z)<4))continue;H.it.push([H.itN++,ty,r2(x),r2(z)]);return}
}
function actorsForHost(){
  const out=[],T=now();
  for(const r of H.ro){
    if(r.cpu){const c=H.cpus[r.k];if(c)out.push({k:r.k,x:c.x,z:c.z,f:c.f,dead:c.dead,inv:c.buff.v>T,taunt:c.taunt>T,cpu:c});continue}
    if(r.k===G.myKey){if(G.mode==='play'&&!G.spectate)out.push({k:r.k,x:me.x,z:me.z,f:me.f,dead:me.dead,inv:me.buff.v>T,taunt:me.taunt>T});continue}
    const s=G.lastSeen[r.k];if(s)out.push({k:r.k,x:s.x,z:s.z,f:s.f,dead:s.dead,inv:s.inv,taunt:s.taunt});
  }
  return out;
}
function nearestLive(p,acts){let best=null,bd=1e9;for(const a of acts){if(a.dead||a.inv)continue;const d=Math.hypot(a.x-p.x,a.z-p.z);if(d<bd){bd=d;best=a}}return best}
function bossTarget(b,acts){const t=acts.find(a=>a.taunt&&!a.dead&&!a.inv);return t||nearestLive(b,acts)}
function bossAttack(b,T,tg,acts){
  const d=Math.hypot(tg.x-b.x,tg.z-b.z),nMin=H.mi.length,R=bossRadius(b.ph);
  let opts;
  if(d<R+5)opts=[['claw',5],['quake',3],['stamp',2],['smoke',2]];
  else if(d<R+11)opts=[['charge',3],['drop',3],['stamp',3],['smoke',2],['claw',1]];
  else opts=[['charge',3],['drop',3],['smoke',3],['stamp',2]];
  if(nMin<(b.ph===2?3:2)&&T>(b.sumAt||0))opts.push(['summon',4]);
  if(T>b.raidAt)opts.push(['raid',5]);
  if(T>b.safeAt)opts.push(['safe',8]);
  opts=opts.filter(o=>o[0]!==b.last);
  const y=window.__forceY||pickW(opts);window.__forceY=null;b.last=y;
  const ang=Math.atan2(tg.z-b.z,tg.x-b.x);b.f=ang;
  const a={i:H.aid++,y,t:T,x:r2(b.x),z:r2(b.z),a:r2(ang),p:b.ph,tk:tg.k};
  const live=acts.filter(x=>!x.dead);
  if(y==='charge'){let l=0;while(l<15){const nx=b.x+Math.cos(ang)*(l+.5),nz=b.z+Math.sin(ang)*(l+.5);if(Math.abs(nx)>AX||Math.abs(nz)>AZ)break;l+=.5}a.l=r2(Math.max(2,l))}
  if(y==='drop'){const p=inArena(tg.x,tg.z);a.tx=r2(p.x);a.tz=r2(p.z)}
  if(y==='smoke'){const pick=live[(Math.random()*live.length)|0]||tg;a.tk=pick.k}
  if(y==='raid'){b.raidAt=T+(b.ph===2?22000:28000);b.safeAt=Math.max(b.safeAt,T+9000);a.a0=r2(Math.atan2(b.z,b.x)||0);const n=b.ph===2?18:12;a.bm=[];
    for(let i=0;i<n;i++){const tl=T+900+1300+i*(RAID_T1-900-400)/n;const t=live[i%Math.max(1,live.length)]||tg;const p=Math.random()<.65?inArena(t.x+rnd(-2.5,2.5),t.z+rnd(-2.5,2.5)):inArena(rnd(-AX,AX),rnd(-AZ,AZ));a.bm.push([r2(p.x),r2(p.z),Math.round(tl)])}
    const lp=inArena(tg.x+rnd(-2,2),tg.z+rnd(-2,2));a.lx=r2(lp.x);a.lz=r2(lp.z)}
  if(y==='safe'){b.safeAt=T+(b.ph===2?26000:34000);b.raidAt=Math.max(b.raidAt,T+10000);a.pts=[];
    for(let tries=0;a.pts.length<4&&tries<60;tries++){const p=[r2(rnd(-AX+2.5,AX-2.5)),r2(rnd(-AZ+3,AZ-3))];if(a.pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>7))a.pts.push(p)}}
  if(y==='summon'){b.sumAt=T+15000;a.pts=[];const n=b.ph===2?3:2;for(let i=0;i<n;i++){const an=ang+(i-(n-1)/2)*.8,p=inArena(b.x+Math.cos(an)*(R+2.6),b.z+Math.sin(an)*(R+2.6));a.pts.push([r2(p.x),r2(p.z)])}}
  if(y==='stamp'){a.pts=[];for(const t of live.slice(0,4)){const dx=t.x-b.x,dz=t.z-b.z,dd=Math.hypot(dx,dz)||1;for(let i=0;i<7;i++){const r=R+1.2+i*2.1;if(r>dd+3)break;const p=inArena(b.x+dx/dd*r,b.z+dz/dd*r);a.pts.push([r2(p.x),r2(p.z),i])}}}
  H.at.push(a);b.st='atk';b.stT=T;b.cur=a;
}
function hostBoss(dt,T,acts){
  const b=H.b;
  H.at=H.at.filter(a=>T-a.t<atkEnd(a)+250);
  const tg0=bossTarget(b,acts);b.tgt=tg0?tg0.k:null;
  for(const e of participants()){const pr=e.me?net.local:e.pr;if(pr.gid!==H.gid)continue;if(+pr.bn>b.bn)b.bn=+pr.bn;if(+pr.stn>b.stun)b.stun=+pr.stn}
  if(b.st==='awaken'){if(T-b.stT>3200){b.ph=2;b.mx=BOSS_HP[2];b.hp=b.mx;b.st='idle';b.stT=T;b.idle=800;b.inv=0;b.raidAt=T+9000;b.safeAt=T+18000}else b.hp=b.mx*clamp((T-b.stT)/3000,0,1);return}
  if(b.st==='dead')return;
  if(b.st==='atk'){
    const a=b.cur;
    if(a){
      const e=T-a.t,tg=acts.find(x=>x.k===a.tk&&!x.dead)||tg0;
      if(a.y==='drop'&&e<1300&&tg){const p=inArena(tg.x,tg.z);a.tx=r2(p.x);a.tz=r2(p.z)}
      // smoke ambush: lock a spot right behind the chosen fighter
      if(a.y==='smoke'&&e>=SMOKE_LOCK&&a.wx===undefined&&tg){const f=tg.f||0;const p=inArena(tg.x-Math.cos(f)*3.4,tg.z-Math.sin(f)*3.4);a.wx=r2(p.x);a.wz=r2(p.z);const h=inArena(tg.x,tg.z);a.hx=r2(h.x);a.hz=r2(h.z);a.aw=r2(Math.atan2(h.z-p.z,h.x-p.x))}
      if(a.y==='summon'&&e>=900&&!a.done){a.done=1;for(const q of a.pts){if(H.mi.length>=(b.ph===2?5:4))break;const hp=1200;H.mi.push({id:H.miN++,x:q[0],z:q[1],f:a.a,hp,mhp:hp,cd:rnd(1,2),bc:rnd(2,4),bt:0,st:0,vx:0,vz:0})}}
      const o=bossOverride(a,T);if(o){b.x=o.x;b.z=o.z;if(o.face!==undefined)b.f=o.face}
    }
    if(!a||T-a.t>ATK[a.y].lock){
      if(a&&a.y==='charge'){const q=chargePos(a,a.t+CHARGE_T1);b.x=q.x;b.z=q.z}
      if(a&&a.y==='drop'){b.x=a.tx;b.z=a.tz}
      if(a&&a.y==='smoke'&&a.wx!==undefined){b.x=a.wx;b.z=a.wz}
      if(a&&a.y==='raid'){b.x=a.lx;b.z=a.lz}
      b.st='idle';b.stT=T;b.idle=(b.ph===2?rnd(300,600):rnd(500,900));b.cur=null;
    }
    return;
  }
  if(T<b.stun){b.mv=0;b.stT=T-b.idle*.5;return}   // electric shock: frozen in place
  if(b.idle>=7000&&T-b.stT<6600){b.mv=0;b.f=Math.PI/2;return}   // opening cinematic: lands and roars in place
  if(tg0){
    const dx=tg0.x-b.x,dz=tg0.z-b.z,d=Math.hypot(dx,dz),sp=3.8*rageK(b.ph);
    if(d>bossRadius(b.ph)+1.6){b.x+=dx/d*sp*dt;b.z+=dz/d*sp*dt;b.mv=1}else b.mv=0;
    b.f=b.f+angDiff(b.f,Math.atan2(dz,dx))*Math.min(1,dt*6);const p=inArena(b.x,b.z);b.x=p.x;b.z=p.z;
    if(T-b.stT>b.idle)bossAttack(b,T,tg0,acts);
  }else b.mv=0;
}
function bossDamage(dmg){
  const b=H.b;if(b.inv||b.st==='dead'||b.st==='awaken'||H.st!=='play')return;
  b.hp-=dmg;

}

function runProjs(dt,T){

    if(!p.lob){

        if(p.y<en.y-.3||p.y>en.y+en.h+.3)continue;
        if(segDist(en.x,en.z,ox,oz,p.x,p.z)>en.r+(p.rad||.25))continue;
        const key=en.kind==='boss'?'b':en.id;
        if(p.tick){if(T-(p.hit[key]||0)<p.tick*1000)continue;p.hit[key]=T}else{if(p.hit.has(key))continue;p.hit.add(key)}

}

  const c=CHI[me.ch],b=$('#bX'),near=!me.dead&&nearDowned();
  b.classList.toggle('rev',!!near);b.classList.toggle('wait',!near&&(me.xcd>0||!!me.charge));
  $('#xGauge').style.height=(near||me.xcd<=0?0:(1-me.xcd/c.X.cd)*100)+'%';
  const lbl=near?'たすける':me.charge?'ため中…':me.xcd>0?Math.ceil(me.xcd)+'秒':c.X.nm;if($('#xLabel').textContent!==lbl)$('#xLabel').textContent=lbl;
  const y=YOPT[G.yk],yb=$('#bY'),ycd=G.yk==='dodge'?0:me.ycd;yb.classList.toggle('wait',ycd>0);$('#yGauge').style.height=(ycd>0?(1-ycd/y.cd)*100:0)+'%';const yl=ycd>0?Math.ceil(ycd)+'秒':y.nm;if($('#yLabel').textContent!==yl)$('#yLabel').textContent=yl;
  const sb=$('#bS');sb.classList.toggle('ready',me.g>=1);$('#spGauge').style.height=(me.g>=1?0:me.g*100)+'%';const sl=me.g>=1?'GO!':Math.floor(me.g*100)+'%';if($('#sLabel').textContent!==sl)$('#sLabel').textContent=sl;
}

/* =====================================================================
   OPENING CINEMATIC — 1P〜4P take their marks, the boss drops from the sky
   ===================================================================== */
const INTRO_LAND=3500,INTRO_BACK=6200,INTRO_END=7000;
function startIntro(){
  G.intro={t0:now(),fx:{}};
  $('#controls').hidden=true;$('#hud').hidden=true;
  const box=$('#introNum');box.textContent='';box.hidden=false;
  for(const top of[1,0]){const bar=document.createElement('div');bar.className='lb';bar.style.cssText=`position:absolute;left:0;right:0;${top?'top':'bottom'}:0;height:0;background:#000;transition:height .45s ease-out`;box.appendChild(bar);requestAnimationFrame(()=>{bar.style.height='9vh'})}
  for(let i=0;i<4;i++){const d=document.createElement('div');d.className='pnum';d.dataset.i=i;d.style.cssText=`position:absolute;left:0;top:0;transform:translate(-50%,-100%) scale(.2);opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.2,1.6,.4,1);font:900 26px/1 var(--f-display),sans-serif;color:#fff;background:${PCOL[i]};border:3px solid #1c1830;border-radius:12px;padding:4px 10px;box-shadow:3px 3px 0 #1c1830;white-space:nowrap;text-align:center`;d.innerHTML=`${i+1}P<small style="display:block;font-size:11px;margin-top:2px"></small>`;box.appendChild(d)}
  const sk=document.createElement('div');sk.style.cssText='position:absolute;right:12px;bottom:calc(9vh + 10px);color:#fff;font-weight:800;font-size:12px;opacity:.8';sk.textContent='タップでスキップ ▶';box.appendChild(sk);
  sfx('drum');
}
function introNumClear(){const b=$('#introNum');if(b){b.textContent='';b.hidden=true}$('#introCard').hidden=true}
function introBadges(T){
  // 1P–4P badges over each fighter (after the camera moved this frame)
  const I=G.intro,ie=T-I.t0,F=I.fx,box=$('#introNum'),ro=(G.w&&G.w.ro)||[];camera.updateMatrixWorld();
  for(const d of box.querySelectorAll('.pnum')){
    const i=+d.dataset.i,r=ro[i],a=r&&G.actors.find(x=>x.k===r.k);
    const show=a&&ie>200+i*370&&ie<2050;
    if(a){const v=new THREE.Vector3(a.x,2.9,a.z).project(camera);d.style.left=((v.x+1)/2*innerWidth)+'px';d.style.top=((1-v.y)/2*innerHeight)+'px';d.querySelector('small').textContent=a.k===G.myKey?'あなた':a.cpu?'CPU':'なかま'}
    if(show&&!F['n'+i]){F['n'+i]=1;sfx('item');vib(15)}
    d.style.opacity=show?1:0;d.style.transform=`translate(-50%,-100%) scale(${show?1:.2})`;
  }
}
function introBossY(){
  if(!G.intro)return null;const ie=now()-G.intro.t0;
  if(ie<2300)return 60;
  if(ie<INTRO_LAND){const u=(ie-2300)/(INTRO_LAND-2300);return 60*(1-u*u)}
  return null;
}
function runIntro(T){
  const I=G.intro,ie=T-I.t0,F=I.fx,box=$('#introNum');
  if(ie>=1900&&!F.sky){F.sky=1;darkSky(4300,true);sfx('warn');banner('！','空から何かが来る…',1300)}
  if(ie>=2300&&!F.fall){F.fall=1;tone(1400,120,1.15,'sawtooth',.12);noise(1.1,3000,300,.2,1.4)}
  if(ie>=INTRO_LAND&&!F.land){F.land=1;const x=G.bossV.x||0,z=G.bossV.z||-12;shake(1.6);fxShock(x,z,14,0xffd0a0);fxShock(x,z,9,0xff3048);fxDust(x,z,7);fxDust(x,z,4);for(let i=0;i<8;i++)later(i*40,()=>fxBurst(x+rnd(-4,4),.5,z+rnd(-4,4),0xcfc6b6,6,6,1));sfx('slam');sfx('boom');vib([90,30,140]);overlay('rgba(255,255,255,.7)',450)}
  if(ie>=INTRO_LAND+300&&!F.card){F.card=1;const c=$('#introCard');c.hidden=false;c.style.animation='none';void c.offsetWidth;c.style.animation='';sfx('boss');later(220,()=>sfx('boss'));if(BOSS)BOSS.userData.castT=now()}
  if(ie>=INTRO_BACK-200&&!F.cardOff){F.cardOff=1;$('#introCard').hidden=true;for(const b of box.querySelectorAll('.lb'))b.style.height='0'}
  if(ie>=INTRO_END){G.intro=null;introNumClear();battleGo(G.w)}
}
function battleGo(w){
  if(G.mode!=='play')return;
  showScreen(null);banner('戦闘開始！',BOSS_NM+'をたおせ',2200,'北千住商店街');sfx('boss');vib(40);
  if(G.ch==='mender')later(2400,()=>toast('左上の顔か仲間をタップで回復先をえらべるよ'));
  bgmStart(w&&w.b&&w.b[5]===2?'awaken':'battle');
}
addEventListener('pointerdown',()=>{if(G.cine){skipCine();return}if(!G.intro)return;const ie=now()-G.intro.t0;if(ie>700&&ie<INTRO_BACK-300)G.intro.t0=now()-(INTRO_BACK-300)},true);

/* =====================================================================
   BGM — procedural loop (battle / awakened)
   ===================================================================== */
const BGM={on:store('neko.bgm')!=='0',mode:null,next:0,step:0,timer:null,g:null};
const mf=m=>440*Math.pow(2,(m-69)/12);
const SONG={
  battle:{bpm:140,root:[45,41,48,43],ch:[[69,72,76],[65,69,72],[67,72,76],[67,71,74]],
    lead:[[76,0,0,74,0,72,0,74,76,0,79,0,76,0,74,0],[72,0,0,72,0,74,0,72,69,0,0,0,72,0,74,0],[76,0,0,79,0,81,0,79,76,0,74,0,72,0,74,0],[74,0,0,71,0,67,0,71,74,0,0,0,79,0,0,0]]},
  awaken:{bpm:164,root:[45,46,45,44],ch:[[69,72,76],[70,74,77],[69,72,76],[68,71,76]],
    lead:[[81,0,80,81,0,76,0,72,0,76,0,81,0,84,0,83],[82,0,0,77,0,74,0,77,82,0,81,0,79,0,77,0],[81,0,80,81,0,76,0,72,0,76,0,81,0,84,0,86],[83,0,0,80,0,76,0,71,68,0,71,0,76,0,80,0]]}};
function bgmLabel(){const b=$('#btnBgm');if(b)b.textContent=BGM.on?'BGM ON':'BGM OFF'}
function bgmStart(mode){
  if(!AC)return;BGM.mode=mode;if(!BGM.on)return;
  if(!BGM.g){BGM.g=AC.createGain();BGM.g.connect(MASTER)}
  BGM.g.gain.cancelScheduledValues(AC.currentTime);BGM.g.gain.setTargetAtTime(.34,AC.currentTime,.15);
  if(!BGM.timer){BGM.next=AC.currentTime+.08;BGM.step=0;BGM.timer=setInterval(bgmTick,40)}
}
function bgmSwitch(mode){if(BGM.timer){BGM.mode=mode;BGM.step=Math.ceil(BGM.step/16)*16;for(let i=0;i<4;i++)bgmHit(AC.currentTime+.05+i*.12,'crash')}else if(G.mode==='play'&&!G.intro)bgmStart(mode)}
function bgmMute(){if(BGM.timer){clearInterval(BGM.timer);BGM.timer=null}if(BGM.g)BGM.g.gain.setTargetAtTime(0,AC.currentTime,.05)}
function bgmStop(){bgmMute();BGM.mode=null}
function bgmTick(){
  if(!AC||!BGM.mode)return;const S=SONG[BGM.mode],sd=60/S.bpm/4,now2=AC.currentTime;
  if(BGM.next<now2-.25)BGM.next=now2+.05;
  while(BGM.next<now2+.16){bgmStep(BGM.step,BGM.next,S,sd);BGM.next+=sd;BGM.step++}
}
function bOsc(t,f,dur,type,vol,f1,filt){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);let n=o;if(filt){const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.setValueAtTime(filt,t);fl.frequency.exponentialRampToValueAtTime(Math.max(80,filt*.25),t+dur);fl.Q.value=6;o.connect(fl);n=fl}n.connect(g);g.connect(BGM.g);o.start(t);o.stop(t+dur+.03)}
function bNoise(t,dur,type,f,vol){const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NOISE;fl.type=type;fl.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(fl);fl.connect(g);g.connect(BGM.g);s.start(t);s.stop(t+dur+.03)}
function bgmHit(t,k){if(!BGM.g)return;if(k==='kick')bOsc(t,160,.16,'sine',.9,42);else if(k==='snare'){bNoise(t,.16,'bandpass',1900,.45);bOsc(t,230,.09,'triangle',.3,160)}else if(k==='hat')bNoise(t,.035,'highpass',8000,.16);else if(k==='crash')bNoise(t,.7,'highpass',5000,.28)}
function bgmStep(st,t,S,sd){
  const bar=(st>>4)%4,i=st%16,aw=BGM.mode==='awaken';
  // drums
  if(i%4===0||(aw&&(i===10||i===14))||(!aw&&i===10))bgmHit(t,'kick');
  if(i===4||i===12||(aw&&i===15))bgmHit(t,'snare');
  if(aw||i%2===0)bgmHit(t,'hat');
  if(i===0&&bar===0&&st%128===0)bgmHit(t,'crash');
  // bass
  const r=S.root[bar];
  if(aw){bOsc(t,mf(r+(i%2?12:0)),sd*.9,'sawtooth',.22,0,900)}
  else if(i%2===0){bOsc(t,mf(r+(i%8===6?12:0)),sd*1.8,'sawtooth',.22,0,700)}
  // arpeggio
  const c=S.ch[bar],ar=[0,1,2,1,2,0,1,2];bOsc(t,mf(c[ar[i%8]]+(aw?0:-12)+(i>=8&&aw?12:0)),sd*.8,'square',aw?.045:.04,0,2600);
  // lead (every other phrase rests, so the loop breathes)
  const ph=(st>>6)%2,n=S.lead[bar][i];
  if(n&&(aw||ph===1)){bOsc(t,mf(n),sd*2.4,aw?'sawtooth':'triangle',aw?.07:.11,0,aw?3200:0)}
}
function bgmFanfare(){if(!AC||!BGM.on)return;if(!BGM.g){BGM.g=AC.createGain();BGM.g.connect(MASTER)}BGM.g.gain.cancelScheduledValues(AC.currentTime);BGM.g.gain.setValueAtTime(.34,AC.currentTime);const t=AC.currentTime+.1;[[72,0],[76,.14],[79,.28],[84,.42],[79,.7],[84,.84]].forEach(([n,d],i)=>{bOsc(t+d,mf(n),i===5?1.1:.22,'square',.09,0,3000);bOsc(t+d,mf(n-12),i===5?1.1:.22,'triangle',.12)});bgmHit(t,'crash');bgmHit(t+.84,'crash')}
/* =====================================================================
   INPUT
   ===================================================================== */
const zone=$('#stickZone'),base=$('#stickBase'),knob=$('#stickKnob');let stickId=null,sx0=0,sy0=0;
zone.addEventListener('pointerdown',e=>{initAudio();stickId=e.pointerId;zone.setPointerCapture(e.pointerId);const r=zone.getBoundingClientRect();sx0=e.clientX;sy0=e.clientY;base.style.left=(e.clientX-r.left)+'px';base.style.top=(e.clientY-r.top)+'px';moveStick(e)});
zone.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});
const endStick=e=>{if(e.pointerId!==stickId)return;stickId=null;input.x=input.z=0;knob.style.transform=''};
zone.addEventListener('pointerup',endStick);zone.addEventListener('pointercancel',endStick);
function moveStick(e){let dx=e.clientX-sx0,dy=e.clientY-sy0;const l=Math.hypot(dx,dy),m=50;if(l>m){dx=dx/l*m;dy=dy/l*m}knob.style.transform=`translate(${dx}px,${dy}px)`;input.x=dx/m;input.z=dy/m}
function btn(id,down,up){const el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();initAudio();el.classList.add('down');try{el.setPointerCapture(e.pointerId)}catch(_){}if(G.mode==='play'&&!G.spectate)down()});for(const ev of['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>{el.classList.remove('down');up&&up()})}
btn('#bA',()=>{input.A=true},()=>{input.A=false});
btn('#bX',()=>pressX(now()));
btn('#bY',()=>pressY(now()));
btn('#bS',()=>pressSP(now()));
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;input.keys[e.code]=true;if(G.mode==='play'&&!G.spectate&&!e.repeat){const T=now();if(e.code==='KeyK')pressX(T);if(e.code==='KeyL')pressY(T);if(e.code==='KeyC')G.camSnap=true;if(e.code==='KeyI')pressSP(T)}if(G.mode==='play'&&['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>{input.keys[e.code]=false});
addEventListener('blur',()=>{input.keys={};input.A=false});
document.addEventListener('contextmenu',e=>{if(G.mode==='play')e.preventDefault()});

/* =====================================================================
   BOOT
   ===================================================================== */
(async()=>{
  try{await Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))])}catch(e){}
  buildStage();mergeStatic();buildBossVis();makeThumbs();
  for(const k in FACE){const i=new Image();i.src=FACE[k];FACE_IMG[k]=i}
  bgmLabel();showScreen('title');requestAnimationFrame(frame);
})();
</script>
