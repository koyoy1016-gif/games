<style>
/* Layout: one stage — a small game HUD on top, the phone fills the rest. One dark look on purpose (late night, lipstick accent). */
:root{
  --night:#16121b; --night2:#231c2b; --line:#3a2f44; --paper:#f4eef3; --muted:#a99db3;
  --lip:#ff4d78; --amber:#ffb84d; --ok:#4fd1a1; --bad:#ff5d5d;
  --display:"Dela Gothic One","Zen Kaku Gothic New","Hiragino Sans",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
  --sys:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:radial-gradient(120% 70% at 50% 0%,#2e2238 0%,var(--night) 62%);background-color:var(--night);color:var(--paper);font-family:var(--body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit}
.stage{height:100%;display:flex;flex-direction:column;align-items:center;gap:10px;padding-inline:16px;padding-block:10px;box-sizing:border-box}
.hud{width:100%;max-width:440px;display:flex;align-items:center;gap:8px;flex:none}
.hud h1{font-family:var(--display);font-weight:400;font-size:20px;margin:0;flex:1;white-space:nowrap;letter-spacing:.02em}
.hud h1 span{color:var(--lip)}
.timer{font:700 15px var(--sys);font-variant-numeric:tabular-nums;padding:6px 11px;border-radius:999px;background:var(--night2);border:1px solid var(--line)}
.timer.hot{color:var(--night);background:var(--amber);border-color:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.hand{font:700 13px var(--body);padding:8px 13px;border-radius:999px;border:0;background:var(--lip);color:#fff;cursor:pointer;white-space:nowrap}
.hand:hover{filter:brightness(1.08)}
.hand:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.phone-wrap{flex:1;min-height:0;width:100%;display:flex;justify-content:center;align-items:center}
.phone{height:100%;max-height:840px;aspect-ratio:390/844;max-width:100%;background:#0b0a0d;border-radius:56px;padding:11px;box-sizing:border-box;box-shadow:0 0 0 2px #3b3442,0 0 0 5px #121015,0 30px 80px rgba(0,0,0,.6);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:46px;overflow:hidden;font-family:var(--sys);font-size:15px;container-type:size;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
  --app-bg:#fff;--app-bg2:#f2f2f7;--app-fg:#111;--app-sub:#8a8a8e;--app-line:#dcdce1;--app-card:#fff;--app-tint:#0a84ff;--app-red:#ff3b30;--app-green:#34c759;--sheet:rgba(249,249,251,.97);--sheet-line:rgba(0,0,0,.13)}
.screen.dark{--app-bg:#000;--app-bg2:#000;--app-fg:#f2f2f2;--app-sub:#8e8e93;--app-line:#38383a;--app-card:#1c1c1e;--sheet:rgba(40,40,42,.97);--sheet-line:rgba(255,255,255,.12)}
@media (max-width:520px){.phone{border-radius:40px;padding:7px}.screen{border-radius:34px}}
.wp0{background:linear-gradient(165deg,#2b2350 0%,#a8487a 52%,#f2a06a 100%)}
.wp1{background:linear-gradient(170deg,#0d3550 0%,#1f8a8a 55%,#9fe3c8 100%)}
.wp2{background:linear-gradient(170deg,#18181b 0%,#3c3c45 60%,#5d5a6a 100%)}
.wp3{background:linear-gradient(165deg,#f6b8cb 0%,#c9b8f2 55%,#9fc4ff 100%)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:31%;max-width:120px;height:32px;background:#000;border-radius:20px;z-index:300;pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:4px 26px 0 34px;box-sizing:border-box;font-weight:600;font-size:15px;color:#fff;z-index:290;pointer-events:none;font-variant-numeric:tabular-nums}
.screen.in-app .sbar{color:var(--app-fg)}
.screen.in-app.sb-light .sbar{color:#fff}
.sb-r{display:flex;gap:5px;align-items:center}
.sb-r svg{height:12px;width:auto;fill:currentColor}
/* home */
.home{position:absolute;inset:0;padding:58px 16px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:16px}
.wrow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wdg{aspect-ratio:1.05;border-radius:22px;background:rgba(255,255,255,.2);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:#fff;padding:12px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.wdg .k{font-size:11px;font-weight:700;opacity:.85;letter-spacing:.04em}
.wdg .n{font-size:38px;font-weight:300;line-height:1}
.wdg .s{font-size:11px;opacity:.9;margin-top:auto;line-height:1.35}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:16px;column-gap:4px}
.ic{all:unset;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;min-width:0}
.tile{width:min(58px,16cqw);aspect-ratio:1;border-radius:24%;display:grid;place-items:center;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.18);transition:transform .45s}
.tile>svg{width:100%;height:100%;border-radius:24%;display:block}
.ic.pressing .tile{transform:scale(.88)}
.ic:active .tile{filter:brightness(.82)}
.ic:focus-visible .tile{outline:2px solid #fff;outline-offset:2px}
.lb{font-size:11px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.45);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.badge{position:absolute;top:-6px;right:-7px;min-width:21px;height:21px;padding:0 5px;border-radius:11px;background:#ff3b30;color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;box-sizing:border-box}
.dots{margin-top:auto;display:flex;justify-content:center;gap:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.4)}
.dots i.on{background:#fff}
.dock{margin:0 -6px 22px;padding:14px 10px;border-radius:32px;background:rgba(255,255,255,.2);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);display:grid;grid-template-columns:repeat(4,1fr)}
.ic.gone{animation:gone .35s forwards}
@keyframes gone{to{transform:scale(0);opacity:0}}
/* app shell */
#apps{position:absolute;inset:0;pointer-events:none;z-index:100}
.app{position:absolute;inset:0;background:var(--app-bg);color:var(--app-fg);display:flex;flex-direction:column;pointer-events:auto;animation:aopen .32s cubic-bezier(.2,.8,.2,1);overflow:hidden}
.app.closing{animation:aclose .22s forwards;pointer-events:none}
@keyframes aopen{from{transform:scale(.55);opacity:0;border-radius:40px}}
@keyframes aclose{to{transform:scale(.55);opacity:0}}
.nav{padding:50px 10px 8px;display:flex;align-items:center;gap:6px;min-height:40px;flex:none;background:var(--app-bg2);position:relative}
.nav h2{margin:0;font-size:17px;font-weight:600;position:absolute;left:80px;right:80px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nb{all:unset;color:var(--app-tint);font-size:17px;cursor:pointer;padding:4px;white-space:nowrap}
.nb.r{margin-left:auto}
.big{font-size:32px;font-weight:700;margin:2px 16px 12px;letter-spacing:-.01em}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:34px;background:var(--app-bg2)}
.grp{margin:0 16px 22px;background:var(--app-card);border-radius:12px;overflow:hidden}
.grp-h{margin:0 32px 6px;font-size:13px;color:var(--app-sub)}
.grp-f{margin:-14px 32px 22px;font-size:12px;color:var(--app-sub);line-height:1.5}
.row{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:46px;position:relative;cursor:pointer}
.row+.row::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:.5px solid var(--app-line)}
.grp.plain .row+.row::before{left:14px}
.row:active{background:var(--app-line)}
.row .t{flex:1;min-width:0;line-height:1.3}
.row .t small{display:block;color:var(--app-sub);font-size:12px}
.row .v{color:var(--app-sub)}
.chev{color:var(--app-sub);opacity:.6;font-size:20px;line-height:1}
.row.red{color:var(--app-red)}
.row.ctr{justify-content:center;color:var(--app-tint)}
.si{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none}
.si svg{width:19px;height:19px;fill:#fff}
.tg{width:51px;height:31px;border-radius:16px;background:var(--app-line);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:left .2s}
.tg.on{background:var(--app-green)}
.tg.on::after{left:22px}
.rng{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;outline:none;margin:0;background:var(--app-line)}
.rng::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);cursor:pointer}
.rng::-moz-range-thumb{width:28px;height:28px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.slrow{display:flex;align-items:center;gap:12px;padding:14px}
.slrow svg{width:16px;height:16px;fill:var(--app-sub);flex:none}
.slrow svg.l{width:24px;height:24px}
.appear{display:flex;justify-content:space-around;padding:16px 10px 12px}
.ap{all:unset;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;font-size:14px}
.ap i{width:62px;height:118px;border-radius:12px;border:1px solid var(--app-line);display:block}
.ap .rd{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--app-sub);box-sizing:border-box;display:grid;place-items:center}
.ap.on .rd{background:var(--app-tint);border-color:var(--app-tint)}
.ap.on .rd::after{content:"";width:6px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.wps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:14px}
.wps button{all:unset;aspect-ratio:.55;border-radius:16px;cursor:pointer;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.wps button.on{box-shadow:0 0 0 3px var(--app-tint)}
</style>
<style>
/* overlays inside the phone */
#layer{position:absolute;inset:0;z-index:250;pointer-events:none}
#layer>*{pointer-events:auto}
.bkd{position:absolute;inset:0;background:rgba(0,0,0,.38);animation:fade .2s}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(110%)}}
@keyframes pop{from{transform:translate(-50%,-50%) scale(1.15);opacity:0}}
@keyframes drop{from{transform:translateY(-130%)}}
.sheet{position:absolute;left:8px;right:8px;bottom:24px;display:flex;flex-direction:column;gap:8px;animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sg{background:var(--sheet);border-radius:14px;overflow:hidden;backdrop-filter:blur(20px)}
.sh-h{padding:14px 18px;text-align:center;font-size:13px;color:var(--app-sub);display:flex;flex-direction:column;gap:4px;line-height:1.4}
.sh-h b{color:var(--app-fg);font-size:14px}
.sb{all:unset;box-sizing:border-box;width:100%;text-align:center;padding:16px;font-size:19px;color:#0a84ff;cursor:pointer;border-top:.5px solid var(--sheet-line)}
.sb:active{background:var(--sheet-line)}
.sb.red{color:#ff3b30}
.sb.cancel{background:var(--sheet);border-radius:14px;font-weight:600;border:0}
.alert{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:270px;max-width:86%;background:var(--sheet);color:var(--app-fg);border-radius:14px;overflow:hidden;text-align:center;animation:pop .2s}
.al-b{padding:19px 16px 16px;display:flex;flex-direction:column;gap:5px}
.al-b b{font-size:17px}

.al-btns{display:flex}
.al-btns .sb{font-size:17px;padding:11px}
.al-btns .sb+.sb{border-left:.5px solid var(--sheet-line)}
.al-btns.v{flex-direction:column}
.al-btns.v .sb+.sb{border-left:0}
.al-btns .sb.bold{font-weight:600}
#banner{position:absolute;top:8px;left:8px;right:8px;z-index:285;display:flex;flex-direction:column;gap:6px}
.bnr{display:flex;gap:10px;align-items:center;padding:11px 12px;border-radius:20px;background:rgba(245,245,247,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);color:#111;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:drop .4s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.bnr .tile{width:38px;border-radius:9px;flex:none;box-shadow:none}
.bnr .bt{flex:1;min-width:0;font-size:14px;line-height:1.3}
.bnr .bt b{display:flex;justify-content:space-between}
.bnr .bt b small{font-weight:400;color:#888;font-size:12px}
.bnr .bt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bnr.out{transition:transform .3s,opacity .3s;transform:translateY(-130%);opacity:0}
.dim{position:absolute;inset:0;background:#000;pointer-events:none;z-index:400;transition:opacity .12s}
.flash{position:absolute;inset:0;background:#fff;z-index:420;pointer-events:none;animation:fl .35s forwards}
@keyframes fl{to{opacity:0}}
.hbar{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:46%;height:28px;z-index:300;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;box-sizing:border-box;--hb:var(--app-fg)}
.hbar::after{content:"";width:100%;height:5px;border-radius:3px;background:var(--hb)}
.screen.sb-light .hbar{--hb:#fff}
.screen:not(.in-app) .hbar{display:none}
.av{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;flex:none;overflow:hidden}
.av svg{width:100%;height:100%}
.empty{padding:60px 30px;text-align:center;color:var(--app-sub);font-size:14px;line-height:1.6}
/* chat app */
.ln{--ln:#06c755;--room:#8eaad6}
.screen.dark .ln{--room:#1d2738}
.ln-top{padding:52px 16px 8px;display:flex;align-items:center;gap:10px;background:var(--app-bg);flex:none}

.ln-top svg{width:24px;height:24px;fill:none;stroke:var(--app-fg);stroke-width:1.8}
.ln-body{flex:1;overflow-y:auto;background:var(--app-bg)}
.ln-tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:.5px solid var(--app-line);background:var(--app-bg);padding:7px 0 26px;flex:none}
.ln-tab{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;color:var(--app-sub);cursor:pointer;position:relative}
.ln-tab svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8}
.ln-tab.on{color:var(--app-fg)}
.ln-tab.on svg{fill:currentColor}
.ln-tab .badge{top:-4px;right:22%;background:var(--ln);min-width:18px;height:18px;font-size:11px}
.ln-search{margin:4px 16px 8px;padding:8px 12px;border-radius:10px;background:var(--app-bg2);color:var(--app-sub);font-size:14px;display:flex;gap:6px;align-items:center}
.ln-me{display:flex;gap:14px;align-items:center;padding:10px 16px 14px;cursor:pointer}
.ln-me b{font-size:19px;display:block}
.ln-me small{color:var(--app-sub);font-size:12px}
.ln-sec{font-size:13px;color:var(--app-sub);padding:12px 16px 6px;border-top:.5px solid var(--app-line)}
.ln-row{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:8px 16px;cursor:pointer;transition:background .15s}
.ln-row:active,.ln-row.pressing{background:var(--app-bg2)}
.ln-row .mid{flex:1;min-width:0}
.ln-row .nm{font-size:15px;font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-row .lm{font-size:13px;color:var(--app-sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.ln-row .rt{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:11px;color:var(--app-sub)}
.un{background:var(--ln);color:#fff;border-radius:10px;min-width:20px;height:20px;padding:0 6px;box-sizing:border-box;font-size:11px;font-weight:700;display:grid;place-items:center}
.ln-tip{margin:10px 16px;font-size:11px;color:var(--app-sub);text-align:center}
.ln-head{padding:50px 8px 8px;display:flex;align-items:center;gap:4px;background:var(--app-bg);flex:none}
.ln-head b{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ln-head svg{width:22px;height:22px;fill:none;stroke:var(--app-fg);stroke-width:1.8}
.ln-msgs{flex:1;overflow-y:auto;padding:10px 10px 14px;display:flex;flex-direction:column;gap:9px;background:var(--room)}
.day{align-self:center;font-size:11px;color:#fff;background:rgba(0,0,0,.2);padding:3px 11px;border-radius:10px}
.m{display:flex;gap:6px;align-items:flex-end}
.m.me{flex-direction:row-reverse}
.m .col{display:flex;flex-direction:column;max-width:70%;min-width:0}

.m.me .bub{background:#8de055}
.meta{font-size:10px;color:rgba(255,255,255,.95);display:flex;flex-direction:column;gap:1px;flex:none;line-height:1.2}
.m.me .meta{align-items:flex-end}
.who{font-size:11px;color:#fff;margin:0 0 3px 3px}
.pic{width:150px;height:186px;border-radius:14px;background:linear-gradient(160deg,#ffd3e2,#b9a4ff);display:grid;place-items:end start;padding:10px;box-sizing:border-box;color:#fff;font-size:12px;font-weight:700}
.sysm{align-self:center;font-size:11px;color:#fff;background:rgba(0,0,0,.2);padding:4px 12px;border-radius:10px}
.typing .bub{display:flex;gap:4px;padding:12px 14px}

@keyframes tp{50%{transform:translateY(-4px);opacity:.5}}
.ln-in{display:flex;gap:8px;align-items:center;padding:8px 10px 10px;background:var(--app-bg);flex:none}

/* forms */
.fin{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px 14px;font-size:16px;color:var(--app-fg);user-select:text;-webkit-user-select:text}
.fin+.fin{border-top:.5px solid var(--app-line)}
.fin::placeholder{color:var(--app-sub)}
.fsel{all:unset;color:var(--app-sub);font-size:15px;text-align:right;cursor:pointer;max-width:62%}
/* store */
.st-h{font-size:20px;font-weight:800;margin:4px 16px 4px}
.st-app{display:flex;align-items:center;gap:10px;padding:8px 16px}
.st-hit{all:unset;flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;padding-bottom:8px;border-bottom:.5px solid var(--app-line)}
.st-hit .tile,.st-dh .tile{flex:none;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.st-hit .mid{flex:1;min-width:0}
.st-hit b{font-size:15px;display:block}
.st-hit small{font-size:12px;color:var(--app-sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.get{all:unset;padding:5px 16px;border-radius:14px;background:var(--app-bg2);color:var(--app-tint);font-weight:700;font-size:14px;cursor:pointer;min-width:42px;text-align:center;display:inline-grid;place-items:center;box-sizing:border-box;height:28px}
.get.big{background:var(--app-tint);color:#fff;padding:5px 20px}
.screen.dark .get{background:#2c2c2e}
.screen.dark .get.big{background:var(--app-tint)}
.ring-b{padding:0;min-width:42px}
.ring{width:22px;height:22px;border-radius:50%;background:conic-gradient(var(--app-tint) var(--a),transparent 0);-webkit-mask:radial-gradient(circle,transparent 7.5px,#000 8px);mask:radial-gradient(circle,transparent 7.5px,#000 8px);box-shadow:inset 0 0 0 2px var(--app-line);animation:dlp var(--dur,2.6s) linear forwards}
.st-feat{all:unset;box-sizing:border-box;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;margin:8px 16px 18px;width:calc(100% - 32px);height:200px;border-radius:18px;background:linear-gradient(140deg,#1d1f52,#5e60ce 60%,#b8c0ff);color:#fff;padding:18px;cursor:pointer;position:relative;overflow:hidden}
.st-feat::before{content:"";position:absolute;right:-20px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d0,#ffe08a 60%,transparent 62%);opacity:.85}
.st-feat small{font-size:11px;font-weight:700;opacity:.8;position:relative}
.st-feat b{font-size:24px;line-height:1.2;position:relative}
.st-feat-ic{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px;font-weight:700;position:relative}
.st-d{padding:8px 16px 30px;background:var(--app-bg);min-height:100%;box-sizing:border-box}
.st-dh{display:flex;gap:16px;align-items:flex-start}
.st-dh b{font-size:20px;line-height:1.25;display:block}
.st-dh small{color:var(--app-sub);font-size:13px;display:block;margin:4px 0 12px}
.st-meta{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 14px;padding:10px 0;border-block:.5px solid var(--app-line);text-align:center}
.st-meta div{display:flex;flex-direction:column;gap:2px}
.st-meta div+div{border-left:.5px solid var(--app-line)}
.st-meta small{font-size:10px;color:var(--app-sub)}
.st-meta b{font-size:19px;color:var(--app-sub)}
.st-shots{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.st-shots div{flex:none;width:44%;aspect-ratio:.56;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-weight:800;font-size:13px}
.st-shots svg{width:44%}
.st-desc{font-size:14px;line-height:1.7;margin:16px 0 0}
.acct{display:flex;align-items:center;gap:12px}
.acct .me-btn{width:52px;height:52px;font-size:22px;box-shadow:none}
/* calendar */
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px 0;padding:6px 10px;font-size:16px}
.cd{all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;height:44px;position:relative}
.cd span{width:32px;height:32px;display:grid;place-items:center;border-radius:50%}
.cd.today span{color:#ff3b30;font-weight:700}
.cd.sel span{background:var(--app-fg);color:var(--app-bg);font-weight:600}
.cd.today.sel span{background:#ff3b30;color:#fff}
.cd.dt::after{content:"";width:5px;height:5px;border-radius:50%;background:var(--app-sub);margin-top:2px}
.cal-dh{font-size:13px;font-weight:700;color:var(--app-sub);margin:10px 16px 4px;padding-top:10px;border-top:.5px solid var(--app-line)}
.cal-ev{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:calc(100% - 32px);margin:5px 16px;padding:11px 12px;border-left:4px solid #ff9500;background:var(--app-bg2);border-radius:8px;font-size:15px;cursor:pointer}
.cal-ev b{font-size:12px;color:var(--app-sub);font-weight:600;min-width:38px;font-variant-numeric:tabular-nums}
.screen.dark .cal-ev{background:#1c1c1e}
.ev-big{padding:16px}
.ev-big b{font-size:22px;display:block;margin-bottom:6px}
.ev-big span{display:block;color:var(--app-sub);font-size:14px;line-height:1.6}
/* memo */
.note-ta{all:unset;flex:1;display:block;box-sizing:border-box;width:100%;padding:8px 18px 40px;font-size:16px;line-height:1.7;white-space:pre-wrap;color:var(--app-fg);background:var(--app-bg);user-select:text;-webkit-user-select:text;overflow:auto}
.note-ta::first-line{font-size:22px;font-weight:700}
.memo-tr{margin:10px 16px 0;padding:10px 12px;border-radius:10px;background:var(--app-bg2);font-size:12px;color:var(--app-sub);text-align:center}
.memo-bar{display:flex;align-items:center;justify-content:center;position:relative;padding:10px 16px 30px;font-size:12px;color:var(--app-sub);background:var(--app-bg2);border-top:.5px solid var(--app-line);flex:none}
.memo-bar button{all:unset;position:absolute;right:16px;top:6px;cursor:pointer;color:#d4a400}
.memo-bar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8}
.nb-r{margin-left:auto;display:flex;gap:14px;align-items:center}
.nb-r .nb{color:#d4a400}
/* photos */
.ph-art{position:absolute;left:12%;top:12%;width:76%;height:70%;pointer-events:none}
.ph-bar{display:flex;justify-content:space-around;padding:12px 10px 32px;background:var(--app-bg2);flex:none}
.ph-bar button{all:unset;cursor:pointer;color:var(--app-tint);font-size:15px;font-weight:600}
.ph-bar button.red{color:var(--app-red)}
.ph-tabs{grid-template-columns:repeat(2,1fr)}
.ph-note{text-align:center;color:var(--app-sub);font-size:12px;padding:14px}
/* phone call */
.call{position:absolute;inset:0;z-index:284;background:linear-gradient(170deg,#3a3f5c,#121420);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;padding:84px 24px 64px;box-sizing:border-box;animation:up .35s cubic-bezier(.2,.8,.2,1);text-align:center}
.call>small{opacity:.8;font-size:14px}
.call h3{font-size:30px;font-weight:500;margin:10px 0 0}
.call .av{margin-top:18px;box-shadow:0 0 0 0 rgba(255,255,255,.4);animation:ringp 1.4s infinite}
@keyframes ringp{70%{box-shadow:0 0 0 22px rgba(255,255,255,0)}}
.call .sub{margin-top:22px;min-height:70px;font-size:15px;line-height:1.7;opacity:.95}
.cbtns{margin-top:auto;display:flex;justify-content:space-around;width:100%}
.cbtns button{all:unset;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.cbtns i{width:70px;height:70px;border-radius:50%;display:grid;place-items:center}
.cbtns svg{width:32px;height:32px;fill:#fff}
/* inspection */
.girl{width:100%;max-width:440px;display:flex;align-items:center;gap:10px;flex:none;min-height:46px}
.gav{position:relative;flex:none}
.gav .av{width:42px;height:42px;font-size:18px;box-shadow:0 0 0 2px var(--lip)}
.gav i{position:absolute;right:-6px;bottom:-6px;font-size:19px;font-style:normal}
.gmid{flex:1;min-width:0}
.say{background:#fff;color:#1a1420;border-radius:14px;padding:7px 11px;font-size:13px;font-weight:700;line-height:1.45;position:relative}
.say::before{content:"";position:absolute;left:-6px;top:14px;border:6px solid transparent;border-right-color:#fff;border-left:0}
.say.angry{background:#ffe1e8;color:#c0103c}
.say.angry::before{border-right-color:#ffe1e8}
.say.pop{animation:sayp .25s}
@keyframes sayp{from{transform:scale(.94);opacity:.4}}
.anger{height:5px;border-radius:3px;background:#3a2f44;margin-top:5px;overflow:hidden}
.anger i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--bad));transition:width .6s}
.ctl{display:flex;flex-direction:column;gap:4px;flex:none}
.ctl button{all:unset;font:700 11px var(--body);padding:5px 10px;border-radius:999px;background:var(--night2);border:1px solid var(--line);cursor:pointer;text-align:center}
#finger{position:fixed;z-index:900;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,230,.75) 0 35%,rgba(255,255,255,.25) 36%);border:2px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(0,0,0,.45);pointer-events:none;opacity:0;transition:left .5s cubic-bezier(.4,0,.2,1),top .5s cubic-bezier(.4,0,.2,1),opacity .25s,transform .12s;left:50%;top:70%}
#finger.show{opacity:1}
#finger.press{transform:scale(.72)}
#finger.fast{transition-duration:.24s,.24s,.25s,.12s}
.tapd{filter:brightness(.82)}
#block{position:absolute;inset:0;z-index:445}
.found{position:absolute;left:50%;top:40%;z-index:430;transform:translate(-50%,-50%) rotate(-10deg);padding:4px 16px 6px;border:4px solid #ff3b5c;color:#ff3b5c;font:400 32px var(--display);border-radius:10px;background:rgba(255,255,255,.88);pointer-events:none;white-space:nowrap;text-align:center;animation:stampin .35s cubic-bezier(.2,1.6,.4,1),stampout .3s 1.4s forwards}
.found small{display:block;font:800 14px var(--sys)}
@keyframes stampin{from{transform:translate(-50%,-50%) rotate(-10deg) scale(2.2);opacity:0}}
@keyframes stampout{to{opacity:0}}
.phone.shake{animation:shake .42s}
@keyframes shake{20%{transform:translateX(-7px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.hilite{outline:3px solid #ff3b5c!important;outline-offset:-3px;animation:hl .8s infinite alternate}
@keyframes hl{to{outline-color:rgba(255,59,92,.35)}}
/* difficulty */
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 14px}
.lv button{all:unset;cursor:pointer;text-align:center;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:#1a1520;display:flex;flex-direction:column;gap:2px}
.lv button b{font-size:14px}
.lv button small{font-size:11px;color:var(--muted)}
.lv button.on{border-color:var(--lip);background:#3a1a2a}
/* scenes */
.scene-card{padding:20px 18px}
.scn{width:100%;height:auto;display:block;border-radius:18px;margin:6px 0 0}
.dlg{margin:12px 0 12px;padding:12px 14px;border-radius:14px;background:#1a1520;min-height:66px;box-sizing:border-box;animation:sayp .25s}
.dlg b{display:block;font-size:11px;color:var(--lip);margin-bottom:3px;letter-spacing:.06em}
.dlg span{font-size:15px;line-height:1.6;font-weight:700}
.dlg.boy b{color:#8fb8ff}
.dlg.nar span{color:var(--muted);font-weight:400;font-size:14px}
.sweat{animation:sweat 1.3s infinite;transform-box:fill-box}
.sweat.s2{animation-delay:.6s}
@keyframes sweat{to{transform:translateY(16px);opacity:0}}
.vein{transform-box:fill-box;transform-origin:center;animation:vein .45s infinite alternate}
@keyframes vein{to{transform:scale(1.35)}}
.glow{animation:glow .9s infinite alternate}
@keyframes glow{from{opacity:.65}}
.pillow{opacity:0;transform-box:fill-box;transform-origin:center}
.scn.throw .pillow{animation:pillow .75s ease-in forwards}
@keyframes pillow{0%{transform:translate(118px,-26px) rotate(0);opacity:1}75%{transform:translate(0,0) rotate(-250deg);opacity:1}100%{transform:translate(-26px,46px) rotate(-320deg);opacity:0}}
.scn.throw .boy{animation:hit .4s .55s}
@keyframes hit{30%{transform:translateX(-8px) rotate(-4deg)}60%{transform:translateX(4px)}}
.pow{opacity:0}
.scn.throw .pow{animation:pow .6s .55s forwards}
@keyframes pow{30%{opacity:1}100%{opacity:0}}
.scn.throw{animation:shake .4s .55s}
.hrt{opacity:0;transform-box:fill-box;transform-origin:center;animation:float 3.4s infinite}
.hrt.h2{animation-delay:1.1s}.hrt.h3{animation-delay:2.2s}
@keyframes float{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-60px) scale(1.1);opacity:0}}
.zz{opacity:0;animation:zz 3s infinite}
.zz.z2{animation-delay:1s}.zz.z3{animation-delay:2s}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}30%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
.twk{animation:twk 1.6s infinite alternate}
.twk.t2{animation-delay:.8s}
@keyframes twk{to{opacity:.2}}
/* mini apps */
.slp{background:linear-gradient(180deg,#141633,#2b2d6e 60%,#4a3b7a);color:#fff;text-align:center}
.slp-sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.slp-sky i{position:absolute;top:-20px;width:1.5px;height:16px;background:rgba(200,220,255,.55);animation:rain .9s linear infinite}
.slp-sky i:nth-child(3n){animation-duration:.7s}.slp-sky i:nth-child(4n){animation-duration:1.1s}
@keyframes rain{to{transform:translateY(900px)}}
.slp-sky.wave{background:radial-gradient(120% 40% at 50% 100%,rgba(90,170,255,.35),transparent);animation:wave 4s ease-in-out infinite alternate}
@keyframes wave{to{background-position:0 -30px;opacity:.6}}
.slp-sky.fire{background:radial-gradient(60% 35% at 50% 100%,rgba(255,140,60,.45),transparent);animation:wave 1.2s ease-in-out infinite alternate}
.slp-c{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;padding:96px 20px 40px}
.slp-c small{opacity:.7;font-size:12px;letter-spacing:.1em}
.slp-c h3{margin:6px 0 0;font-size:21px}
.slp-moon{width:120px;height:120px;border-radius:50%;margin:34px 0;background:radial-gradient(circle at 35% 35%,#fff6d0,#ffe08a);box-shadow:0 0 60px rgba(255,230,140,.45)}
.slp-btns{display:flex;gap:12px}
.slp-btns button{all:unset;cursor:pointer;width:84px;padding:14px 0;border-radius:18px;background:rgba(255,255,255,.12);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px}
.slp-btns button span{font-size:26px}
.slp-btns button.on{background:#fff;color:#2b2d6e;font-weight:700}
.slp-c p{font-size:12px;opacity:.7;margin-top:22px}
.qz{flex:1;overflow:auto;padding:18px 16px 40px;background:var(--app-bg2);display:flex;flex-direction:column;gap:10px}
.qz-q{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:8px}
.qz-a{all:unset;cursor:pointer;padding:14px 16px;border-radius:14px;background:var(--app-card);font-size:15px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.qz-a.ok{background:#34c759;color:#fff}.qz-a.ng{background:#ff3b30;color:#fff}
.qz-ex{font-size:13px;line-height:1.6;color:var(--app-sub);padding:4px 2px}
.btn-q{all:unset;cursor:pointer;text-align:center;padding:13px;border-radius:14px;background:#7b2cbf;color:#fff;font-weight:700;margin-top:6px}
.qz-sc{font-size:64px;font-weight:800;text-align:center;margin-top:40px}
.qz-sc small{font-size:16px;font-weight:600;color:var(--app-sub);margin-left:6px}
.qz p{text-align:center;color:var(--app-sub)}
.runa{background:linear-gradient(180deg,#0e1a2e,#1d3557);color:#fff;align-items:center}
.run-ring{position:relative;width:62%;aspect-ratio:1;margin-top:18px}
.run-ring svg{width:100%;height:100%}
.run-ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.run-ring b{font-size:34px;font-variant-numeric:tabular-nums}
.run-ring small{opacity:.7;font-size:12px}
.run-st{display:grid;grid-template-columns:repeat(3,1fr);width:86%;margin-top:18px;text-align:center}
.run-st b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.run-st small{opacity:.6;font-size:11px}
.run-wk{display:flex;gap:10px;align-items:flex-end;height:70px;width:80%;margin-top:22px}
.run-wk div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px}
.run-wk i{width:100%;border-radius:4px;background:#5ff57d;opacity:.8}
.run-wk small{font-size:10px;opacity:.6}
.run-go{all:unset;cursor:pointer;margin:auto 0 44px;padding:14px 40px;border-radius:30px;background:#5ff57d;color:#0e1a2e;font-weight:800}
.run-go.on{background:#ff9f0a}
.farm-f{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:18px;background:linear-gradient(#bfe6a0,#98d17a);flex:none}
.plot{all:unset;cursor:pointer;aspect-ratio:1;border-radius:14px;background:#8a5a35;box-shadow:inset 0 -6px 0 #6e4426;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:38px;position:relative}
.plot small{position:absolute;bottom:5px;font-size:10px;font-weight:800;color:#fff;background:#ff8c42;padding:1px 6px;border-radius:8px}
.plot.s3{animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.farm-tip{text-align:center;font-size:12px;color:var(--app-sub);margin:14px}
.farm-x{flex:1;background:var(--app-bg2)}
.rt-card{margin:0 16px 12px;padding:14px;border-radius:14px;background:var(--app-card)}
.rt-card b{font-size:18px;font-variant-numeric:tabular-nums}
.rt-card small{display:block;color:var(--app-sub);font-size:12px;margin-top:4px}
.rt-card .tag{display:inline-block;font-size:10px;font-weight:700;color:#fff;background:#4361ee;border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:2px}
.kk-top{margin:12px 16px 18px;padding:16px;border-radius:16px;background:linear-gradient(135deg,#7bd389,#2a9d8f);color:#fff}
.kk-top b{display:block;font-size:30px;margin:2px 0 8px;font-variant-numeric:tabular-nums}
.kk-top small{font-size:12px;opacity:.9}
.kk-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;margin-bottom:6px}
.kk-bar i{display:block;height:100%;background:#fff}
.kk-add{display:flex;align-items:center;gap:6px;padding-right:10px}
.kk-add .fin{flex:1;min-width:0}
.kk-add .fin+.fin{border-top:0;border-left:.5px solid var(--app-line);max-width:34%}
.rc-h{padding:18px 16px 8px}
.rc-h b{font-size:24px;display:block}
.rc-h small{color:var(--app-sub)}
.rc-l{margin:0 16px 18px;padding:12px 16px 12px 34px;border-radius:12px;background:var(--app-card);line-height:1.9;font-size:15px}

/* v3: clock, 3D, LINE block */
.clk .sw-fg{background:#000}
.clk-list{flex:1;overflow:auto}
.clk-row.lap{font-size:16px;padding:12px 18px;font-variant-numeric:tabular-nums}
.clk-big.sw{padding:56px 0 28px;font-size:min(72px,19cqw)}
.clk-btns{display:flex;justify-content:space-between;padding:6px 20px 18px}
.cbt{all:unset;width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font-size:15px;cursor:pointer;background:#333;color:#fff;box-shadow:0 0 0 3px #000,0 0 0 5px #333}
.cbt.go{background:#0e3a1b;color:#30d158;box-shadow:0 0 0 3px #000,0 0 0 5px #0e3a1b}
.cbt.stop{background:#3d1210;color:#ff453a;box-shadow:0 0 0 3px #000,0 0 0 5px #3d1210}
.cbt.pause{background:#3d2a05;color:#ff9f0a;box-shadow:0 0 0 3px #000,0 0 0 5px #3d2a05}
.cbt:disabled{opacity:.45;cursor:default}
.alm{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:.5px solid #333;color:#fff}
.alm b{font-size:46px;font-weight:200;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.alm small{font-size:13px;color:#ccc}
.alm.off b,.alm.off small{color:#666}
.alm .tg{border:0;padding:0;cursor:pointer;background:#39393d}
.alm .tg.on{background:#34c759}
.alm-pick{display:flex;justify-content:center;align-items:center;gap:14px;color:#fff}
.alm-pick b{font-size:40px;font-weight:200}
.alm-pick select{all:unset;cursor:pointer;font-size:40px;font-weight:300;padding:10px 18px;border-radius:14px;background:#2c2c2e;color:#fff;text-align:center;font-variant-numeric:tabular-nums}

/* ----- clicks & long press ----- */
const SW={fired:false};
let lpT=null,lpEl=null,lpXY=null,lpFired=false;
document.addEventListener('click',e=>{
  if(lpFired||SW.fired){lpFired=false;SW.fired=false;e.preventDefault();e.stopPropagation();return}
  const t=e.target.closest('[data-a]');if(!t)return;
  const f=ACT[t.dataset.a];if(f)f(t.dataset.v,t,e);
},true);
function lpCancel(){if(lpT){clearTimeout(lpT);lpT=null}if(lpEl){lpEl.classList.remove('pressing');lpEl=null}}
function lpRun(t){lpCancel();lpFired=true;setTimeout(()=>lpFired=false,700);try{navigator.vibrate&&navigator.vibrate(12)}catch(_){}LP[t.dataset.lp]&&LP[t.dataset.lp](t.dataset.v,t)}
document.addEventListener('pointerdown',e=>{
  const t=e.target.closest('[data-lp]');if(!t||e.button>0)return;
  lpEl=t;lpXY=[e.clientX,e.clientY];t.classList.add('pressing');
  lpT=setTimeout(()=>lpRun(t),500);
});
document.addEventListener('pointermove',e=>{if(lpT&&lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10)lpCancel()});
document.addEventListener('pointerup',lpCancel);

document.addEventListener('contextmenu',e=>{
  const t=e.target.closest('[data-lp]');

/* ----- swipe rows (右スワイプ / 左スワイプでアクション) ----- */
const swb=(t,cls,a,v)=>`<button class="swb ${cls}" type="button" data-a="${a}" data-v="${esc(v)}">${t}</button>`;
const swRow=(inner,acts,o={})=>`<div class="sw ${o.card?'card':''}">${acts.L?`<div class="sw-acts L">${acts.L}</div>`:''}${acts.R?`<div class="sw-acts R">${acts.R}</div>`:''}<div class="sw-fg">${inner}</div></div>`;
const swBoth=h=>({L:h,R:h});
function swClose(except){$$('.sw.open').forEach(s=>{if(s!==except){s.classList.remove('open');s._off=0;const f=$('.sw-fg',s);if(f)f.style.transform=''}})}
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;
  const fg=e.target.closest('.sw-fg');
  if(!fg){if(!e.target.closest('.sw-acts'))swClose();return}
  const sw=fg.parentElement;
  const L=$(':scope>.sw-acts.L',sw),R=$(':scope>.sw-acts.R',sw);
  const lw=L?L.offsetWidth:0,rw=R?R.offsetWidth:0;
  const st={x:e.clientX,y:e.clientY,base:sw._off||0,h:null,cur:sw._off||0};
  const mv=ev=>{
    const dx=ev.clientX-st.x,dy=ev.clientY-st.y;
    if(st.h===null){if(Math.hypot(dx,dy)<8)return;st.h=Math.abs(dx)>Math.abs(dy)*1.2;if(st.h){lpCancel();sw.classList.add('dragging');swClose(sw)}}
    if(!st.h)return;
    ev.preventDefault();
    let x=st.base+dx;
    if(x>lw)x=lw+(x-lw)*.25;if(x<-rw)x=-rw+(x+rw)*.25;
    if(!lw&&x>0)x*=.2;if(!rw&&x<0)x*=.2;
    st.cur=x;fg.style.transform=`translateX(${x}px)`;
  };
  const up=()=>{
    document.removeEventListener('pointermove',mv);document.removeEventListener('pointerup',up);document.removeEventListener('pointercancel',up);
    sw.classList.remove('dragging');
    if(st.h){
      SW.fired=true;setTimeout(()=>SW.fired=false,80);
      const x=st.cur;let to=0;
      if(lw&&x>lw*.35)to=lw;else if(rw&&x<-rw*.35)to=-rw;
      sw._off=to;fg.style.transform=to?`translateX(${to}px)`:'';sw.classList.toggle('open',!!to);
    }else if(st.h===null&&sw._off){
      SW.fired=true;setTimeout(()=>SW.fired=false,80);
      sw._off=0;fg.style.transform='';sw.classList.remove('open');
    }
  };
  document.addEventListener('pointermove',mv,{passive:false});document.addEventListener('pointerup',up);document.addEventListener('pointercancel',up);
},true);

const DICT_LEARN=[['すきだよ','好きだよ'],['すき','好き'],['すきすぎる','好きすぎる'],['すぐあいたい','すぐ会いたい'],['あいしてる','愛してる'],['あいたい','会いたい'],['あいしてるよ','愛してるよ♡'],['おやすみ','おやすみ♡ 大好き'],['おはよう','おはよう♡'],['だいすき','大好き'],['だいすき','だいすき♡'],['かわいい','かわいいね♡'],['ちゅー','チューしたい'],['ぎゅー','ぎゅーってしたい'],['あやか','あやか♡'],['ゆい','ゆい♡'],['りな','りな♡'],['ほてる','ホテル'],['ないしょ','内緒ね'],['かのじょ','彼女にはバレてない']];
let CAND=[],CSEG='';
function updCand(){
  const box=$('#cand');if(!box)return;
  const m=L.draft.match(/[ぁ-ゖー]+$/);CSEG=m?m[0]:'';
  if(!S.set.predictive){CAND=[];box.innerHTML='<span class="hint">予測変換はオフです</span>';return}
  if(!CSEG){CAND=[];box.innerHTML='';return}
  const pick=d=>d.filter(([r])=>r.startsWith(CSEG)).map(([,w])=>w);
  const list=[...(S.set.learned?pick(DICT_LEARN):[]),...pick(DICT_BASE)];
  const kata=CSEG.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
  CAND=[...new Set([...list,CSEG,kata])].slice(0,10);
  box.innerHTML=CAND.map((w,i)=>`<button type="button" data-a="cand" data-v="${i}">${esc(w)}</button>`).join('');
}

function calFmt(s){if(s==='エラー')return s;if(/e/.test(s))return s;const[a,b]=s.split('.');const neg=a.startsWith('-');const n=(neg?a.slice(1):a).replace(/\B(?=(\d{3})+(?!\d))/g,',');return(neg?'-':'')+n+(b!==undefined?'.'+b:'')}
function calNum(r){if(!isFinite(r))return'エラー';let s=String(parseFloat(r.toPrecision(9)));if(s.replace(/[-.]/g,'').length>9)s=r.toExponential(4);return s}
const calDo=(a,b,o)=>o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b;

    const K=[[ac,'l'],['±','l'],['%','l'],['÷','o'],['7'],['8'],['9'],['×','o'],['4'],['5'],['6'],['−','o'],['1'],['2'],['3'],['+','o'],['0','z'],['.'],['=','o']];
    el.innerHTML=`<div class="calc-d" aria-live="polite">${calFmt(CAL.cur)}</div><div class="calc-k">${K.map(([k,c])=>`<button class="ck ${c||''} ${CAL.op===k&&CAL.fresh?'on':''}" type="button" data-a="calK" data-v="${k}">${k}</button>`).join('')}</div>`;
  }
};
function calKey(c,k){
  if(/^[0-9]$/.test(k)){if(c.fresh||c.cur==='0'||c.cur==='エラー'){c.cur=k;c.fresh=false}else if(c.cur.replace(/[-.]/g,'').length<9)c.cur+=k}
  else if(k==='.'){if(c.fresh){c.cur='0.';c.fresh=false}else if(!c.cur.includes('.'))c.cur+='.'}
  else if(k==='AC'){Object.assign(c,{cur:'0',prev:null,op:null,fresh:false})}
  else if(k==='C'){c.cur='0'}
  else if(k==='±'){if(c.cur!=='0')c.cur=c.cur.startsWith('-')?c.cur.slice(1):'-'+c.cur}
  else if(k==='%'){c.cur=calNum(parseFloat(c.cur)/100)}
  else if(k==='='){if(c.op!=null&&c.prev!=null){c.cur=calNum(calDo(c.prev,parseFloat(c.cur),c.op));c.op=null;c.prev=null;c.fresh=true}}
  else{if(c.op&&!c.fresh&&c.prev!=null)c.cur=calNum(calDo(c.prev,parseFloat(c.cur),c.op));c.prev=parseFloat(c.cur);c.op=k;c.fresh=true}
}

/* アラーム音（WebAudio） */
let BEEP=null;
function beepStart(){beepStop();try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;g.gain.value=0;o.connect(g);g.connect(AC.destination);o.start();let k=0;const iv=setInterval(()=>{g.gain.value=(k++%4<2&&k%8<6)?.05:0},110);BEEP={o,g,iv}}catch(_){}}
function beepStop(){if(BEEP){clearInterval(BEEP.iv);try{BEEP.o.stop()}catch(_){}BEEP=null}}
function ringAlarm(title,sub){
  if(!S||S.over)return;
  closeLayer();
  let c=$('#alarmUI');if(!c){c=document.createElement('div');c.id='alarmUI';$('#screen').insertBefore(c,$('#banner'))}
  c.className='call alarm';
  c.innerHTML=`<small>${esc(sub)}</small><h3 class="alm-now">${hhmm()}</h3><h3>${esc(title)}</h3><div class="sub">⏰</div><div class="cbtns"><button type="button" data-a="almSnooze"><i style="background:#ff9f0a">${'<svg viewBox="0 0 24 24"><path d="M14 3a8 8 0 1 0 7 11A7 7 0 0 1 14 3z"/></svg>'}</i>スヌーズ</button><button type="button" data-a="almStop"><i style="background:#fff"><svg viewBox="0 0 24 24" style="fill:#111"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></i>停止</button></div>`;
  beepStart();try{navigator.vibrate&&navigator.vibrate([400,200,400])}catch(_){}
}
function alarmOff(){beepStop();const c=$('#alarmUI');if(c)c.remove()}
ACT.almStop=()=>alarmOff();
ACT.almSnooze=()=>{alarmOff();S.snooze=gsec()+60;toast('1分後にもう一度鳴ります')};
function alarmTick(){
  if(!S.started)return;
  const now=hhmm();
  if(now!==CLK.lastMin){CLK.lastMin=now;S.alarms.filter(a=>a.on&&a.t===now).forEach(a=>ringAlarm(a.label,'アラーム'))}
  if(S.snooze&&gsec()>=S.snooze){S.snooze=0;ringAlarm('スヌーズ','アラーム')}
  if(S.app!=='clock')timerCheck();
}

/* ふわふわ睡眠: WebAudio で環境音 */
const SLP={snd:null};let AC=null,SN=null;
function stopSleep(){if(SN){SN.forEach(n=>{try{n.stop?n.stop():n.disconnect()}catch(_){}});SN=null}SLP.snd=null}
function playSleep(kind){
  stopSleep();
  try{
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume&&AC.resume();
    const len=AC.sampleRate*2,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;if(kind==='rain')d[i]=w*.5;else{last=(last+.02*w)/1.02;d[i]=last*3.5}}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type=kind==='rain'?'highpass':'lowpass';f.frequency.value=kind==='rain'?900:kind==='wave'?700:420;
    const g=AC.createGain();g.gain.value=kind==='rain'?.06:.22;
    src.connect(f);f.connect(g);g.connect(AC.destination);src.start();
    SN=[src,g];
    if(kind==='wave'){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=.12;lg.gain.value=.16;l.connect(lg);lg.connect(g.gain);l.start();SN.push(l)}
  }catch(_){}
  SLP.snd=kind;
}

const THREE_URL='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
let threeP=null;
function loadThree(){
  if(window.THREE)return Promise.resolve(window.THREE);
  if(threeP)return threeP;
  threeP=new Promise((res,rej)=>{
    const s=document.createElement('script');s.src=THREE_URL;s.async=true;
    s.onload=()=>window.THREE?res(window.THREE):rej('no THREE');
    s.onerror=()=>{threeP=null;rej('load error')};
    document.head.appendChild(s);
    setTimeout(()=>rej('timeout'),8000);
  });
  return threeP;
}

async function mount3D(box,kind,big){

  if(!box.isConnected)return false;

    stop3D();
    const W=box.clientWidth||320,H=Math.round(W*.75);
    const r=new T.WebGLRenderer({antialias:true});
    r.setPixelRatio(Math.min(2,window.devicePixelRatio||1));r.setSize(W,H);
    r.shadowMap.enabled=true;r.shadowMap.type=T.PCFSoftShadowMap;
    const scene=new T.Scene(),cam=new T.PerspectiveCamera(36,W/H,.1,60);
    const api=kind==='bed'?buildBed(T,scene,cam):buildFight(T,scene,cam,big);
    r.domElement.className='scn3d';r.domElement.setAttribute('role','img');r.domElement.setAttribute('aria-label',kind==='bed'?'ベッドで寄りそって眠るふたり（3D）':'スマホを突きつける彼女と、正座する彼氏（3D）');
    box.innerHTML='';box.appendChild(r.domElement);
    S3.r=r;S3.ev=api.ev;
    if(window.ResizeObserver){S3.ro=new ResizeObserver(()=>{const w=box.clientWidth;if(!w||!S3.r)return;const h=Math.round(w*.75);S3.r.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()});S3.ro.observe(box)}
    const t0=performance.now();let last=t0;
    const loop=now=>{S3.raf=requestAnimationFrame(loop);const t=(now-t0)/1000,dt=(now-last)/1000;last=now;api.update(t,dt);r.render(scene,cam)};
    S3.raf=requestAnimationFrame(loop);
    return true;
  }catch(e){console.warn('3D failed',e);stop3D();return false}
}

function fingerAt(x,y){const f=$('#finger');f.style.left=x+'px';f.style.top=y+'px';f.classList.add('show')}
function reveal(el){
  let p=el.parentElement;const sc=$('#screen');
  while(p&&p!==sc){const cs=getComputedStyle(p);
    if(/(auto|scroll)/.test(cs.overflowY)&&p.scrollHeight>p.clientHeight+2){const pr=p.getBoundingClientRect(),er=el.getBoundingClientRect();p.scrollTop+=er.top-pr.top-(pr.height-er.height)/2;break}
    p=p.parentElement}
}
async function point(el){
  if(!el)return false;
  reveal(el);await wait(200);
  const r=el.getBoundingClientRect();if(!r.width)return false;
  fingerAt(r.left+r.width/2,r.top+Math.min(r.height/2,30));await wait(560);
  return true;
}
async function tapEl(el,fn,after=500){

  el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
}

  moon:'<svg viewBox="0 0 24 24"><path d="M14 3a8 8 0 1 0 7 11A7 7 0 0 1 14 3z"/></svg>',
  half:'<svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18zm0 1.6a7.4 7.4 0 0 1 0 14.8z"/></svg>',
  sun:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M11 1h2v4h-2zM11 19h2v4h-2zM1 11h4v2H1zM19 11h4v2h-4z"/></svg>',
  torch:'<svg viewBox="0 0 24 24"><path d="M8 2h8v4l-2 4v12h-4V10L8 6z"/></svg>',
};
const CC={torch:false,dnd:false};
function renderCC(){
  const st=S.set,r=(k,c,i)=>`<button class="cc-r ${st[k]?'on '+c:''}" type="button" data-a="ccTg" data-v="${k}" aria-label="${k}">${CCI[i]}</button>`;
  $('#cc').innerHTML=`<div class="cc-bk" data-a="ccX"></div><div class="cc-g" id="ccg">
  <div class="cc-b w2 h2 cc-conn" style="display:grid">${r('airplane','o','air')}<button class="cc-r on g" type="button" aria-label="モバイル通信">${CCI.cell}</button>${r('wifi','b','wifi')}${r('bt','b','bt')}</div>
  <div class="cc-b w2 h2 cc-mu"><span><b>夜ふかしのうた</b><br>Moonlit Bus</span><button type="button" data-a="ccMus" aria-label="再生">${MUS.play?'<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>'}</button></div>
  <div class="cc-b h2 cc-bri" id="ccBri" aria-label="明るさ"><i style="height:${st.bright*100}%"></i>${CCI.sun}</div>
  <button class="cc-b ${st.dark?'on':''}" type="button" data-a="ccDark" aria-label="ダークモード">${CCI.half}</button>
  <button class="cc-b ${CC.dnd?'on':''}" type="button" data-a="ccDnd" aria-label="集中モード">${CCI.moon}</button>
  <button class="cc-b ${CC.torch?'on':''}" type="button" data-a="ccTorch" aria-label="ライト">${CCI.torch}</button>
  <button class="cc-b" type="button" data-a="ccApp" data-v="calc" aria-label="電卓">${ICONS.calc[1].replace(/#1c1c1e/,'none')?`<svg viewBox="0 0 60 60" style="width:30px;height:30px">${ICONS.calc[1]}</svg>`:''}</button>
  <button class="cc-b" type="button" data-a="ccApp" data-v="camera" aria-label="カメラ"><svg viewBox="0 0 60 60" style="width:32px;height:32px">${ICONS.camera[1]}</svg></button>
  <button class="cc-b" type="button" data-a="ccApp" data-v="clock" aria-label="時計"><svg viewBox="0 0 60 60" style="width:30px;height:30px">${ICONS.clock[1]}</svg></button>
  <div class="cc-hint">上へスワイプ、または背景をタップで閉じる</div></div>`;
  const b=$('#ccBri');
  const set=e=>{const rc=b.getBoundingClientRect();S.set.bright=Math.min(1,Math.max(.05,(rc.bottom-e.clientY)/rc.height));$('i',b).style.height=S.set.bright*100+'%';applyDisplay();if(S.app==='settings')rerender()};
  let on=false;
  b.addEventListener('pointerdown',e=>{on=true;try{b.setPointerCapture(e.pointerId)}catch(_){}set(e)});
  b.addEventListener('pointermove',e=>{if(on)set(e)});
  b.addEventListener('pointerup',()=>on=false);b.addEventListener('pointercancel',()=>on=false);
  drag($('.cc-bk'),{up(s){if(s.dy<-40)closeCC()}});
}
function openCC(){closeLayer();renderCC();$('#cc').classList.add('on')}
function closeCC(){const c=$('#cc');if(!c.classList.contains('on'))return;const g=$('#ccg');if(g){g.style.transform='translateY(-40px)';g.style.opacity=0}setTimeout(()=>{c.classList.remove('on');c.innerHTML=''},200)}
drag($('#tz'),{up(s){if(s.dy>40)openCC()}});
ACT.ccX=()=>closeCC();
ACT.ccTg=v=>{ACT.setTg(v);renderCC()};
ACT.ccDark=()=>{S.set.dark=!S.set.dark;applyDisplay();if(S.app)rerender();renderCC()};
ACT.ccDnd=()=>{CC.dnd=!CC.dnd;renderCC()};
ACT.ccTorch=()=>{CC.torch=!CC.torch;renderCC()};
ACT.ccMus=()=>{MUS.play=!MUS.play;if(S.app==='music')rerender();renderCC()};
ACT.ccApp=v=>{closeCC();openApp(v)};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCC()});
if(!tickT)tickT=setInterval(tick,1000);
boot();
</script>

</body></html>
