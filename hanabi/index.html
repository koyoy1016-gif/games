<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>告白阻止花火</title></head><body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
/* 夜景の展望デッキを全画面キャンバスに。上部にHUDと太鼓風レーン、下に二人。単一の夜の世界観で固定。 */
:root{
  --night:#0a0d26;
  --ink:#f6f0e4;
  --mute:#a9acd0;
  --gold:#ffc65c;
  --don:#ff4b3e;
  --paper:#fffaf0;
  --paper-ink:#2a1c33;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;overflow:hidden}
body{background:var(--night);color:var(--ink);font-family:var(--f-body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#ui{position:fixed;inset:0;pointer-events:none}

.hud{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.tlabel{font-size:11px;letter-spacing:.14em;color:var(--mute);font-weight:700}
.tval{font-family:var(--f-display);font-size:30px;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--ink)}
.tval small{font-family:var(--f-body);font-weight:900;font-size:14px;margin-left:3px}
.sub{font-size:12px;color:var(--mute);margin-top:3px;font-variant-numeric:tabular-nums;font-weight:700}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.row{display:flex;gap:8px;align-items:center}
.chip{font-weight:900;font-size:12px;padding:3px 11px;border-radius:999px;background:var(--lv,#5fd4c0);color:#14112a;letter-spacing:.06em}
.shells{display:flex;gap:5px;align-items:center}
.shells i{display:block;width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe3a6,#ff8a3d 60%,#b8481e);box-shadow:0 0 8px rgba(255,150,60,.55);transition:transform .2s}
.shells i.off{background:rgba(255,255,255,.13);box-shadow:none}
.shells i.lost{animation:lost .45s ease-out}
@keyframes lost{0%{transform:scale(1.6)}100%{transform:scale(1)}}
.shl{font-size:10px;color:var(--mute);font-weight:700;letter-spacing:.08em}
.goal{font-family:var(--f-display);font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums}
.goal.pop{animation:lost .45s ease-out}
#mute{pointer-events:auto;font:700 11px var(--f-body);color:var(--mute);background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;cursor:pointer}
#mute:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.bubble{position:absolute;left:0;top:0;width:max-content;max-width:min(60vw,250px);padding:8px 14px 9px;background:var(--paper);color:var(--paper-ink);border-radius:16px;font-weight:900;font-size:clamp(15px,4.3vw,19px);line-height:1.35;box-shadow:0 6px 18px rgba(0,0,0,.4);letter-spacing:.02em}
.bubble::after{content:"";position:absolute;left:var(--tx,24px);bottom:-7px;width:14px;height:14px;background:inherit;transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
.bubble.thought{background:#e9e3f3;color:#5a4a6b;font-weight:700}
.bubble.thought::after{width:9px;height:9px;border-radius:50%;bottom:-15px;transform:translateX(-50%)}
.bubble.woman{background:#ffeef3}
.drown{display:inline-block;color:var(--don);animation:drown .7s ease-out forwards}
@keyframes drown{0%{transform:scale(1.5);opacity:1;filter:blur(0)}100%{transform:scale(.85) translateY(3px);opacity:.25;filter:blur(2px)}}

.boom{position:absolute;font-family:var(--f-display);font-size:clamp(40px,12vw,72px);color:#fff6d8;-webkit-text-stroke:2px var(--don);paint-order:stroke fill;text-shadow:0 0 18px rgba(255,190,90,.8);white-space:nowrap;animation:boom .9s cubic-bezier(.2,1.4,.4,1) forwards}
.boom.small{font-size:clamp(28px,8vw,46px);-webkit-text-stroke:1.5px #c46aa0}
.boom.dud{font-family:var(--f-body);font-weight:900;font-size:20px;color:#cfc8e2;-webkit-text-stroke:0;text-shadow:none}
@keyframes boom{0%{transform:translate(-50%,-50%) scale(.3) rotate(-8deg);opacity:0}15%{opacity:1}30%{transform:translate(-50%,-50%) scale(1.1) rotate(-4deg)}100%{transform:translate(-50%,-75%) scale(1) rotate(-4deg);opacity:0}}

#toast{position:absolute;left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:17px;color:var(--gold);text-shadow:0 2px 0 #1a0f2b,0 0 14px rgba(255,198,92,.5);white-space:nowrap;opacity:0}
#toast.show{animation:toast 1.9s ease-out forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,8px)}12%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-6px)}}
#pad{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;justify-content:center;gap:clamp(8px,3vw,16px);pointer-events:none}
#pad button{pointer-events:auto;position:relative;width:min(20vw,76px);height:min(20vw,76px);border-radius:50%;border:3px solid #fff4ea;font-family:var(--f-display);font-size:clamp(17px,5vw,22px);color:#fff;cursor:pointer;background:radial-gradient(circle at 35% 30%,var(--hi),var(--c) 58%,var(--lo));box-shadow:0 4px 0 rgba(0,0,0,.5),0 0 16px var(--c);text-shadow:0 1px 3px rgba(0,0,0,.55);touch-action:manipulation;transition:transform .08s}
#pad button small{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);font:700 10px var(--f-body);color:var(--mute);text-shadow:none}
#pad button.hit{transform:translateY(3px) scale(.93);box-shadow:0 1px 0 rgba(0,0,0,.5),0 0 30px var(--c)}
#pad button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#pad .c0{--c:#ff4646;--hi:#ff9a9a;--lo:#b81e1e}#pad .c1{--c:#3d9bff;--hi:#a6d2ff;--lo:#1b56b8}#pad .c2{--c:#f2c418;--hi:#fff09a;--lo:#b08a00;color:#3a2a00;text-shadow:none}#pad .c3{--c:#2fcf6a;--hi:#a6f5c2;--lo:#178a40}
@media (hover:none){#pad button small{display:none}}
@media (hover:hover){#pad{bottom:calc(env(safe-area-inset-bottom,0px) + 22px)}}
#hint{position:absolute;font-size:12px;font-weight:700;color:var(--ink);background:rgba(9,8,28,.7);border:1px solid rgba(255,255,255,.12);padding:4px 10px;border-radius:999px;white-space:nowrap}

.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(360px,calc(100vw - 32px));max-height:calc(100% - 40px);overflow:auto;pointer-events:auto;padding:22px 20px 20px;border-radius:20px;background:rgba(10,12,36,.88);border:1px solid rgba(255,198,92,.32);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);box-shadow:0 20px 60px rgba(0,0,0,.55);display:flex;flex-direction:column;gap:14px}
.eyebrow{margin:0;font-size:11px;letter-spacing:.18em;color:var(--mute);font-weight:700}
h1,h2{margin:0;font-family:var(--f-display);font-weight:400;line-height:1.05;text-wrap:balance;background:linear-gradient(180deg,#fff3cf 0%,#ffc65c 45%,#ff7a8a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
h1{font-size:clamp(38px,11vw,50px)}
h1 span{display:block;font-size:.55em;margin-bottom:4px}
h2{font-size:34px}
.demo{position:relative;height:44px;border-radius:22px;background:rgba(9,8,28,.95);border:1.5px solid rgba(255,198,92,.5);overflow:hidden}
.demo .judge{position:absolute;left:12px;top:50%;width:32px;height:32px;margin-top:-16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.75);animation:jflash 2.2s infinite}
.demo .note{position:absolute;top:50%;width:30px;height:30px;margin-top:-15px;border-radius:50%;background:#3d9bff;border:3px solid #fff4ea;box-shadow:0 0 0 2px #1b0c10;color:#fff;font-family:var(--f-display);font-size:14px;display:grid;place-items:center;animation:slide 2.2s linear infinite}
.demo .tap{position:absolute;left:54px;top:50%;transform:translateY(-50%);font-family:var(--f-display);color:var(--gold);font-size:14px;opacity:0;animation:tapw 2.2s infinite}
@keyframes slide{0%{left:calc(100% - 38px);opacity:1}60%{left:13px;opacity:1}62%,100%{left:13px;opacity:0}}
@keyframes jflash{0%,58%{box-shadow:none}61%{box-shadow:0 0 0 5px rgba(255,198,92,.6),0 0 22px rgba(255,198,92,.9)}85%,100%{box-shadow:none}}
@keyframes tapw{0%,58%{opacity:0}61%{opacity:1}88%,100%{opacity:0}}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.6;font-weight:500}
.rules li{position:relative;padding-left:16px}
.rules li::before{content:"";position:absolute;left:2px;top:.65em;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.rules b{font-weight:900;color:#fff}
.cr{color:#ff6b6b}.cb{color:#62b0ff}.cy{color:#ffd84a}.cg{color:#4fe08a}
.mini{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#ff4646;color:#fff;border:2px solid #fff4ea;font-family:var(--f-display);font-size:11px;vertical-align:-4px;margin:0 2px}
.btn{pointer-events:auto;font-family:var(--f-display);font-size:20px;letter-spacing:.08em;color:#fff;background:var(--don);border:none;border-radius:999px;padding:14px 20px;cursor:pointer;box-shadow:0 4px 0 #a02a20,0 10px 24px rgba(255,75,62,.35)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a02a20}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:4px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.seg button{pointer-events:auto;font:900 14px var(--f-body);color:var(--mute);background:transparent;border:0;border-radius:10px;padding:8px 4px;cursor:pointer;display:grid;gap:1px;line-height:1.25}
.seg button small{font-size:10px;font-weight:700;opacity:.85}
.seg button[aria-pressed="true"]{background:var(--gold);color:#2a1c33}
.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.modeDesc{margin:-6px 0 0;font-size:12px;color:var(--mute);font-weight:700;text-align:center;min-height:1.6em}
.rowbtn{display:flex;gap:8px}
.rowbtn .btn{flex:1}
.btn.sub{background:rgba(255,255,255,.1);box-shadow:none;font-size:15px;color:var(--ink);border:1px solid rgba(255,255,255,.2)}
.rankL{font-family:var(--f-display);font-size:44px;line-height:1;color:var(--gold);margin-left:auto;text-shadow:0 0 18px rgba(255,198,92,.5)}
.bigrow{display:flex;align-items:flex-end;gap:10px}
#count{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);font-family:var(--f-display);font-size:clamp(70px,22vw,120px);color:#fff6d8;-webkit-text-stroke:3px var(--don);paint-order:stroke fill;text-shadow:0 0 30px rgba(255,190,90,.8);pointer-events:none}
#count.go{font-size:clamp(44px,13vw,72px)}
#count.pop{animation:cpop .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes cpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}
.fine{margin:0;font-size:12px;color:var(--mute);text-align:center;font-weight:700}
.big{font-family:var(--f-display);font-size:58px;line-height:1;color:var(--gold);font-variant-numeric:tabular-nums}
.big small{font-family:var(--f-body);font-weight:900;font-size:16px;color:var(--ink);margin-left:6px}
.rank{margin:0;font-weight:900;font-size:15px}
.rank em{font-style:normal;color:var(--gold)}
.stats{margin:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:rgba(255,255,255,.06);border-radius:12px;padding:8px 10px}
.stats dt{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.06em}
.stats dd{margin:0;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.new{color:var(--don);font-family:var(--f-display);margin-left:6px}
@media (prefers-reduced-motion:reduce){
  .boom{animation:fade .9s forwards}
  @keyframes fade{0%{opacity:1;transform:translate(-50%,-50%)}100%{opacity:0;transform:translate(-50%,-50%)}}
  .demo .note{animation-duration:3.5s}.demo .judge,.demo .tap{animation-duration:3.5s}
}
</style>

<canvas id="cv" aria-label="夜景の展望デッキ。上がる花火の色を見て、下の色ボタンを押す"></canvas>
<div id="ui">
  <div class="hud" id="hud">
    <div>
      <div class="tlabel">耐えた時間</div>
      <div class="tval"><span id="time">0.0</span><small>秒</small></div>
      <div class="sub"><span id="blocks">0</span>回阻止 · <span id="combo">0</span>コンボ</div>
    </div>
    <div class="right">
      <div class="row"><span class="chip" id="level">かんたん</span><button id="mute" type="button">音 ON</button></div>
      <div class="row"><span class="shl">のこり</span><span class="goal" id="goal">15.0秒</span></div>
    </div>
  </div>

  <div id="manB" class="bubble man" hidden><span class="txt"></span></div>
  <div id="womanB" class="bubble woman" hidden><span class="txt"></span></div>
  <div id="toast"></div>
  <div id="hint" hidden>丸に重なった瞬間に同じ色！2個同時は両方</div>
  <div id="fx"></div>
  <div id="count" hidden></div>
  <div id="pad" role="group" aria-label="花火の色">
    <button type="button" class="c0" data-c="0">赤<small>D</small></button>
    <button type="button" class="c1" data-c="1">青<small>F</small></button>
    <button type="button" class="c2" data-c="2">黄<small>J</small></button>
    <button type="button" class="c3" data-c="3">緑<small>K</small></button>
  </div>

  <section class="panel" id="titleP">
    <p class="eyebrow">夜景デッキ・告白阻止リズム</p>
    <h1><span>その「つ」を消せ</span>告白阻止花火</h1>
    <div class="demo" aria-hidden="true"><span class="judge"></span><span class="note">つ</span><span class="tap">ドーン!</span></div>
    <ul class="rules">
      <li>彼は15秒間ずっと「俺と……」と言いかけています。</li>
      <li>流れてくる<span class="mini">つ</span>が左の丸に重なった瞬間に、<b>同じ色のボタン</b>（<span class="cr">赤</span>・<span class="cb">青</span>・<span class="cy">黄</span>・<span class="cg">緑</span>）を押して告白をかき消そう。</li>
      <li><b>2個同時</b>は両方の色を押す。<b>1回でもミス</b>したら告白成功。<b>15秒</b>耐えきったら……？</li>
    </ul>
    <div class="seg" role="group" aria-label="難易度">
      <button type="button" data-m="0" aria-pressed="false">やさしい<small id="b0">-</small></button>
      <button type="button" data-m="1" aria-pressed="true">ふつう<small id="b1">-</small></button>
      <button type="button" data-m="2" aria-pressed="false">むずかしい<small id="b2">-</small></button>
    </div>
    <p class="modeDesc" id="modeDesc"></p>
    <button class="btn" id="startBtn" type="button">はじめる</button>
    <p class="fine" id="bestLine">キーボードは D / F / J / K（赤・青・黄・緑）</p>
  </section>

  <section class="panel" id="resultP" hidden>
    <p class="eyebrow" id="rEyebrow">結果</p>
    <h2 id="rTitle">告白、成立。</h2>
    <div class="bigrow"><div class="big"><span id="rSec">0.0</span><small>秒 耐えた</small></div><span class="rankL" id="rLetter"></span></div>
    <p class="rank">称号：<em id="rRank"></em></p>
    <dl class="stats">
      <div><dt>阻止</dt><dd id="rBlocks">0</dd></div>
      <div><dt>最大コンボ</dt><dd id="rCombo">0</dd></div>
      <div><dt>良</dt><dd id="rGood">0</dd></div>
    </dl>
    <p class="fine" id="rBest"></p>
    <div class="rowbtn"><button class="btn" id="againBtn" type="button">もう一回</button><button class="btn sub" id="toTitle" type="button">難易度</button></div>
    <button class="btn sub" id="shareBtn" type="button">結果をコピー</button>
  </section>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('cv'), ctx=cv.getContext('2d');
const manB=$('manB'), womanB=$('womanB'), hint=$('hint'), fxL=$('fx');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const lerp=(a,b,k)=>a+(b-a)*k;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

/* ---------- clock (pauses while tab hidden) ---------- */
let pausedTotal=0, hiddenAt=null;
const now=()=>performance.now()/1000-pausedTotal;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden) hiddenAt=performance.now()/1000;
  else if(hiddenAt!=null){pausedTotal+=performance.now()/1000-hiddenAt;hiddenAt=null;}
});

/* ---------- layout ---------- */
let W,H,dpr,S,hy,railY,floorY,gy,manX,womanX,laneTop,laneH=58,judgeX,laneEnd;
let skyC,cityC,stars=[],redLights=[];
const skyTop=()=>laneTop+laneH+30;
function mk(){const c=document.createElement('canvas');c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);const g=c.getContext('2d');g.scale(dpr,dpr);return [c,g];}

function resize(){
  dpr=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  S=clamp(Math.min(W/430,H/860),0.55,1.3);
  laneTop=$('hud').getBoundingClientRect().bottom+8;
  judgeX=10+laneH/2+6;laneEnd=W-10-laneH/2;
  gy=Math.min(H*.87,H-104-(parseFloat(getComputedStyle(document.documentElement).paddingBottom)||0));floorY=gy-H*.105;railY=floorY-H*.035;hy=railY-H*.165;
  manX=W/2-54*S;womanX=W/2+54*S;
  buildBackground();
  hint.style.top=(laneTop+laneH+6)+'px';hint.style.left=(judgeX+28)+'px';
  $('toast').style.top=(laneTop+laneH+44)+'px';
  placeBubbles();
}

function buildBackground(){
  let g;
  [skyC,g]=mk();
  const gr=g.createLinearGradient(0,0,0,hy);
  gr.addColorStop(0,'#060920');gr.addColorStop(.45,'#121848');gr.addColorStop(.8,'#2a2562');gr.addColorStop(1,'#46306a');
  g.fillStyle=gr;g.fillRect(0,0,W,hy+4);
  const hg=g.createRadialGradient(W*.45,hy,10,W*.45,hy,Math.max(W,H)*.6);
  hg.addColorStop(0,'rgba(255,140,120,.20)');hg.addColorStop(1,'rgba(255,140,120,0)');
  g.fillStyle=hg;g.fillRect(0,0,W,hy+4);
  // moon
  const mx=W*.84,my=laneTop+laneH+H*.08,mr=20*S;
  const mg=g.createRadialGradient(mx,my,mr*.5,mx,my,mr*4);mg.addColorStop(0,'rgba(255,240,210,.22)');mg.addColorStop(1,'rgba(255,240,210,0)');
  g.fillStyle=mg;g.fillRect(mx-mr*4,my-mr*4,mr*8,mr*8);

/* ---------- audio ---------- */
let AC=null,master=null,noiseBuf=null,muted=store.get('kk-muted')==='1';
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain();master.gain.value=muted?0:.7;master.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){AC=null;}
}
function env(g,t0,a,peak,dec){g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(.0001,t0+a+dec);}
function noise(t0,dur,type,freq,peak,dec,q){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q||1;const g=AC.createGain();env(g,t0,.005,peak,dec);s.connect(f);f.connect(g);g.connect(master);s.start(t0,Math.random());s.stop(t0+dur);return f;}
function tone(t0,type,f0,f1,peak,dec){const o=AC.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t0+dec);const g=AC.createGain();env(g,t0,.004,peak,dec);o.connect(g);g.connect(master);o.start(t0);o.stop(t0+dec+.05);}
const sfx={
  don(){if(!AC)return;const t=AC.currentTime;tone(t,'sine',190,70,.7,.2);noise(t,.06,'bandpass',1800,.12,.04,1.2);},
  boom(sz){if(!AC)return;sz=sz||1;const t=AC.currentTime;const f=noise(t,2,'lowpass',1200,.9*sz,1.2+.3*sz);f.frequency.setValueAtTime(1300,t);f.frequency.exponentialRampToValueAtTime(140,t+1);tone(t,'sine',72,34,.5*sz,.6);for(let i=0;i<10;i++)noise(t+.3+Math.random()*.8,.05,'highpass',4200,.05*sz,.03);},
  dud(){if(!AC)return;const t=AC.currentTime;tone(t,'triangle',230,90,.18,.18);noise(t,.2,'bandpass',600,.16,.14);},
  blip(hi){if(!AC)return;const t=AC.currentTime;tone(t,'square',hi?640:250,null,.025,.05);},
  whistle(d){if(!AC)return;const t=AC.currentTime;tone(t,'sine',500,1500,.022,d);},
  chime(){if(!AC)return;const t=AC.currentTime;[523,659,784,1047].forEach((f,i)=>tone(t+i*.11,'sine',f,null,.14,.7));}
};
function renderMute(){$('mute').textContent=muted?'音 OFF':'音 ON';if(master)master.gain.value=muted?0:.7;}
$('mute').addEventListener('click',e=>{e.stopPropagation();initAudio();muted=!muted;store.set('kk-muted',muted?'1':'0');renderMute();});

const rockets=[],parts=[],flashes=[];
const COLS=[{n:'赤',c:'#ff4646',l:'#ffc4c4'},{n:'青',c:'#3d9bff',l:'#d2e8ff'},{n:'黄',c:'#ffd23f',l:'#fff4c4'},{n:'緑',c:'#3fe07a',l:'#d4ffe2'}];
const AMB_PAL=[['#b48cff','#efe3ff'],['#ff8a3d','#ffe0c2'],['#ff7ac8','#ffe0f2'],['#e8e8f0','#ffffff']];
const PAL=[['#ff5a6e','#ffd1dc'],['#ffd166','#fff3c4'],['#6ee7ff','#e0fbff'],['#b48cff','#efe3ff'],['#7dff9a','#e6ffe9'],['#ff8a3d','#ffe0c2']];
function launch(x,y,o){o=o||{};const dur=o.dur||rand(.75,1.05);
  const r={x0:o.x0!=null?o.x0:x+rand(-30,30)*S,y0:hy+2,x,y,t0:now(),dur,kind:o.kind||pick(['peony','peony','ring','willow','chrys']),size:o.size||1,pal:o.pal||pick(PAL),cb:o.cb,sound:o.sound,trail:o.trail,rev0:o.rev0||0,rev1:o.rev1!=null?o.rev1:1,flick:o.flick,main:o.main};

function skyPoint(x,y){
  const a=skyTop()+10,b=Math.max(a+1,hy-80);
  if(x==null)return [rand(W*.15,W*.85),rand(a,b)];
  return [clamp(x,30,W-30),(y!=null&&y>a&&y<b+30)?y:rand(a,b)];
}
function burst(r){
  const x=r.cx!=null?r.cx:r.x0,y=r.cy!=null?r.cy:r.y0,k=S*r.size,c1=r.pal[0],c2=r.pal[1];
  const add=(vx,vy,c,life,o)=>parts.push({x,y,vx,vy,c,life,max:life,w:o.w||2,g:o.g!=null?o.g:55,drag:o.drag!=null?o.drag:1.6,tr:o.tr||.04,fl:o.fl});
  if(r.kind==='ring'){for(let i=0;i<96;i++){const a=i/96*6.283;add(Math.cos(a)*190*k,Math.sin(a)*190*k,c1,1.4,{w:2.2});}for(let i=0;i<60;i++){const a=i/60*6.283;add(Math.cos(a)*110*k,Math.sin(a)*110*k,c2,1.2,{w:1.8});}for(let i=0;i<40;i++){const a=rand(0,6.283),sp=rand(20,80)*k;add(Math.cos(a)*sp,Math.sin(a)*sp,c2,1,{w:1.5,fl:1});}}

  else{for(let i=0;i<180;i++){const a=rand(0,6.283),sp=150*k*Math.sqrt(rand(.5,1));add(Math.cos(a)*sp,Math.sin(a)*sp,Math.random()<.7?c1:c2,1.5,{w:2.2,fl:Math.random()<.3});}for(let i=0;i<50;i++){const a=rand(0,6.283),sp=rand(30,80)*k;add(Math.cos(a)*sp,Math.sin(a)*sp,'#fff6dc',.9,{w:1.4,fl:1});}}
  flashes.push({x,y,c:c1,t0:now(),r:280*k,a:.32*Math.min(1.3,r.size)});
  if(r.sound)sfx.boom(.55*r.size);
  if(r.cb)r.cb(x,y);
}
function updateFx(t,dt){
  for(let i=rockets.length-1;i>=0;i--){const r=rockets[i],p=clamp((t-r.t0)/r.dur,0,1),e=1-Math.pow(1-p,2.4);
    r.cx=lerp(r.x0,r.x,e);r.cy=lerp(r.y0,r.y,e);
    let tc='#ffcf8a',tw=1.6,tl=.45;
    if(r.trail){const vis=p>=r.rev0&&p<=r.rev1&&!(r.flick&&Math.random()<.5);if(vis)tc=r.trail;tw=r.main?2.8:1.9;tl=r.main?.7:.5;}
    if(parts.length<6000){parts.push({x:r.cx,y:r.cy,vx:rand(-12,12),vy:rand(20,50),c:tc,life:tl,max:tl,w:tw,g:30,drag:2,tr:.02});if(r.trail&&tc!=='#ffcf8a')parts.push({x:r.cx+rand(-3,3),y:r.cy+rand(0,6),vx:rand(-20,20),vy:rand(10,40),c:tc,life:tl*.8,max:tl*.8,w:tw*.8,g:30,drag:2,tr:.02});}
    if(p>=1||r.force){rockets.splice(i,1);burst(r);}}

  for(let i=0;i<parts.length;i++){const p=parts[i];p.life-=dt;if(p.life<=0)continue;const e=Math.exp(-p.drag*dt);p.vx*=e;p.vy=p.vy*e+p.g*S*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;parts[j++]=p;}
  parts.length=j;

function drawFx(t){

}

function colorPlan(answer,ch){

  for(let i=0;i<ch;i++){let c;do{c=Math.floor(Math.random()*4);}while(c===seq[0]);seq.unshift(c);}
  const sw=[];for(let k=1;k<=ch;k++)sw.push(1-(1-ZONE-.06)*(k/ch)*rand(.92,1));

  if(state!=='play')return;
  initAudio();
  const near=notes.filter(nt=>!nt.resolved&&Math.abs(t-nt.hitT)<=nt.ok).sort((a,b)=>a.hitT-b.hitT);
  const hit=near.find(nt=>nt.color===ci);
  if(hit){block(hit,t,t-hit.hitT);return;}
  if(near.length){wrong(ci,t,near[0]);return;}
  const soon=notes.find(nt=>!nt.resolved&&nt.hitT-t>0&&nt.hitT-t<.28);
  if(soon)dud(ci,t);
}

const FRAG=['俺と','俺と付き合','あのさ俺と','俺と','俺とつ','だから俺と','俺と付き'];
function block(c,t,d){
  c.resolved=true;
  n++;combo++;maxCombo=Math.max(maxCombo,combo);
  const good=Math.abs(d)<=c.good;if(good)goods++;
  judg.push({txt:good?'良':'可',col:good?'#ffc65c':'#ffffff',t0:t,y:c.lane});
  if(combo%10===0)toast(combo+'コンボ！');
  try{navigator.vibrate&&navigator.vibrate(good?18:10);}catch(e){}lastHitT=t;
  sfx.don();
  setBubble(manB,esc(pick(FRAG))+'<span class="drown">っ</span>','man');owner=null;
  man.flUntil=t+.8;man.talkUntil=0;
  const col=COLS[c.color],pal=[col.c,col.l],r=c.rocket;
  const cb=(bx,by)=>{if(good||Math.random()<.5)boomText(bx,by,good?'ドーン!!':'ドン!',good?'':'small');sfx.boom(good?.9:.7);woman.lookUntil=now()+1.2;};
  if(r&&rockets.includes(r)){r.size=good?1.25:1.05;r.force=true;r.cb=cb;r.kind=pick(['peony','chrys','ring']);}
  else{const p=r&&r.cx!=null?[r.cx,r.cy]:skyPoint();launch(p[0],p[1],{dur:.1,size:good?1.25:1.05,pal,cb,kind:pick(['peony','chrys','ring'])});}
  if(good&&parts.length<5000)later(t+.15,()=>{const q=skyPoint();launch(q[0],q[1],{dur:rand(.3,.5),size:rand(.6,.9),pal:pick(PAL)});});
  if(t>nextWomanT){nextWomanT=t+rand(1.8,2.6);later(t+.3,()=>{if(state==='play')womanSay(pick(W_LINES_ALL[mode]),1.2);});}
  updateHud();
}

function wrong(ci,t,nt){
  combo=0;try{navigator.vibrate&&navigator.vibrate([60,40,90]);}catch(e){}judg.push({txt:'色ちがい',col:COLS[ci].c,t0:t,y:nt.lane});sfx.dud();
  const r=nt.rocket,p=r&&r.cx!=null?[r.cx,r.cy]:skyPoint();
  boomText(p[0],p[1],'ぷすっ','dud');
  for(let i=0;i<18;i++){const a=rand(0,6.283),sp=rand(20,70)*S;parts.push({x:p[0],y:p[1],vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:COLS[ci].c,life:.5,max:.5,w:1.4,g:60,drag:2,tr:.04});}
  updateHud();endGame('wrong',t);
}
function dud(ci,t){
  combo=0;judg.push({txt:'早い！',col:'#8fa0d8',t0:t,y:0});sfx.dud();
  const p=skyPoint();
  for(let i=0;i<14;i++){const a=rand(0,6.283),sp=rand(20,70)*S;parts.push({x:p[0],y:p[1],vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,c:'#9a8fb8',life:.5,max:.5,w:1.4,g:60,drag:2,tr:.04});}
  boomText(p[0],p[1],'ぷすっ','dud');
  updateHud();endGame('dud',t);
}

function endGame(reason,t){
  state='ending';final=t-startT;hint.hidden=true;cleared=false;
  man.win=true;man.flUntil=0;woman.lookUntil=0;
  const toks=[];let speakStart=t;
  const spoken=[];
  if(spoken.length){for(const k of spoken)toks.push({t:k.t,s:k.s,dot:k.dot});
    const said=spoken.map(k=>k.s).join(''),rest=said.includes('俺と')?'付き合ってください！':'俺と付き合ってください！';
    [...rest].forEach((ch,i)=>toks.push({t:t+.05+i*.075,s:ch}));}
  else{setBubble(manB,'（今だ…！）','man thought');owner=null;speakStart=t+.6;[...'俺と付き合ってください！'].forEach((ch,i)=>toks.push({t:t+.6+i*.075,s:ch}));}
  cur={type:'end',tokens:toks,speakStart};
  const done=toks[toks.length-1].t;
  later(done+.6,()=>{woman.blush=1;womanSay(W_TALK[mode].yes,3.4);sfx.chime();heartsUntil=now()+2.6;});
  later(done+1,()=>launch(W/2,skyTop()+(hy-skyTop())*.3,{kind:'heart',size:1.35,pal:['#ff7aa8','#ffd1e0'],dur:.9,sound:true}));
  for(let i=0;i<6;i++)later(done+1.4+i*.3,()=>{const p=skyPoint();launch(p[0],p[1],{sound:i%2===0});});
  later(done+4.2,()=>showResult(false));
}

function winGame(t){
  state='ending';final=t-startT;hint.hidden=true;cleared=true;
  const toks=[];[...'俺と……'].forEach((ch,i)=>toks.push({t:t+1+i*.2,s:ch,dot:ch==='…'}));
  cur={type:'end',tokens:toks,speakStart:t+1};
  later(t+2.4,()=>{manB.hidden=true;woman.lookUntil=0;pose.surp=0;womanSay(W_TALK[mode].ang,2.6);sfx.dud();});
  later(t+2.6,()=>{man.win=false;man.flUntil=now()+30;});
  later(t+5.2,()=>{manB.hidden=true;womanSay(W_TALK[mode].no,3.2);});
  later(t+8.6,()=>{setBubble(manB,esc(W_TALK[mode].man),'man thought');owner=null;});
  for(let i=0;i<24;i++)later(t+8.8+i*.12+Math.random()*.08,()=>{const p=skyPoint();launch(p[0],p[1],{sound:i%3===0,size:rand(.8,1.3),dur:rand(.6,1)});});
  later(t+11.6,()=>showResult(true));
}

function rankOf(){return cleared?'告白クラッシャー（神）':final<2?'秒で落ちた':final<5?'見習い花火師':final<8?'一人前の花火師':final<11?'色読みの職人':final<14?'邪魔のプロ':'あと一歩の花火師';}
function showResult(win){
  state='result';
  $('rTitle').textContent=cleared?'ふられた。':'告白、成立。';
  $('rEyebrow').textContent=cleared?'クリア！ 15秒耐えきった':'失敗… あと'+Math.max(0,DUR-final).toFixed(1)+'秒だった';
  $('rSec').textContent=final.toFixed(1);$('rRank').textContent=rankOf();
  $('rBlocks').textContent=n;$('rCombo').textContent=maxCombo;$('rGood').textContent=goods;
  const ratio=n?goods/n:0,letter=!cleared?'':ratio>=.85?'S':ratio>=.6?'A':ratio>=.35?'B':'C';
  $('rLetter').textContent=letter;lastLetter=letter;
  const key='kk-best-'+mode,best=parseFloat(store.get(key)||'0'),bk='kk-rank-'+mode,br=store.get(bk)||'';
  if(cleared&&(!br||'SABC'.indexOf(letter)<'SABC'.indexOf(br)))store.set(bk,letter);
  if(final>best+.001){store.set(key,final.toFixed(1));$('rBest').innerHTML=MODES[mode].name+' 自己ベスト更新<span class="new">NEW!</span>';}
  else $('rBest').textContent=`${MODES[mode].name} 自己ベスト ${best>=DUR?'クリア':best.toFixed(1)+'秒'}`;
  renderModes();
  $('resultP').hidden=false;$('againBtn').focus({preventScroll:true});
}

/* ---------- lane ---------- */
function drawNote(x,y,a,ci){
  const col=ci==null?null:COLS[ci];
  ctx.globalAlpha=a;
  if(col){const g=ctx.createRadialGradient(x,y,6,x,y,34);g.addColorStop(0,hexA(col.c,.55));g.addColorStop(1,hexA(col.c,0));ctx.fillStyle=g;circ(ctx,x,y,34);ctx.fill();}
  ctx.fillStyle='#1b0c10';circ(ctx,x,y,23);ctx.fill();
  ctx.fillStyle=col?col.c:'#f6f0e4';circ(ctx,x,y,20);ctx.fill();
  ctx.lineWidth=3;ctx.strokeStyle=col?'#fff4ea':'#8a84a8';circ(ctx,x,y,19);ctx.stroke();
  ctx.fillStyle=col?(ci===2?'#3a2a00':'#fff'):'#2a1c33';ctx.font='19px "Dela Gothic One", sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('つ',x,y+1);
  ctx.globalAlpha=1;
}
function drawLane(t){
  const y=laneTop,h=laneH,cy=y+h/2,x0=10,x1=W-10;
  ctx.fillStyle='rgba(9,8,28,.8)';rr(ctx,x0,y,x1-x0,h,h/2);ctx.fill();
  ctx.strokeStyle='rgba(255,198,92,.5)';ctx.lineWidth=1.5;ctx.stroke();
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(judgeX,cy);ctx.lineTo(laneEnd,cy);ctx.stroke();
  const zx=judgeX+(laneEnd-judgeX)*ZONE;
  if(showZone()){ctx.save();rr(ctx,x0,y,x1-x0,h,h/2);ctx.clip();
  const zg=ctx.createLinearGradient(x0,0,zx,0);zg.addColorStop(0,'rgba(255,198,92,.16)');zg.addColorStop(1,'rgba(255,198,92,.07)');
  ctx.fillStyle=zg;ctx.fillRect(x0,y,zx-x0,h);ctx.restore();
  ctx.setLineDash([4,4]);ctx.strokeStyle='rgba(255,198,92,.85)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(zx,y+4);ctx.lineTo(zx,y+h-4);ctx.stroke();ctx.setLineDash([]);
  ctx.font='900 10px "Zen Maru Gothic", sans-serif';ctx.textAlign='center';ctx.textBaseline='top';ctx.fillStyle='rgba(255,214,140,.95)';
  ctx.textAlign='left';ctx.fillText('◀ 色確定',zx+5,y+4);}
  const hg=t-lastHitT;
  if(hg<.3){const a=1-hg/.3,g=ctx.createRadialGradient(judgeX,cy,4,judgeX,cy,42);g.addColorStop(0,`rgba(255,198,92,${.85*a})`);g.addColorStop(1,'rgba(255,198,92,0)');ctx.fillStyle=g;circ(ctx,judgeX,cy,42);ctx.fill();}
  ctx.lineWidth=2.5;ctx.strokeStyle='rgba(255,255,255,.78)';circ(ctx,judgeX,cy,24);ctx.stroke();
  ctx.lineWidth=1.5;ctx.strokeStyle='rgba(255,255,255,.28)';circ(ctx,judgeX,cy,16);ctx.stroke();
  if(state==='play'){
    for(let i=notes.length-1;i>=0;i--){const nt=notes[i];
      if(nt.resolved)continue;
      const prog=(nt.hitT-t)/nt.approach;
      if(prog>1||prog<-.3)continue;
      const nx=judgeX+prog*(laneEnd-judgeX),sc=nt.lane?.72:1,ny=cy+nt.lane*14;
      const ci=noteColor(nt,prog);
      if(nt.lastCi!==ci){if(nt.lastCi!=null)nt.swT=t;nt.lastCi=ci;}
      ctx.save();ctx.translate(nx,ny);ctx.scale(sc,sc);drawNote(0,0,1,ci);
      if(nt.swT&&t-nt.swT<.18){ctx.strokeStyle='rgba(255,255,255,'+(1-(t-nt.swT)/.18)+')';ctx.lineWidth=3;circ(ctx,0,0,24+(t-nt.swT)*60);ctx.stroke();}
      if(showZone()&&prog<=ZONE){ctx.strokeStyle='rgba(255,214,140,.9)';ctx.lineWidth=2;circ(ctx,0,0,27);ctx.stroke();}
      ctx.restore();
      if(nt.lane===1){const o=notes[i-1];if(o&&o.hitT===nt.hitT&&!o.resolved){ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(nx,cy-14+16);ctx.lineTo(nx,cy+14-16);ctx.stroke();}}
    }
  }
  judg=judg.filter(j=>t-j.t0<.7);
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='22px "Dela Gothic One", sans-serif';
  for(const j of judg){const k=(t-j.t0)/.7,yy=y+h+16-8*k+(j.y||0)*0;ctx.globalAlpha=1-k;ctx.lineWidth=4;ctx.strokeStyle='#120a1e';ctx.strokeText(j.txt,judgeX,yy);ctx.fillStyle=j.col;ctx.fillText(j.txt,judgeX,yy);}
  ctx.globalAlpha=1;
}

/* ---------- loop ---------- */
let lastT=now();
function update(t,dt){
  if(timers.length){const due=timers.filter(x=>x.t<=t);timers=timers.filter(x=>x.t>t);due.forEach(x=>x.fn());}
  if(state==='play'){
    const e=t-startT,lv=levelAt(e);
    if(lv!==curLv){curLv=lv;renderLevel();if(lv<4)toast(LV[lv].msg);}
    if(!said3&&e>=DUR-3){said3=true;toast('あと3秒！');}
    const missed=notes.find(nt=>!nt.resolved&&t>nt.hitT+nt.ok);
    if(missed){judg.push({txt:'見逃し',col:'#8fa0d8',t0:t,y:missed.lane});endGame('miss',t);}
    else if(e>=DUR&&notes.every(nt=>nt.resolved)){updateHud();winGame(t);}
    else if(t>nextTalkT&&t>man.flUntil){nextTalkT=t+rand(.5,.9);setBubble(manB,esc(pick(['俺と…','俺と……','あの、俺と…','俺と…！'])),'man');owner=null;man.talkUntil=t+.15;sfx.blip(false);}
  }else if(state==='count')updateCount(t);
  else if(state==='ending')renderSpeech(t);
  if((state==='title'||state==='result')&&t>nextAttract){const k=Math.random()<.4?2:1;for(let i=0;i<k;i++){const p=skyPoint();launch(p[0],p[1],{sound:!!AC&&state==='result'&&i===0,size:rand(.8,1.2)});}nextAttract=t+rand(.35,.85);}
  if(state==='play'&&t>nextAmb){const p=skyPoint();launch(p[0],p[1],{size:rand(.4,.65),dur:rand(.8,1.2),pal:pick(AMB_PAL),kind:pick(['peony','willow','ring'])});nextAmb=t+rand(1.1,2);}
  if(!womanB.hidden&&t>womanHideAt)womanB.hidden=true;
  if(t<heartsUntil&&Math.random()<dt*7)hearts.push({x:womanX+rand(-24,24)*S,y:gy-205*S,vx:rand(-10,10),vy:rand(-45,-30)*S,life:1.8,max:1.8,s:rand(9,15)*S});
  for(const hh of hearts){hh.life-=dt;hh.x+=hh.vx*dt;hh.y+=hh.vy*dt;}
  hearts=hearts.filter(hh=>hh.life>0);
  const k=Math.min(1,dt*10);
  pose.fl+=((t<man.flUntil?1:0)-pose.fl)*k;
  pose.win+=((man.win?1:0)-pose.win)*k;
  pose.look+=((t<woman.lookUntil?1:0)-pose.look)*k*.7;
  pose.surp+=((t<woman.lookUntil-.8?1:0)-pose.surp)*k;
  pose.blush+=(woman.blush-pose.blush)*k*.5;
  updateFx(t,dt);
  renderLeft(t);
  const tv=(state==='play'?Math.min(DUR,t-startT):state==='title'?0:final).toFixed(1);
  const te=$('time');if(te.textContent!==tv)te.textContent=tv;
}
function draw(t){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.drawImage(skyC,0,0,W,H);
  for(const s of stars){ctx.globalAlpha=.35+.65*Math.abs(Math.sin(t*s.sp+s.ph));ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.r,s.r);}
  ctx.globalAlpha=1;
  drawFx(t);
  ctx.drawImage(cityC,0,0,W,H);
  redLights.forEach((r,i)=>{const on=Math.sin(t*2.4+i*1.7)>.2;ctx.fillStyle=on?'#ff3b3b':'rgba(255,59,59,.25)';circ(ctx,r.x,r.y,1.8);ctx.fill();});
  // fireworks glow on water
  if(flashes.length){ctx.save();ctx.beginPath();ctx.rect(0,hy,W,railY-hy-4*S);ctx.clip();ctx.globalCompositeOperation='lighter';
    for(const f of flashes){const a=.3*Math.max(0,1-(t-f.t0)/.7);const wy=hy+(railY-hy)*.35,g=ctx.createRadialGradient(f.x,wy,0,f.x,wy,90*S);g.addColorStop(0,hexA(f.c,a));g.addColorStop(1,hexA(f.c,0));ctx.fillStyle=g;ctx.save();ctx.translate(f.x,wy);ctx.scale(.5,1);ctx.translate(-f.x,-wy);ctx.fillRect(f.x-90*S,wy-90*S,180*S,180*S);ctx.restore();}
    ctx.restore();}
  drawMan(t);drawWoman(t);
  for(const hh of hearts){ctx.globalAlpha=Math.min(1,hh.life/hh.max*1.5);ctx.fillStyle='#ff7aa8';heart(ctx,hh.x,hh.y,hh.s);ctx.fill();}
  ctx.globalAlpha=1;
  if(flashes.length){const f=flashes[flashes.length-1],age=t-f.t0;if(age<.35){ctx.globalCompositeOperation='lighter';ctx.fillStyle=hexA(f.c,.07*(1-age/.35));ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';}}
  drawLane(t);
}
function frame(){
  const t=now(),dt=Math.min(.05,Math.max(0,t-lastT));lastT=t;
  update(t,dt);draw(t);
  requestAnimationFrame(frame);
}

/* ---------- input ---------- */
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY);});
[...$('pad').children].forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();press(+b.dataset.c);}));
window.addEventListener('keydown',e=>{
  const map={KeyD:0,KeyF:1,KeyJ:2,KeyK:3,Digit1:0,Digit2:1,Digit3:2,Digit4:3};
  if(e.code in map){e.preventDefault();if(!e.repeat)press(map[e.code]);return;}
  if(e.code==='Space'&&(state==='title'||state==='result')&&document.activeElement&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();startGame();}
});
function renderModes(){
  document.querySelectorAll('.seg button').forEach(b=>{const m=+b.dataset.m;b.setAttribute('aria-pressed',m===mode?'true':'false');
    const bs=parseFloat(store.get('kk-best-'+m)||'0'),rk=store.get('kk-rank-'+m);$('b'+m).textContent=rk?'クリア '+rk:bs?bs.toFixed(1)+'秒':'未プレイ';});
  $('modeDesc').textContent=MODES[mode].desc;
}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>{mode=+b.dataset.m;store.set('kk-mode',mode);renderModes();sfx.blip(true);}));
$('toTitle').addEventListener('click',()=>{$('resultP').hidden=true;$('titleP').hidden=false;state='title';manB.hidden=true;womanB.hidden=true;});
$('shareBtn').addEventListener('click',()=>{
  const txt=cleared?`告白阻止花火【${MODES[mode].name}】15秒耐えきって、彼をふられさせた！ランク${lastLetter}（${n}発・最大${maxCombo}コンボ）`:`告白阻止花火【${MODES[mode].name}】${final.toFixed(1)}秒で告白されちゃった…（${n}発阻止）`;
  const full=txt+' '+location.href.split('#')[0];
  const done=()=>{$('shareBtn').textContent='コピーしました';setTimeout(()=>$('shareBtn').textContent='結果をコピー',1600);};
  try{navigator.clipboard.writeText(full).then(done,()=>{prompt('コピーしてね',full);});}catch(e){prompt('コピーしてね',full);}
});
$('startBtn').addEventListener('click',startGame);
$('againBtn').addEventListener('click',startGame);
window.addEventListener('resize',resize);

renderModes();
renderMute();renderShells();renderLevel();
resize();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(resize);
requestAnimationFrame(frame);
})();
</script>

</body></html>
